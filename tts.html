<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- This document must never send a Referer. Google translate_tts 404s any
     non-Google Referer; Safari often attaches github.io even when the parent
     page asked for no-referrer on an <audio> element. -->
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TTS</title>
</head>
<body>
<script>
(function () {
  var SILENT = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
  /* Keep in step with index.html TTS_FETCH_MS / TTS_PLAY_MS. Parent waits
     longer than FETCH+PLAY so it does not kill a slow-but-working download. */
  var FETCH_MS = 2500;
  var PLAY_MS = 2500;
  var audio = document.createElement("audio");
  audio.setAttribute("playsinline", "");
  audio.setAttribute("webkit-playsinline", "");
  try { audio.playsInline = true; } catch (e) {}
  try { audio.setAttribute("referrerpolicy", "no-referrer"); } catch (e) {}
  try { audio.referrerPolicy = "no-referrer"; } catch (e) {}
  audio.preload = "auto";
  document.body.appendChild(audio);

  var objectUrl = null;
  var speakSeq = 0;
  var fetchAbort = null;
  var fetchTimer = null;
  var mediaUnlocked = false;
  var mediaHandlers = null;

  function tell(type, extra) {
    try {
      if (parent && parent !== window) {
        parent.postMessage(Object.assign({ type: type }, extra || {}), "*");
      }
    } catch (e) {}
  }

  function revoke() {
    if (!objectUrl) return;
    try { URL.revokeObjectURL(objectUrl); } catch (e) {}
    objectUrl = null;
  }

  function clearMediaHandlers() {
    if (!mediaHandlers) return;
    try {
      audio.removeEventListener("playing", mediaHandlers.onPlaying);
      audio.removeEventListener("ended", mediaHandlers.onEnded);
      audio.removeEventListener("error", mediaHandlers.onError);
    } catch (e) {}
    mediaHandlers = null;
  }

  function abortFetch() {
    if (fetchTimer) {
      clearTimeout(fetchTimer);
      fetchTimer = null;
    }
    if (fetchAbort) {
      try { fetchAbort.abort(); } catch (e) {}
      fetchAbort = null;
    }
  }

  function ttsUrl(q) {
    return "https://translate.googleapis.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ja&q="
      + encodeURIComponent(q)
      + "&total=1&idx=0&textlen=" + encodeURIComponent(String(q.length))
      + "&_=" + Date.now();
  }

  function isSilentSrc() {
    var src = "";
    try { src = audio.currentSrc || audio.src || ""; } catch (e) {}
    return src.indexOf("data:") === 0;
  }

  /* Unlock once. Re-running silent play on every Arrange tap was pausing the
     next real utterance when the silent play() promise resolved late. */
  function unlock() {
    if (mediaUnlocked) {
      tell("tts-unlocked");
      return;
    }
    var unlockSeq = speakSeq;
    clearMediaHandlers();
    try { audio.pause(); } catch (e) {}
    audio.src = SILENT;
    var p = audio.play();
    if (p && typeof p.then === "function") {
      p.then(function () {
        mediaUnlocked = true;
        /* Only pause the silent clip — never a barge-in speak that started
           while this unlock promise was still settling. */
        if (speakSeq === unlockSeq && isSilentSrc()) {
          try { audio.pause(); } catch (e) {}
        }
        tell("tts-unlocked");
      }).catch(function () {
        mediaUnlocked = true;
        tell("tts-unlocked");
      });
    } else {
      mediaUnlocked = true;
      tell("tts-unlocked");
    }
  }

  /* Parent owns Web Speech fallback — avoid double-speaking from this frame. */
  function fail(seq, q, reason) {
    if (seq !== speakSeq) return;
    tell("tts-error", { reason: reason || "error", q: q });
  }

  function playBlobOrSrc(seq, q, src) {
    if (seq !== speakSeq) return;
    clearMediaHandlers();
    try { audio.pause(); } catch (e) {}
    audio.src = src;
    var settled = false;
    function onPlaying() {
      if (seq !== speakSeq || settled) return;
      settled = true;
      tell("tts-playing", { q: q });
    }
    function onEnded() {
      if (seq !== speakSeq) return;
      tell("tts-ended", { q: q });
    }
    function onError() {
      if (seq !== speakSeq || settled) return;
      settled = true;
      fail(seq, q, "media-error");
    }
    mediaHandlers = { onPlaying: onPlaying, onEnded: onEnded, onError: onError };
    audio.addEventListener("playing", onPlaying);
    audio.addEventListener("ended", onEnded);
    audio.addEventListener("error", onError);
    var p = audio.play();
    if (p && typeof p.then === "function") {
      p.then(function () {
        if (seq !== speakSeq || settled) return;
        settled = true;
        tell("tts-playing", { q: q });
      }).catch(function (err) {
        if (seq !== speakSeq || settled) return;
        /* AbortError = a newer speak/stop barged in — not a failure. */
        if (err && err.name === "AbortError") return;
        settled = true;
        fail(seq, q, err && err.name ? err.name : "play-rejected");
      });
    }
    setTimeout(function () {
      if (seq !== speakSeq || settled) return;
      if (audio.error || (audio.paused && audio.currentTime === 0)) {
        settled = true;
        fail(seq, q, "timeout");
      }
    }, PLAY_MS);
  }

  function speak(q) {
    q = String(q || "");
    if (!q) { tell("tts-error", { reason: "empty" }); return; }
    /* Barge-in: each speak supersedes any in-flight fetch/play. */
    var seq = ++speakSeq;
    abortFetch();
    clearMediaHandlers();
    revoke();
    try { audio.pause(); } catch (e) {}
    var url = ttsUrl(q);
    if (typeof fetch !== "function") {
      playBlobOrSrc(seq, q, url);
      return;
    }
    var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    fetchAbort = ctrl;
    fetchTimer = setTimeout(function () {
      try { if (ctrl) ctrl.abort(); } catch (e) {}
    }, FETCH_MS);
    fetch(url, {
      referrerPolicy: "no-referrer",
      cache: "no-store",
      mode: "cors",
      signal: ctrl ? ctrl.signal : undefined
    })
      .then(function (r) {
        if (fetchTimer) { clearTimeout(fetchTimer); fetchTimer = null; }
        if (!r.ok) throw new Error("http-" + r.status);
        return r.blob();
      })
      .then(function (blob) {
        if (seq !== speakSeq) return;
        if (!blob || !blob.size) throw new Error("empty-blob");
        objectUrl = URL.createObjectURL(blob);
        playBlobOrSrc(seq, q, objectUrl);
      })
      .catch(function () {
        if (fetchTimer) { clearTimeout(fetchTimer); fetchTimer = null; }
        if (seq !== speakSeq) return;
        /* One direct <audio src> retry, then parent Web-Speech fallback. */
        playBlobOrSrc(seq, q, url);
      });
  }

  function stop() {
    speakSeq++;
    abortFetch();
    clearMediaHandlers();
    try { audio.pause(); } catch (e) {}
    revoke();
  }

  window.addEventListener("message", function (ev) {
    var d = ev && ev.data;
    if (!d || typeof d !== "object") return;
    if (d.type === "tts-unlock") unlock();
    else if (d.type === "tts-speak") speak(d.q);
    else if (d.type === "tts-stop") stop();
  });

  tell("tts-ready");
})();
</script>
</body>
</html>
