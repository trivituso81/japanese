<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- This document must never send a Referer. Google translate_tts 404s any
     non-Google Referer; Safari often attaches github.io even when the parent
     page asked for no-referrer on an <audio> element. -->
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TTS</title>
</head>
<body>
<script>
(function () {
  var SILENT = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
  var FETCH_MS = 2000;
  var PLAY_MS = 2000;
  var audio = document.createElement("audio");
  audio.setAttribute("playsinline", "");
  audio.setAttribute("webkit-playsinline", "");
  try { audio.playsInline = true; } catch (e) {}
  try { audio.setAttribute("referrerpolicy", "no-referrer"); } catch (e) {}
  try { audio.referrerPolicy = "no-referrer"; } catch (e) {}
  audio.preload = "auto";
  document.body.appendChild(audio);

  var objectUrl = null;
  var speakSeq = 0;
  var fetchAbort = null;

  function tell(type, extra) {
    try {
      if (parent && parent !== window) {
        parent.postMessage(Object.assign({ type: type }, extra || {}), "*");
      }
    } catch (e) {}
  }

  function revoke() {
    if (!objectUrl) return;
    try { URL.revokeObjectURL(objectUrl); } catch (e) {}
    objectUrl = null;
  }

  function ttsUrl(q) {
    return "https://translate.googleapis.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ja&q="
      + encodeURIComponent(q)
      + "&total=1&idx=0&textlen=" + encodeURIComponent(String(q.length))
      + "&_=" + Date.now();
  }

  function unlock() {
    try { audio.pause(); } catch (e) {}
    audio.src = SILENT;
    var p = audio.play();
    if (p && typeof p.then === "function") {
      p.then(function () {
        try { audio.pause(); } catch (e) {}
        tell("tts-unlocked");
      }).catch(function () { tell("tts-unlocked"); });
    } else {
      tell("tts-unlocked");
    }
  }

  /* Parent owns Web Speech fallback — avoid double-speaking from this frame. */
  function fail(seq, q, reason) {
    if (seq !== speakSeq) return;
    tell("tts-error", { reason: reason || "error", q: q });
  }

  function playBlobOrSrc(seq, q, src) {
    if (seq !== speakSeq) return;
    try { audio.pause(); } catch (e) {}
    audio.src = src;
    var settled = false;
    function onPlaying() {
      if (seq !== speakSeq || settled) return;
      settled = true;
      tell("tts-playing", { q: q });
    }
    function onEnded() {
      if (seq !== speakSeq) return;
      tell("tts-ended", { q: q });
    }
    function onError() {
      if (seq !== speakSeq || settled) return;
      settled = true;
      fail(seq, q, "media-error");
    }
    audio.addEventListener("playing", onPlaying, { once: true });
    audio.addEventListener("ended", onEnded, { once: true });
    audio.addEventListener("error", onError, { once: true });
    var p = audio.play();
    if (p && typeof p.then === "function") {
      p.then(function () {
        if (seq !== speakSeq || settled) return;
        settled = true;
        tell("tts-playing", { q: q });
      }).catch(function (err) {
        if (seq !== speakSeq || settled) return;
        settled = true;
        fail(seq, q, err && err.name ? err.name : "play-rejected");
      });
    }
    setTimeout(function () {
      if (seq !== speakSeq || settled) return;
      if (audio.error || (audio.paused && audio.currentTime === 0)) {
        settled = true;
        fail(seq, q, "timeout");
      }
    }, PLAY_MS);
  }

  function speak(q) {
    q = String(q || "");
    if (!q) { tell("tts-error", { reason: "empty" }); return; }
    var seq = ++speakSeq;
    revoke();
    if (fetchAbort) {
      try { fetchAbort.abort(); } catch (e) {}
      fetchAbort = null;
    }
    var url = ttsUrl(q);
    if (typeof fetch !== "function") {
      playBlobOrSrc(seq, q, url);
      return;
    }
    var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    fetchAbort = ctrl;
    var fetchTimer = setTimeout(function () {
      try { if (ctrl) ctrl.abort(); } catch (e) {}
    }, FETCH_MS);
    fetch(url, {
      referrerPolicy: "no-referrer",
      cache: "no-store",
      mode: "cors",
      signal: ctrl ? ctrl.signal : undefined
    })
      .then(function (r) {
        clearTimeout(fetchTimer);
        if (!r.ok) throw new Error("http-" + r.status);
        return r.blob();
      })
      .then(function (blob) {
        if (seq !== speakSeq) return;
        if (!blob || !blob.size) throw new Error("empty-blob");
        objectUrl = URL.createObjectURL(blob);
        playBlobOrSrc(seq, q, objectUrl);
      })
      .catch(function () {
        clearTimeout(fetchTimer);
        if (seq !== speakSeq) return;
        /* Direct <audio src> as one quick retry, then parent falls back. */
        playBlobOrSrc(seq, q, url);
      });
  }

  window.addEventListener("message", function (ev) {
    var d = ev && ev.data;
    if (!d || typeof d !== "object") return;
    if (d.type === "tts-unlock") unlock();
    else if (d.type === "tts-speak") speak(d.q);
    else if (d.type === "tts-stop") {
      speakSeq++;
      if (fetchAbort) {
        try { fetchAbort.abort(); } catch (e) {}
        fetchAbort = null;
      }
      try { audio.pause(); } catch (e) {}
      revoke();
    }
  });

  tell("tts-ready");
})();
</script>
</body>
</html>
