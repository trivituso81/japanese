les shaped whose contribution counted as apt. As with Heian exchanges, meaning lived partly in allusion and situation rather than literal content alone.", "The vocabulary and grammar of medieval texts differ from contemporary Japanese. Corpus resources make these changes investigable. In the game, learn the historical concept first; do not assume that a modern polite sentence recreates a medieval poet's exact voice."], "question": "What skill does linked verse especially highlight?", "options": ["Making a fitting contribution in relation to other people's words.", "Ignoring the previous verse to write an unrelated slogan.", "Using one identical formula regardless of season or context."], "answer": 0, "why": "Collaborative genres make the social and contextual nature of language unusually visible.", "term": {"romaji": "renga", "jp": "連歌", "meaning": "Linked verse composed through successive, connected contributions."}, "refs": ["chj", "muromachi"]}]}, {"id": "sengoku", "name": "War & unification", "jp": "戦国", "dates": "1467-1603", "tag": "Rebuild the rules of power", "desc": "Warlords, village bargaining, gunpowder, surveyors, and three unifiers remake the political landscape.", "region": "Contending domains across Japan", "artifact": "Land survey ledger", "refs": ["swords", "buke", "samurai", "porcelain"], "power": "Territorial lords sought control over land and followers; unifiers increasingly constrained independent power.", "life": "Villages negotiated demands while armies, castles, markets, and surveys reorganized resources.", "voice": "Oaths and orders made relationships explicit; later heroic stories often simplify changing loyalties.", "lessons": [{"id": "sengoku-1", "title": "Not just a samurai free-for-all", "lens": "World", "scene": "A territorial lord needs food, information, and cooperation.", "pages": ["The Sengoku age overlapped the later Muromachi period. Warfare and political fragmentation encouraged regional lords to consolidate territorial power. Success depended not only on courage but on administration, supply, alliances, and the ability to manage relations with local communities.", "Firearms, associated with Portuguese arrival in 1543, were adopted and produced in Japan. They were important but did not instantly make every earlier weapon or institution irrelevant. Military change involved tactics, resources, training, and organization as well as hardware.", "Oda Nobunaga, Toyotomi Hideyoshi, and Tokugawa Ieyasu are conventionally remembered as three unifiers. Their strategies differed and built on many other people's efforts. A sequence of famous names is useful only when connected to the institutions they altered."], "question": "What made a successful territorial lord more than a battlefield champion?", "options": ["The ability to organize revenue, supply, alliances, and administration.", "Personal swordsmanship alone determined political outcomes.", "Acquiring firearms immediately removed every other military requirement."], "answer": 0, "why": "War depended on social and logistical systems that made armed force sustainable.", "term": {"romaji": "daimyo", "jp": "大名", "meaning": "A powerful territorial lord; the institution changed over medieval and early modern history."}, "refs": ["swords", "buke", "samurai", "porcelain"]}, {"id": "sengoku-2", "title": "Measure land, change the bargain", "lens": "Power", "scene": "A surveyor arrives to assess fields and production.", "pages": ["Hideyoshi's land surveys sought to define holdings and assess productive capacity. Recording resources helped rulers organize revenue and obligations. Measurement was political because it could clarify, displace, or restrict overlapping claims to land and its produce.", "The sword hunt of 1588 aimed to disarm farmers and strengthen a distinction between cultivators and warriors. Implementation varied, and occupational boundaries did not become perfectly rigid everywhere at once. The policy nevertheless points toward a new social order.", "Together, surveys and disarmament made resources and coercion more legible to rulers. Compare them with the Nara register: different systems, similar questions about who can count, classify, and compel. Administrative techniques can be instruments of unification."], "question": "Why were land surveys central to unification?", "options": ["They helped rulers define revenue and obligations more systematically.", "They were only artistic drawings with no fiscal purpose.", "They guaranteed that every household welcomed the new regime."], "answer": 0, "why": "Control grows when a regime can connect recorded resources to enforceable demands.", "term": {"romaji": "kenchi", "jp": "検地", "meaning": "A land survey used to assess fields, holdings, and productive capacity."}, "refs": ["swords", "buke"]}, {"id": "sengoku-3", "title": "An army eats before it fights", "lens": "Daily life", "scene": "A campaign is approaching harvest time.", "pages": ["Ashigaru were foot soldiers whose recruitment and roles changed over time. Armies depended on people who supplied food, carried equipment, built works, and maintained routes. The mounted warrior is only one part of the military labor system.", "Villagers could face requisitions, damage, displacement, and competing demands. They were not always passive: communities negotiated, defended interests, and sometimes organized collectively. Choices were constrained by local power, resources, and the risks of retaliation.", "Castle towns concentrated military and economic functions. Merchants and craftspeople could gain customers while becoming subject to new regulation. Unification redistributed opportunities and burdens; it was not experienced simply as an identical improvement by everyone."], "question": "Why is harvest timing a military issue?", "options": ["Campaigning draws on agricultural labor and food supplies.", "Armies had no dependence on farming households.", "Foot soldiers never required logistical support."], "answer": 0, "why": "Military capacity is partly a question of when and how a society can mobilize labor and food.", "term": {"romaji": "ashigaru", "jp": "足軽", "meaning": "Foot soldiers; their recruitment, equipment, and status varied across time."}, "refs": ["samurai", "swords"]}, {"id": "sengoku-4", "title": "The tea room and the invasion", "lens": "Society", "scene": "An exquisite object carries both cultural prestige and a difficult history.", "pages": ["Tea gatherings could connect powerful patrons, merchants, and cultural specialists. Objects and expertise carried prestige. The tea room was not inherently outside hierarchy simply because participants valued restraint or carefully choreographed interaction.", "Hideyoshi invaded Korea in 1592 and again in 1597. The campaigns brought immense destruction, displacement, and suffering. Cultural connections must not be romanticized when they involved coercion: Korean potters taken to Japan contributed to later ceramic production.", "Studying a beautiful object therefore includes asking how skills and people moved. Exchange, invitation, migration, and forced removal are different processes. Cultural influence should never be used to erase the violence that sometimes accompanied it."], "question": "What must an account of Korean potters in Japan distinguish?", "options": ["Voluntary exchange from displacement and coercion linked to war.", "Artistic influence from all political circumstances.", "Every movement of artisans as an equally free choice."], "answer": 0, "why": "A history of material culture must also be a history of the people and conditions behind it.", "term": {"romaji": "chanoyu", "jp": "茶の湯", "meaning": "The practice of preparing and sharing tea in cultivated, historically changing settings."}, "refs": ["porcelain", "samurai"]}, {"id": "sengoku-5", "title": "A slogan is not a constitution", "lens": "Language", "scene": "A ruler claims authority over tenka, \"all under heaven.\"", "pages": ["Tenka is a political expression often rendered as all under heaven or the realm. Its scope and use depended on context. A grand claim could announce an ambition to order politics without describing a fully achieved, uniformly governed territory.", "Letters, oaths, and edicts used language to create obligations and negotiate loyalty. Their wording matters because followers and rivals could interpret promises strategically. A document was often an action within politics, not merely a later account of it.", "Modern stories can turn shifting alliances into simple tests of timeless loyalty. Historical actors balanced family survival, service, opportunity, and coercion. Read what a promise committed someone to, who could enforce it, and what happened when circumstances changed."], "question": "How should a ruler's universal-sounding slogan be read?", "options": ["As a contextual claim to authority, not automatic proof of complete control.", "As a precise census of the population under direct administration.", "As language without any political purpose."], "answer": 0, "why": "Rhetoric helps construct power but is not identical to power's actual reach.", "term": {"romaji": "tenka", "jp": "天下", "meaning": "All under heaven or the realm; a contextual political claim rather than a fixed modern border."}, "refs": ["swords", "buke"]}]}, {"id": "edo", "name": "Edo", "jp": "江戸", "dates": "1603-1853", "tag": "Peace has rules. Cities have energy.", "desc": "Visit a shogun's political system, a crowded neighborhood, and a world of print and exchange.", "region": "Edo, Osaka, Kyoto, and regulated gateways", "artifact": "Woodblock print", "refs": ["buke", "classes", "hagakure", "porcelain", "chj"], "power": "Tokugawa shoguns governed alongside domain lords; imperial legitimacy remained centered in Kyoto.", "life": "Villages paid dues while large cities supported trade, crafts, publishing, and dense neighborhood life.", "voice": "Status and setting shaped interaction, but dialects, professions, and genres prevented one universal voice.", "lessons": [{"id": "edo-1", "title": "A country connected through gateways", "lens": "World", "scene": "A Dutch book arrives even though you heard Japan was \"closed.\"", "pages": ["Tokugawa Ieyasu became shogun in 1603 after his victory at Sekigahara in 1600. The regime constrained powerful lords while allowing domains considerable internal administration. Relative peace did not mean the absence of conflict, protest, or coercion.", "Restrictions on Christianity, travel, and overseas contact developed through specific measures, especially in the seventeenth century. Yet regulated exchange continued: Nagasaki connected with Dutch and Chinese traders; other routes involved Korea, Ryukyu, and Ainu communities.", "\"Closed country\" is therefore an oversimplification. The better question is who controlled which gateways, who was excluded, and how information traveled. Japanese porcelain reaching European buyers is tangible evidence that selective international connections continued."], "question": "Which description best replaces \"Edo Japan had no foreign contact\"?", "options": ["Contact was restricted and managed through several different gateways.", "Every resident could travel abroad without restriction.", "No foreign books or goods ever entered."], "answer": 0, "why": "Restriction and total isolation are different. Regulated connections shaped both knowledge and commerce.", "term": {"romaji": "kaikin", "jp": "海禁", "meaning": "Maritime restrictions; a useful term for controlled overseas movement and exchange."}, "refs": ["porcelain", "buke"]}, {"id": "edo-2", "title": "The expensive commute", "lens": "Power", "scene": "A daimyo must maintain obligations in both a domain and Edo.", "pages": ["Alternate attendance, sankin-kotai, required domain lords to spend periods in Edo under an evolving system of regulation. Maintaining residences and traveling with entourages was expensive. Family residence arrangements also reinforced shogunal leverage over lords.", "The system did more than drain money. It created repeated contact with the political center and stimulated transport, consumption, and urban services. A control mechanism could have economic and cultural consequences beyond its most obvious political purpose.", "The bakuhan order joined shogunal and domain authority rather than placing every village under identical direct central administration. Domains varied. Kyoto's imperial court also remained important to legitimacy even though it did not govern in the same way as the military regime."], "question": "What made alternate attendance politically useful?", "options": ["It tied lords to Edo through presence, expense, and family arrangements.", "It granted every lord complete independence from the shogunate.", "It abolished domain administration."], "answer": 0, "why": "A ruler can control other elites through obligations and relationships rather than only through direct annexation.", "term": {"romaji": "sankin-kotai", "jp": "参勤交代", "meaning": "Alternate attendance: regulated residence obligations linking daimyo with Edo."}, "refs": ["buke", "classes"]}, {"id": "edo-3", "title": "Your wall is your neighbor's wall", "lens": "Daily life", "scene": "You rent a room in a crowded urban neighborhood.", "pages": ["Nagaya were row-house or tenement-style dwellings associated with urban commoner life. Residents could share facilities and live in close proximity. Water, fire, sanitation, work, and neighborhood obligations made daily life deeply interdependent.", "The familiar four-status model places warriors, farmers, artisans, and merchants in an ideological order. Real society was more complicated: wealth did not align neatly with rank, identities could overlap, and marginalized communities and other groups do not fit the diagram well.", "Urban merchants might possess money but lack a warrior's formal standing. A samurai might have high status and serious debt. Separate prestige, legal status, income, and decision-making power rather than treating \"class\" as one ladder with a single measurement."], "question": "How could a wealthy merchant and an indebted samurai coexist in this hierarchy?", "options": ["Economic resources and formal status did not always align.", "Every wealthy person automatically became a samurai.", "Merchants were prohibited from participating in any economic activity."], "answer": 0, "why": "Rank and wealth were related but distinct dimensions of power.", "term": {"romaji": "nagaya", "jp": "長屋", "meaning": "A row-house or tenement-style dwelling associated with urban commoner neighborhoods."}, "refs": ["classes"]}, {"id": "edo-4", "title": "The bookshop changes the city", "lens": "Society", "scene": "A reader chooses a practical manual alongside entertainment.", "pages": ["Publishing and commercial entertainment helped circulate knowledge, fashions, and stories. Reading practices varied, including shared reading and oral performance. Growing access to print did not mean universal literacy or identical educational opportunities.", "Terakoya and other forms of schooling taught practical skills to some commoner children. Access varied with locality, household resources, gender, and occupation. Learning could support trade, correspondence, or management without resembling a modern compulsory school system.", "Kabuki, prints, and pleasure-quarter culture were part of an urban commercial world. Their appeal should not obscure censorship, status restrictions, or exploitation. The \"floating world\" is a cultural lens, not a description of every Edo resident's opportunities."], "question": "What is the safest conclusion from growing publishing and schooling?", "options": ["Knowledge circulated more widely, but access and literacy remained uneven.", "Every child attended the same compulsory school.", "A popular entertainment print represents all of society equally."], "answer": 0, "why": "Expansion is not universality. Ask who had access and how materials were used.", "term": {"romaji": "terakoya", "jp": "寺子屋", "meaning": "A form of commoner schooling associated with practical literacy and numeracy."}, "refs": ["chj", "classes"]}, {"id": "edo-5", "title": "Do not speak in costume cliches", "lens": "Language", "scene": "A period drama teaches you that every samurai said the same thing.", "pages": ["Edo Japanese varied by region, status, occupation, genre, and relationship. Written forms and spoken practice were not identical. A theatrical stereotype can be recognizable to modern audiences without serving as a reliable transcript of ordinary conversation.", "The term ukiyo, floating world, acquired associations with urban pleasures and commercial culture. Words can carry layers of earlier religious meaning and later social use. A dictionary gloss should be connected to the setting in which a word mattered.", "Hagakure was produced in the early eighteenth century and was not a universal warrior manual read by every samurai. Its later fame shaped modern ideas about bushido. A text's date, circulation, and reception matter as much as its memorable statements."], "question": "Why should Hagakure not be treated as every samurai's timeless rulebook?", "options": ["It had a particular context and limited early circulation, followed by later reinterpretation.", "It was written before the first people reached the islands.", "All warriors shared one identical spoken and written culture."], "answer": 0, "why": "A famous later reputation can distort how influential a source was in its own time.", "term": {"romaji": "ukiyo", "jp": "浮世", "meaning": "Floating world; in early modern cultural settings, associated with transience and urban pleasures."}, "refs": ["hagakure", "chj"]}]}, {"id": "bakumatsu", "name": "Bakumatsu", "jp": "幕末", "dates": "1853-1868", "tag": "An old order loses its balance", "desc": "Foreign pressure interacts with domestic conflict, new networks, and contested visions of the future.", "region": "Treaty ports, Kyoto, and major domains", "artifact": "Foreign-language dictionary", "refs": ["aizawa", "fukuzawa", "oath", "iwakura"], "power": "The shogunate, court, major domains, and activist networks disputed legitimate leadership.", "life": "Treaty-port exchange and price changes created opportunities for some and hardship for others.", "voice": "Political slogans mobilized people, while translation made unfamiliar institutions available for debate.", "lessons": [{"id": "bakumatsu-1", "title": "Black ships, older pressures", "lens": "World", "scene": "Perry's arrival makes an existing political problem harder to postpone.", "pages": ["Commodore Matthew Perry arrived in 1853 with American warships. The 1854 agreement opened specified ports for provisioning and related contact; commercial treaties followed later in the decade. These were distinct steps, not one single treaty opening everything at once.", "Military pressure mattered, but domestic fiscal strain, political rivalries, and existing debates also shaped the crisis. Japanese leaders assessed a world in which Western powers had imposed coercive arrangements elsewhere in Asia. Responses combined fear, calculation, and experimentation.", "Treaty provisions such as extraterritoriality and limited tariff autonomy became symbols of unequal sovereignty. Understanding the institutional details explains why later governments invested so much effort in treaty revision and in demonstrating a form of statehood foreign powers would recognize."], "question": "Why distinguish the agreements of 1854 from later commercial treaties?", "options": ["They introduced different forms and degrees of access and obligation.", "They were the same document signed under two calendar systems.", "Foreign pressure had no role in either agreement."], "answer": 0, "why": "Chronological precision helps connect policy steps with their political and economic consequences.", "term": {"romaji": "kaikoku", "jp": "開国", "meaning": "Opening the country; a conventional label for the expansion of treaty-based foreign relations."}, "refs": ["iwakura", "fukuzawa"]}, {"id": "bakumatsu-2", "title": "A slogan with changing users", "lens": "Power", "scene": "An activist calls for honoring the emperor and expelling foreigners.", "pages": ["Sonno joi expressed reverence for the emperor and opposition to foreign intrusion. Its users did not all share one stable political program. Imperial symbolism could challenge the shogunate, while the practical meaning of expulsion changed as confrontations exposed military realities.", "Powerful domains developed their own strategies, including acquiring foreign weapons and expertise. Opposing the shogunate did not necessarily mean rejecting every foreign technology. Political coalitions were built through changing calculations rather than one perfectly consistent ideology.", "The 1868 Restoration transferred authority under an imperial banner and was followed by civil conflict and institutional transformation. It was not simply the emperor personally replacing all shogunal officials in one day. Networks of leaders shaped the new regime."], "question": "How could an anti-shogunate domain also purchase foreign weapons?", "options": ["Political goals and practical choices could evolve under pressure.", "Every use of the slogan required rejection of all foreign objects forever.", "The emperor personally managed every domain's procurement."], "answer": 0, "why": "Slogans simplify coalitions; actions reveal strategic adaptation and internal differences.", "term": {"romaji": "sonno joi", "jp": "尊王攘夷", "meaning": "Honor the emperor, expel the foreigners; a politically powerful but variable slogan."}, "refs": ["aizawa", "oath"]}, {"id": "bakumatsu-3", "title": "The port creates winners and losers", "lens": "Daily life", "scene": "Your product finds new buyers, while the price of necessities rises.", "pages": ["Expanded foreign trade reshaped markets for goods such as silk and tea. Treaty ports created work for merchants, producers, interpreters, and intermediaries. Opportunities were unevenly distributed, and growing demand could affect local supplies and prices.", "Households encountered political change through purchasing power, employment, taxes, and uncertainty. A narrative centered only on diplomats misses how global connections entered ordinary budgets. The same development could enrich a trader and burden a consumer.", "Yokohama became a major treaty-port city. Its built environment and social encounters exposed residents to new goods and practices. Yet ports did not represent the entire country, and encounters were structured by treaties, status, and unequal power."], "question": "Why might the same increase in trade help one household and hurt another?", "options": ["Households occupied different positions as producers, intermediaries, and consumers.", "Trade always changes every income and price by the same amount.", "Only diplomats could be affected by a commercial treaty."], "answer": 0, "why": "Distribution matters: national change is experienced through different economic relationships.", "term": {"romaji": "Yokohama", "jp": "横浜", "meaning": "A major treaty-port city opened to foreign trade in 1859."}, "refs": ["fukuzawa", "iwakura"]}, {"id": "bakumatsu-4", "title": "The translator has leverage", "lens": "Society", "scene": "A person with language skills becomes valuable to competing patrons.", "pages": ["Rangaku, Dutch learning, developed before Perry and provided channels for studying medicine, science, and other fields. Japan did not begin learning about the outside world from zero in 1853. Earlier restricted contact had still transmitted important knowledge.", "Fukuzawa Yukichi studied Dutch and then English, traveled abroad, and became a prominent interpreter of foreign institutions and customs. His career shows how intellectual skills could become social and political resources during rapid transformation.", "Translation involved comparison and judgment, not merely substituting words. Which foreign practices should be adopted, adapted, or rejected became central questions. People who could frame those choices gained influence beyond their original status or local setting."], "question": "What does rangaku reveal about the period before Perry?", "options": ["Useful foreign knowledge circulated through restricted channels.", "The country had no knowledge of any foreign science.", "Every resident freely studied abroad."], "answer": 0, "why": "Selective contact could sustain substantial learning even under restrictive policies.", "term": {"romaji": "rangaku", "jp": "蘭学", "meaning": "Dutch learning: study of knowledge transmitted substantially through Dutch-language channels."}, "refs": ["fukuzawa"]}, {"id": "bakumatsu-5", "title": "A new word needs an explanation", "lens": "Language", "scene": "A foreign institution has no effortless one-word equivalent.", "pages": ["Translators and writers had to explain unfamiliar political, economic, and scientific concepts. Choosing a term also shaped how readers understood the institution. A translation could make something seem familiar, radical, admirable, or dangerous.", "Learning a foreign language was therefore connected with debates about the future. Gakumon, learning or scholarship, became an important resource for interpreting new possibilities. But access depended on education, patrons, institutions, and the costs of study.", "Do not assume that a modern Japanese political word carried exactly its current meaning at first use. Concepts change through argument and practice. Follow a term across texts rather than treating the dictionary as a history of its meaning."], "question": "Why is translation part of political history?", "options": ["Naming and explaining institutions shapes how people evaluate possible changes.", "Foreign concepts arrive with one inevitable and unchanging meaning.", "Language learning is unrelated to access or social power."], "answer": 0, "why": "The terms available for a debate help define what people can propose and contest.", "term": {"romaji": "gakumon", "jp": "学問", "meaning": "Learning or scholarship; a resource for interpreting institutions and practical knowledge."}, "refs": ["fukuzawa", "chj"]}]}, {"id": "meiji", "name": "Meiji", "jp": "明治", "dates": "1868-1912", "tag": "A new state enters your home", "desc": "Schools, taxes, conscription, industry, constitutions, and empire make transformation personal.", "region": "A centralized state and an expanding empire", "artifact": "School textbook", "refs": ["oath", "meijiconst", "iwakura", "silk", "ryukyu"], "power": "A new ruling elite centralized institutions under imperial sovereignty; elected politics developed within limits.", "life": "National schooling, military service, money taxes, and industrial work altered household obligations.", "voice": "Standardization expanded alongside translation; language policy also marginalized regional and colonized voices.", "lessons": [{"id": "meiji-1", "title": "Restoration is a reconstruction", "lens": "World", "scene": "A government invokes the emperor while dismantling older institutions.", "pages": ["The Meiji Restoration of 1868 became the opening of a far-reaching transformation. Domains were abolished in favor of prefectural administration in 1871. Former samurai leaders helped construct institutions that undermined hereditary warrior privileges.", "The Charter Oath set out broad commitments, including seeking knowledge internationally. The Iwakura Mission studied foreign institutions and attempted treaty revision. Leaders borrowed selectively, aiming to strengthen the state rather than simply become a copy of one foreign country.", "National integration and imperial expansion must be studied together. Japan acquired Taiwan in 1895 and annexed Korea in 1910. The opportunities created for some people rested alongside coercion, dispossession, and unequal rule experienced by others."], "question": "Why is \"restoration\" not a complete description of Meiji change?", "options": ["Invoking imperial legitimacy accompanied major new institutions and social transformations.", "The government restored every old domain unchanged.", "Foreign models were irrelevant to the new leadership."], "answer": 0, "why": "The language of restoration can authorize radical institutional innovation.", "term": {"romaji": "ishin", "jp": "維新", "meaning": "Renewal or restoration; associated with the political transformation beginning in 1868."}, "refs": ["oath", "meijiconst", "iwakura", "silk", "ryukyu"]}, {"id": "meiji-2", "title": "A constitution, but whose sovereignty?", "lens": "Power", "scene": "You examine the rules of the new national political system.", "pages": ["The Meiji Constitution was promulgated in 1889. It established a Diet while locating sovereignty in the emperor. Ministers and military institutions had relationships to imperial authority that differed from a system in which a cabinet depends entirely on parliamentary confidence.", "The elected lower house initially represented a limited male electorate defined by tax qualifications. Popular-rights movements helped make representation an issue, but constitutional government did not mean universal participation or rights without statutory limits.", "The new fiscal order included a land tax paid in money, linking state revenue and household exposure to markets. Rights, duties, and resources were being reconfigured together. Read institutional design alongside the material obligations that made state power effective."], "question": "What is the key difference from the postwar constitutional order?", "options": ["The Meiji Constitution located sovereignty in the emperor rather than the people.", "The Meiji system had no written constitution.", "Every adult resident voted in national elections from 1889."], "answer": 0, "why": "A parliament alone does not establish popular sovereignty or universal suffrage.", "term": {"romaji": "chiso", "jp": "地租", "meaning": "Land tax; the Meiji reform made monetary payment central to the new fiscal order."}, "refs": ["meijiconst", "oath"]}, {"id": "meiji-3", "title": "The nation needs your time", "lens": "Daily life", "scene": "A household must balance schooling, work, taxes, and new obligations.", "pages": ["National education policy and military conscription expanded the state's reach into everyday life. School attendance developed unevenly and imposed real costs on households that depended on children's work. A government announcement did not produce immediate universal compliance.", "Industrialization drew heavily on textile production and the labor of women and girls. Tomioka was a prominent model silk mill linked with imported machinery and expertise. Conditions varied across workplaces; one model institution should not stand for every factory.", "Wage work could bring income, skills, and new experiences alongside discipline, long hours, and vulnerability. Avoid portraying industrial workers as either universally liberated or without agency. Their options were shaped by household needs, contracts, employers, and wider markets."], "question": "Why should one model silk mill not represent all industrial labor?", "options": ["Conditions and workers' experiences differed across institutions and industries.", "Industrialization required no household decisions.", "Only men participated in the textile economy."], "answer": 0, "why": "An exemplary site can illuminate a process while remaining unrepresentative of many other workplaces.", "term": {"romaji": "jogaku", "jp": "女学", "meaning": "Women's education; its expansion and purposes were contested in modernizing society."}, "refs": ["silk", "iwakura"]}, {"id": "meiji-4", "title": "Whose modernization?", "lens": "Society", "scene": "A national map looks unified, but communities remember different histories.", "pages": ["The Meiji state incorporated the Ryukyu Kingdom as Okinawa Prefecture in 1879. State-building also transformed Hokkaido and Ainu lives through settlement and assimilation policies. Modern national unity was made through unequal relationships, not simply inherited from antiquity.", "Colonial rule in Taiwan and Korea imposed political domination and changing programs of economic and cultural control. People resisted, adapted, negotiated, and built their own movements. They should appear as historical actors rather than scenery in Japan's rise as a power.", "Older status disabilities were formally altered, yet discrimination did not disappear automatically. The gap between legal reform and lived equality is a recurring historical theme. Evaluate modernization by asking who gained which rights, resources, and choices, and at whose expense."], "question": "What question makes a narrative of modernization more complete?", "options": ["Who gained opportunities, and who faced dispossession, exclusion, or coercion?", "Which technology proves everyone's life improved equally?", "How can colonial subjects be removed from the account?"], "answer": 0, "why": "National success measured from the center can conceal very different experiences at its margins.", "term": {"romaji": "teikoku", "jp": "帝国", "meaning": "Empire; a political order that can incorporate populations under unequal forms of rule."}, "refs": ["ryukyu", "ainu", "meijiconst"]}, {"id": "meiji-5", "title": "Making a national language", "lens": "Language", "scene": "A classroom privileges one form of Japanese over a child's home speech.", "pages": ["National education, print, administration, and later broadcasting helped spread standardized Japanese. Standardization increased communication across regions but also assigned prestige unevenly. A home language or dialect could become something a pupil was pressured to suppress.", "Kokugo, national language, linked language to the modern state. The category was not culturally neutral in an expanding empire. Schooling and assimilation affected Ainu, Ryukyuan, and colonized communities in different ways that require attention to local history.", "Written Japanese also changed as authors sought styles closer to speech. The process was uneven across genres. Modern standard Japanese is therefore a historical outcome, not the unaltered language spoken identically throughout the archipelago from its beginning."], "question": "Why is a standard language both enabling and political?", "options": ["It eases some communication while privileging particular forms and identities.", "It proves every earlier dialect was linguistically defective.", "It emerges without institutions, teaching, or power."], "answer": 0, "why": "A useful common standard can coexist with unequal treatment of other languages and dialects.", "term": {"romaji": "kokugo", "jp": "国語", "meaning": "National language; a modern institutional category linking language and state."}, "refs": ["chj", "ainu", "ryukyu"]}]}, {"id": "taisho", "name": "Taisho", "jp": "大正", "dates": "1912-1926", "tag": "More voices. Unequal rights.", "desc": "Party cabinets, mass media, household protest, and new identities test the limits of participation.", "region": "Cities, villages, and the imperial sphere", "artifact": "Newspaper front page", "refs": ["suffrage", "rice", "chj"], "power": "Party politics expanded within an imperial constitutional system, alongside repression of dissent.", "life": "Inflation, wage work, consumer culture, and rural hardship produced unequal versions of modern life.", "voice": "Newspapers, magazines, fiction, and public speech enlarged debate without giving everyone equal access.", "lessons": [{"id": "taisho-1", "title": "Democracy with an asterisk", "lens": "World", "scene": "A newspaper celebrates political participation while another story records repression.", "pages": ["Taisho democracy is a label for developments extending beyond the reign dates themselves. Party politics, civic movements, labor activism, and public debate grew in importance. The imperial constitutional structure nevertheless remained, and powerful actors stood outside electoral accountability.", "Japan's role in the First World War brought economic and diplomatic opportunities while expanding imperial ambitions. Domestic liberalization did not automatically imply equal treatment of colonized peoples. Democracy at the center and coercion elsewhere could coexist.", "Historical labels are useful invitations, not verdicts. Ask which groups participated, which institutions changed, and whose rights remained limited. The same period can contain meaningful democratic gains and serious constraints without one cancelling the other."], "question": "What does \"Taisho democracy\" require you to investigate?", "options": ["The scope of participation and its limits, including the imperial context.", "An assumption that all adults immediately gained identical rights.", "A claim that repression entirely disappeared."], "answer": 0, "why": "A period label should guide questions rather than substitute for institutional analysis.", "term": {"romaji": "minponshugi", "jp": "民本主義", "meaning": "People-centered government; associated with debates over popular interests within the imperial order."}, "refs": ["suffrage", "rice", "chj"]}, {"id": "taisho-2", "title": "The vote expands, the boundary remains", "lens": "Power", "scene": "The 1925 suffrage reform reaches the Diet.", "pages": ["The 1925 reform removed the property-tax qualification for voting by men aged twenty-five and over, while other exclusions remained. Women did not gain national voting rights through this law. Calling it universal suffrage without qualification obscures a major boundary.", "The Peace Preservation Law was enacted in the same year, targeting challenges to the national polity and private property. Expanded electoral participation and stronger tools for political repression were not mutually exclusive developments. They advanced within the same system.", "This pairing is a useful test of institutional reasoning. Counting voters tells you something important, but not everything, about democracy. Freedom to organize, advocate, criticize, and contest the rules is another dimension of political participation."], "question": "What best captures the political tension of 1925?", "options": ["A wider male electorate accompanied a major new repressive law.", "Women and men both gained unrestricted national suffrage.", "Property qualifications expanded while political policing ended."], "answer": 0, "why": "Participation has multiple dimensions; the franchise and freedom of political activity can move in different directions.", "term": {"romaji": "futsu senkyo", "jp": "普通選挙", "meaning": "Universal suffrage; in the 1925 context, a qualified expansion of male suffrage."}, "refs": ["suffrage"]}, {"id": "taisho-3", "title": "The price of dinner becomes political", "lens": "Daily life", "scene": "Rice prices rise faster than a household can manage.", "pages": ["The Rice Riots of 1918 emerged from anger over prices and spread across varied communities. Women were prominent in early protests associated with coastal Toyama. Household provisioning became a route into collective political action.", "Wartime economic expansion did not benefit everyone equally. Inflation could erode purchasing power even while firms and some workers gained opportunities. A national growth story needs to be checked against household budgets and local employment conditions.", "Urban consumer culture, cafes, and new entertainment coexisted with rural hardship and insecure work. The modern city offered new possibilities but was not the experience of the whole population. Social history asks how these different worlds were linked through markets and migration."], "question": "Why are food-price protests central to political history?", "options": ["Household survival can mobilize people and challenge authorities.", "Only formal officeholders can act politically.", "Economic growth always protects every household's purchasing power."], "answer": 0, "why": "Politics includes collective claims about everyday resources, not only elections and cabinets.", "term": {"romaji": "kome sodo", "jp": "米騒動", "meaning": "Rice disturbances or Rice Riots; especially the widespread protests of 1918."}, "refs": ["rice"]}, {"id": "taisho-4", "title": "A new woman, not one woman", "lens": "Society", "scene": "A magazine debates education, employment, marriage, and independence.", "pages": ["Women's organizations and writers challenged constraints on education, work, and public participation. The \"new woman\" and later \"modern girl\" were influential and contested cultural figures. Media images could exaggerate novelty or turn social debate into a stereotype.", "Women's experiences differed by class, locality, family, and occupation. A fashionable urban image did not represent a farm worker or factory employee. Nor did the visibility of a few writers erase legal and political exclusions.", "The 1923 Great Kanto Earthquake caused catastrophic destruction. In its aftermath, false rumors fueled massacres of Koreans and violence against others. This history requires recognizing how prejudice and misinformation can become collective violence, not treating disaster as purely natural."], "question": "Why should a magazine's \"modern woman\" not stand for all women?", "options": ["It is a selective cultural image shaped by class, audience, and debate.", "Women never participated in public arguments.", "All women experienced identical work, family, and legal conditions."], "answer": 0, "why": "Representation can reveal anxieties and aspirations without functioning as a social census.", "term": {"romaji": "atarashii onna", "jp": "新しい女", "meaning": "New woman; a contested figure in debates about women's roles and independence."}, "refs": ["rice", "suffrage", "chj", "kanto"]}, {"id": "taisho-5", "title": "Writing starts sounding different", "lens": "Language", "scene": "A novel's prose feels closer to speech than an older formal document.", "pages": ["Genbun itchi names movements toward bringing written and spoken language closer together. It developed across the late nineteenth and early twentieth centuries, rather than beginning neatly with the Taisho reign. Writers experimented with voice, narration, and dialogue.", "Mass-circulation newspapers and magazines made style a question of audience and accessibility. Different genres retained different conventions. A legal document, novel, advertisement, and everyday conversation did not suddenly converge into one uniform register.", "Language change can create new forms of intimacy and authority. A narrator who sounds conversational may feel close to readers, but that voice is still crafted. Learn to distinguish the effect of naturalness from a literal transcript of how everyone spoke."], "question": "What does genbun itchi describe?", "options": ["Efforts to bring written expression closer to spoken language.", "A law requiring every genre to use identical sentences.", "The abolition of all regional spoken varieties."], "answer": 0, "why": "A stylistic movement can transform writing without erasing register or regional difference.", "term": {"romaji": "genbun itchi", "jp": "言文一致", "meaning": "The movement toward greater alignment of written and spoken language."}, "refs": ["chj"]}]}, {"id": "war", "name": "Empire & war", "jp": "昭和", "dates": "1926-1945", "tag": "Read this chapter with care", "desc": "Trace authoritarian power, imperial aggression, mobilization, civilian suffering, and defeat.", "region": "Japan and the Asia-Pacific war zones", "artifact": "Civilian diary", "refs": ["manchuria", "kono", "constitution", "nanjing"], "power": "Military institutions, political violence, imperial authority, and mobilization narrowed space for dissent.", "life": "Rationing, conscription, forced labor, displacement, and bombing transformed lives across the empire and beyond.", "voice": "Propaganda, censorship, official euphemisms, private writing, and survivor testimony tell different kinds of truth.", "lessons": [{"id": "war-1", "title": "An empire at war before 1941", "lens": "World", "scene": "A timeline starts at Pearl Harbor. You need to repair what it leaves out.", "pages": ["Japanese officers staged the railway explosion used to justify the occupation of Manchuria in 1931. Manchukuo was established as a puppet state in 1932. Full-scale war with China expanded in 1937, years before the attack on Pearl Harbor in December 1941.", "Japanese forces committed extensive atrocities, including mass killing and sexual violence at Nanjing. Imperial rule also involved forced labor and the coercive military \"comfort women\" system. These are central to the history, not optional footnotes to military campaigns.", "Beginning the story only with Japan's conflict with the United States obscures years of war and suffering in Asia. A complete chronology must include Chinese, Korean, Taiwanese, Southeast Asian, and other experiences without treating any population as a single uniform actor."], "question": "Why is 1941 an inadequate starting point for the wider war history?", "options": ["Japanese expansion and large-scale war in China preceded Pearl Harbor.", "The conflict began only after the atomic bombings.", "Manchukuo was unrelated to Japanese military expansion."], "answer": 0, "why": "Different national narratives choose different beginnings. A connected chronology must include the earlier Asian war.", "term": {"romaji": "Manshu", "jp": "満州", "meaning": "Manchuria, a region in northeast China central to Japanese imperial expansion."}, "refs": ["manchuria", "kono", "constitution", "nanjing"]}, {"id": "war-2", "title": "Who can stop escalation?", "lens": "Power", "scene": "A cabinet announces restraint, but military actors continue expanding.", "pages": ["The 1931 crisis exposed the difficulty of controlling military action. The cabinet adopted a nonexpansion policy, yet the Kwantung Army continued operations. Institutional arrangements, political calculations, and subsequent acceptance helped turn insubordination into enlarged commitments.", "Political assassinations, repression, and military influence weakened party government. This was not a simple process in which one identical view instantly replaced all disagreement. The erosion of constraints involved multiple actors, decisions, and failures of accountability.", "Total mobilization drew labor, industry, information, and household life into the war effort. Analyze who could issue demands, who implemented them, and who bore the consequences. Explaining these mechanisms does not excuse the choices or remove responsibility."], "question": "What does the Manchurian crisis reveal about political control?", "options": ["A formal policy can fail when institutions cannot or will not restrain armed actors.", "A cabinet statement automatically determines every military action.", "Escalation occurs without decisions or responsibility."], "answer": 0, "why": "Authority on paper must be connected with the capacity and willingness to enforce limits.", "term": {"romaji": "sodoin", "jp": "総動員", "meaning": "Total mobilization: organizing society's people and resources for war."}, "refs": ["manchuria"]}, {"id": "war-3", "title": "War reaches the kitchen", "lens": "Daily life", "scene": "A household must find food while meeting neighborhood obligations.", "pages": ["Wartime life involved rationing, shortages, conscription, labor mobilization, and increasingly severe air attacks. Experiences changed over time and differed by location and status. The home front was neither fully separate from war nor experienced identically by all civilians.", "Tonarigumi, neighborhood associations, helped organize distribution, civil defense, information, and surveillance. The same local relationship could provide practical support and impose pressure to conform. Mutual aid and state control can operate through the same institution.", "Colonized and occupied populations faced distinct forms of coercion, displacement, and deprivation. Keep these differences visible when comparing civilian experiences. Shared suffering does not erase unequal power, aggression, or responsibility."], "question": "Why can a neighborhood association be both helpful and coercive?", "options": ["It can distribute support while enforcing surveillance and conformity.", "Practical assistance makes political pressure impossible.", "Only national ministries can exercise social control."], "answer": 0, "why": "Power can work through everyday relationships as well as formal state offices.", "term": {"romaji": "tonarigumi", "jp": "隣組", "meaning": "Wartime neighborhood association involved in mobilization, distribution, and local control."}, "refs": ["manchuria", "kono", "constitution", "nanjing"]}, {"id": "war-4", "title": "Defeat is not the end of consequences", "lens": "Society", "scene": "A survivor's account continues long after a surrender date.", "pages": ["The Battle of Okinawa, firebombing of cities, and the atomic bombings of Hiroshima on August 6 and Nagasaki on August 9, 1945, caused devastating civilian suffering. The Soviet Union entered the war against Japan in August. Japan announced surrender on August 15; formal signing followed on September 2.", "The relative weight of the atomic bombings, Soviet entry, and internal political decisions in producing surrender is debated. Recognizing that debate does not require uncertainty about the occurrence or human consequences of the bombings and invasion.", "Hibakusha, atomic-bomb survivors, faced illness, loss, discrimination, and the work of testimony and advocacy. Other survivors across Asia had their own long aftermaths. A historical ending date does not mark the end of trauma, displacement, or contested memory."], "question": "Why distinguish a war's formal end from its social aftermath?", "options": ["Survivors' health, displacement, discrimination, and memory continued beyond surrender.", "Every consequence ended when a document was signed.", "The existence of debate about surrender means no events can be established."], "answer": 0, "why": "Chronological closure in a timeline is not closure in people's lives.", "term": {"romaji": "hibakusha", "jp": "被爆者", "meaning": "People affected by the atomic bombings, commonly referring to survivors."}, "refs": ["hiroshima", "reconstruction"]}, {"id": "war-5", "title": "Read the words that hide the action", "lens": "Language", "scene": "An official phrase makes coercion sound ordinary.", "pages": ["Kokutai, often translated as national polity, carried powerful ideological meanings around the imperial state. Official language could frame obedience as moral duty and dissent as a threat to the nation. Definitions were political, not merely descriptive.", "Euphemisms matter. The label \"comfort women\" must be explained as referring to a coercive military sexual system, not accepted as a neutral description of voluntary work. Source language can conceal violence even while providing evidence of the institutions that organized it.", "Compare official statements with private diaries, records, and survivor testimony. Each has a context and limitations; they need not be treated as equally complete or interchangeable. Historical reading asks both what a source says and what its wording makes difficult to see."], "question": "What should you do when a source uses a euphemism for coercion?", "options": ["Explain the term's actual historical referent and compare evidence.", "Repeat it without context as if it were a neutral description.", "Assume official language cannot obscure violence."], "answer": 0, "why": "Source criticism includes identifying how vocabulary can normalize or hide relations of domination.", "term": {"romaji": "kokutai", "jp": "国体", "meaning": "National polity; a politically charged concept associated with the imperial order."}, "refs": ["kono", "suffrage"]}], "sensitive": true}, {"id": "postwar", "name": "Rebuilding & growth", "jp": "昭和", "dates": "1945-1989", "tag": "Who gets a new beginning?", "desc": "Reconstruction, constitutional change, mass consumption, and the unequal costs of rapid growth.", "region": "Tokyo, industrial regions, and Okinawa", "artifact": "Radio", "refs": ["constitution", "article9", "minamata", "okinawa1972"], "power": "Popular sovereignty and a parliamentary cabinet replaced the imperial constitutional order. Occupation, the US alliance, and domestic coalitions shaped the new system.", "life": "Factories, urban migration, appliances, and education transformed households, but job security and prosperity were uneven.", "voice": "Modern written reforms and changing institutions reshaped public language; politeness remained sensitive to context.", "lessons": [{"id": "postwar-1", "title": "Rebuild the rules, not just the roads", "lens": "World", "scene": "In a damaged neighborhood, housing and the rules of government both need rebuilding.", "pages": ["After surrender in 1945, Japan was occupied under Allied authority led by the United States. The occupation brought demilitarization and major political, social, and economic reforms. Japanese officials, political groups, and citizens also influenced implementation; society was not simply an empty page.", "The constitution came into force in 1947. It located sovereignty in the people, protected rights, and made the emperor a symbol rather than the source of sovereign power. Compare this with the Meiji constitution: the change concerns the basis of authority, not just the name of an office.", "The occupation of mainland Japan ended in 1952, while Okinawa remained under US administration until 1972. A single national timeline can hide different regional experiences. Cold War priorities also altered the occupation agenda, strengthening some conservative institutions after earlier reforms."], "question": "Why is 1952 an incomplete endpoint for occupation history?", "options": ["Okinawa remained under US administration until 1972.", "The 1947 constitution had not yet been written.", "All local experiences matched the mainland timeline."], "answer": 0, "why": "Regional timelines reveal how sovereignty and everyday experience can change at different moments.", "term": {"romaji": "sengo", "jp": "戦後", "meaning": "Postwar; a period label whose social meaning extends beyond a single ending date."}, "refs": ["constitution", "article9", "minamata", "okinawa1972"]}, {"id": "postwar-2", "title": "Where sovereignty lives now", "lens": "Power", "scene": "You compare two constitutional diagrams, one from 1889 and one from 1947.", "pages": ["Under the postwar constitution, the Diet is the highest organ of state power and the sole law-making organ. It designates the prime minister. The cabinet exercises executive power and is collectively responsible to the Diet; the emperor does not independently choose government policy.", "Women gained the national franchise during the occupation and voted in the 1946 general election. Constitutional equality opened new possibilities without automatically removing discrimination, unequal care burdens, or barriers to representation. Rights on paper require institutions and action to become lived realities.", "Article 9 renounces war and the threat or use of force as means of settling international disputes. The creation of the Self-Defense Forces in 1954, the US alliance, and successive interpretations generated continuing political and legal debates. Distinguish the constitutional text from later policy and interpretation."], "question": "Which statement best describes postwar constitutional authority?", "options": ["Sovereignty rests with the people, and the cabinet is responsible to the Diet.", "The emperor personally appoints a government without Diet designation.", "The prime minister rules independently of representative institutions."], "answer": 0, "why": "The emperor formally appoints the prime minister as designated by the Diet, rather than exercising a personal political choice.", "term": {"romaji": "kokumin shuken", "jp": "国民主権", "meaning": "Popular sovereignty: political authority is grounded in the people."}, "refs": ["constitution", "article9"]}, {"id": "postwar-3", "title": "The refrigerator has a backstory", "lens": "Daily life", "scene": "A family buys an appliance that changes the work done at home.", "pages": ["Rapid economic growth transformed production, housing, transport, and consumption. Rural migrants supplied urban labor, and expanding education changed expectations. The 1964 Tokyo Olympics and the new Tokaido Shinkansen became powerful images of reconstruction and technological confidence.", "A salaried husband and full-time homemaker became an influential household ideal. It never described everyone. Farmers, shopkeepers, women wage workers, small-business employees, and workers without secure company positions experienced growth differently. Household work remained essential to the paid economy.", "An appliance is therefore evidence of more than engineering. Its purchase depends on income, electricity, housing, credit, and decisions about labor. Ask who could afford it and whether it reduced work, raised standards of domestic care, or did both."], "question": "What is missing from a story that equates postwar life with secure male corporate employment?", "options": ["The many households and workers outside that influential ideal.", "The existence of any consumer goods.", "The possibility that urban migration affected families."], "answer": 0, "why": "An influential social model is not a census of everyone's experience.", "term": {"romaji": "kaden", "jp": "家電", "meaning": "Household electrical appliances; objects that connect consumption with domestic labor."}, "refs": ["constitution", "article9", "minamata", "okinawa1972"]}, {"id": "postwar-4", "title": "Growth has a downstream cost", "lens": "Society", "scene": "A fishing community suffers while a factory appears to prosper.", "pages": ["Minamata disease exposed the human costs of industrial pollution. Methylmercury released by factories entered food chains, and people were poisoned through contaminated fish and shellfish. The disease was officially reported in Minamata in 1956; recognition of causes and responsibility involved long delays and struggles.", "Patients, families, scientists, journalists, lawyers, and campaigners challenged corporate and governmental responses. Economic growth did not automatically protect health. The question is who received benefits, who bore risks, and who had the power to make harm visible.", "Other conflicts also complicated images of consensus: labor struggles, protests over the US-Japan security treaty, and disputes over military bases in Okinawa. A society can achieve rising aggregate income while remaining divided over distribution, security, and justice."], "question": "What question best exposes the politics of industrial pollution?", "options": ["Who benefits, who is harmed, and who can force institutions to respond?", "Did the national economy grow, regardless of local harm?", "Can prosperity be measured only by the number of factories?"], "answer": 0, "why": "Aggregate growth can conceal concentrated harms and unequal access to remedies.", "term": {"romaji": "kogai", "jp": "公害", "meaning": "Pollution-related public harm, especially associated with industrial environmental damage."}, "refs": ["minamata", "okinawa1972"]}, {"id": "postwar-5", "title": "Polite does not mean timeless", "lens": "Language", "scene": "A colleague changes wording between a customer call and lunch with a friend.", "pages": ["Contemporary Japanese has several resources for managing relationships. Teineigo uses polite forms, such as desu and masu. Sonkeigo raises the person being discussed; kenjogo presents one's own side humbly in relation to another. These are grammatical and social choices, not measures of personal worth.", "The appropriate form depends on setting, role, relationship, and what the speaker is doing. An employee representing a company may refer humbly to a colleague when speaking to an outside customer, even if that colleague is senior inside the company. Inside and outside affiliations matter alongside rank.", "Do not turn these observations into a rule that all Japanese people always act alike. Usage varies, conventions change, and mistakes are normal in learning. TOKI audio models contemporary pronunciation; it does not reconstruct a Heian conversation or a wartime broadcast."], "question": "Why might an employee use a humble form for a senior colleague when speaking to a customer?", "options": ["The colleague belongs to the speaker's own side in that interaction.", "The colleague has permanently lost all workplace authority.", "Japanese politeness depends only on age."], "answer": 0, "why": "Relational positioning changes with the audience and the activity.", "term": {"romaji": "keigo", "jp": "敬語", "meaning": "Honorific and polite language resources used to manage social relationships."}, "refs": ["chj"]}]}, {"id": "heisei", "name": "Heisei", "jp": "平成", "dates": "1989-2019", "tag": "Beyond the boom", "desc": "Follow the bubble's aftermath, changing work, major disasters, and new kinds of belonging.", "region": "Metropolitan centers and regional communities", "artifact": "Mobile phone", "refs": ["bubble", "quake", "reconstruction", "ainu"], "power": "Parliamentary government continued while party competition and economic policy changed. Institutions mattered more than imperial era labels.", "life": "Asset losses, insecure work, changing families, and digital connection produced different experiences across generations.", "voice": "Digital registers and global borrowing expanded expressive options; minority-language revitalization challenged narratives of uniformity.", "lessons": [{"id": "heisei-1", "title": "When the bubble is no longer a bubble", "lens": "World", "scene": "A business owes money against property now worth much less.", "pages": ["Stock and land prices rose sharply in the late 1980s and fell after the bubble burst. Falling collateral values and financial-sector problems affected borrowing, investment, and confidence. An asset-price decline can reshape the real economy through balance sheets, not just through disappointing headlines.", "The phrase lost decades summarizes prolonged economic difficulty but can flatten a complicated period. Industries, regions, firms, and households did not all move together. New technologies, cultural production, and international connections continued even amid weak growth and deflationary pressures.", "Separate a historical explanation from an inevitable destiny. Policy choices, financial institutions, global changes, and demographics interacted. Neither a single cultural trait nor a new emperor's era name can explain all economic outcomes."], "question": "How can a fall in property prices affect a company beyond its property portfolio?", "options": ["Weaker collateral and balance sheets can restrict borrowing and investment.", "It changes only the spelling of the company's accounts.", "It guarantees identical outcomes for every worker and firm."], "answer": 0, "why": "Asset values can influence credit and business decisions through institutional channels.", "term": {"romaji": "baburu", "jp": "バブル", "meaning": "Bubble; a loanword commonly used for the late-1980s asset boom and its aftermath."}, "refs": ["bubble"]}, {"id": "heisei-2", "title": "An era name is not a constitution", "lens": "Power", "scene": "A newspaper changes its date heading. Has the system of government changed too?", "pages": ["Heisei began in 1989 with a new emperor. Unlike the Meiji Restoration, this change did not replace the postwar constitutional framework. An imperial era name is a way of dating and periodizing events, not a guarantee of a new political system.", "Party competition, electoral arrangements, bureaucracy, business, organized groups, and public opinion all affected policy. Calling an entire period conservative, reformist, or stagnant can hide disagreements within institutions and changes across time. Identify the particular decision and the actors involved.", "A useful comparison keeps levels separate: the symbolic monarchy, the elected Diet, the cabinet, local government, and economic institutions are not interchangeable. Ask who actually has authority over the policy you are trying to explain."], "question": "What follows automatically from a new imperial era name under the postwar constitution?", "options": ["A change in official era dating, not replacement of the constitutional system.", "A return to the emperor's personal control of policy.", "The abolition of representative government."], "answer": 0, "why": "Period labels organize time; institutional changes require their own evidence.", "term": {"romaji": "gengo", "jp": "元号", "meaning": "An era name used in Japanese date notation."}, "refs": ["constitution"]}, {"id": "heisei-3", "title": "Two jobs, two kinds of security", "lens": "Daily life", "scene": "Two friends work in the same building but have different contracts.", "pages": ["Employment arrangements shape income, benefits, training, and the ability to plan. Nonregular work includes several different categories, such as part-time, fixed-term, and dispatched work. A label can hide differences in hours, choice, protections, and household circumstances.", "The long-term corporate employment ideal was never universal. Economic restructuring made its limits more visible, especially to some younger entrants and women workers. Family formation and care decisions are connected with wages, working time, housing, and access to support.", "Avoid treating every difficult life course as an individual failure or every worker as equally constrained. Historical explanation connects personal decisions with available options. To compare two households, ask about security and unpaid labor as well as annual income."], "question": "Why can equal current wages conceal unequal job security?", "options": ["Contract duration, benefits, and future opportunities may differ.", "Everyone in one building necessarily has the same employer and contract.", "Household care work is unrelated to employment options."], "answer": 0, "why": "Income is one dimension of an employment relationship, not its complete structure.", "term": {"romaji": "hiseiki", "jp": "非正規", "meaning": "Nonregular employment; an umbrella label for diverse work arrangements."}, "refs": ["bubble", "quake", "reconstruction", "ainu"]}, {"id": "heisei-4", "title": "Three disasters, many aftermaths", "lens": "Society", "scene": "A map shows a disaster zone; a family's recovery does not fit inside it.", "pages": ["The 1995 Kobe earthquake and the March 11, 2011, Great East Japan Earthquake transformed public discussion of disaster preparation and mutual aid. In 2011, the earthquake triggered a devastating tsunami and the Fukushima Daiichi nuclear accident. These are linked events with distinct mechanisms and consequences.", "Recovery includes housing, livelihoods, schools, health, social networks, and decisions about return. Infrastructure reconstruction is not identical to restoring a community. People may reasonably make different decisions because their ages, work, family ties, and risks differ.", "Volunteer activity and local organizations became important parts of recovery. They do not replace public responsibility. Listen to affected communities rather than assuming resilience means people can recover without resources or that every resident wants the same future."], "question": "Which measure captures recovery beyond rebuilding physical infrastructure?", "options": ["Whether people regain viable livelihoods, social ties, and choices about where to live.", "The number of repaired roads alone.", "A single announcement that all residents feel recovered."], "answer": 0, "why": "Physical reconstruction and social recovery are connected but distinct.", "term": {"romaji": "fukko", "jp": "復興", "meaning": "Recovery or reconstruction after devastation, including social and economic rebuilding."}, "refs": ["quake", "reconstruction"]}, {"id": "heisei-5", "title": "One archipelago, more than one voice", "lens": "Language", "scene": "An online conversation and a language-revival workshop both challenge your textbook.", "pages": ["Digital communication offers new combinations of scripts, abbreviations, emoji, and conversational styles. Katakana commonly marks loanwords and other expressive functions, but not every katakana word has an English origin or the same meaning as its source. Context matters more than visual resemblance.", "Japanese is not the only language connected with the archipelago. Ainu is distinct from Japanese. Ryukyuan languages belong to the Japonic family but are not simply interchangeable varieties of standard Japanese. Political labels and linguistic relationships need to be distinguished.", "Revitalization concerns communities, education, cultural practice, and intergenerational transmission. Learning about a language as endangered is not the same as treating its speakers as relics. Contemporary people actively decide how to preserve, adapt, and use their linguistic inheritance."], "question": "Why is it misleading to assume all languages of the archipelago are standard Japanese dialects?", "options": ["There are distinct languages and histories, including Ainu and Ryukyuan languages.", "A script always proves that two languages are identical.", "Modern national borders establish every linguistic relationship."], "answer": 0, "why": "Political territory does not determine language classification or cultural identity.", "term": {"romaji": "tayosei", "jp": "多様性", "meaning": "Diversity; here, the coexistence of different linguistic and social experiences."}, "refs": ["ainu", "chj"]}]}, {"id": "reiwa", "name": "Reiwa & today", "jp": "令和", "dates": "2019-2026", "tag": "History is still happening", "desc": "Read today through institutions, demographic change, diverse communities, and the discipline of checking dates.", "region": "Across Japan, connected globally", "artifact": "Community notebook", "refs": ["pm2026", "censusfinal", "constitution", "ainu"], "power": "The postwar constitutional framework continues. Distinguish dated political events from claims about an automatically updating present.", "life": "Population decline and aging affect care, work, transport, and local services in uneven ways.", "voice": "Contemporary communication changes across relationships, generations, regions, and multilingual settings.", "lessons": [{"id": "reiwa-1", "title": "The present needs a timestamp", "lens": "World", "scene": "Two pages say latest. One was published a year before the other.", "pages": ["Reiwa began in 2019. This chapter is a researched snapshot dated October 10, 2026, not a live news service. Recent history is unusually vulnerable to stale numbers, changing officeholders, and accounts revised as more evidence becomes available.", "Distinguish the date an event occurred from the date a report was published. A census released in 2026 can describe a population counted in 2025. A revised result may supersede an earlier preliminary count without meaning that millions of people moved overnight.", "Bring the same source criticism used for chronicles to digital information: who produced this, when, using what method, and with what incentive? A polished chart or confident sentence is not a substitute for those questions. Today becomes history through records that must still be interpreted."], "question": "What dates should you check when using a recently released statistic?", "options": ["Both the reference date of the data and the publication or revision date.", "Only the date you happen to read the page.", "Only the year printed in the page's title."], "answer": 0, "why": "Observation, publication, and revision are separate events.", "term": {"romaji": "shiryo", "jp": "資料", "meaning": "Source or documentary material used to investigate a question."}, "refs": ["census", "censusfinal"]}, {"id": "reiwa-2", "title": "Follow the appointment chain", "lens": "Power", "scene": "A ceremony makes the news. You want to know where the decision was made.", "pages": ["On February 18, 2026, the National Diet designated Sanae Takaichi as prime minister, as recorded by the Prime Minister's Office. This is a dated event in the current chapter, not a claim that a static app can monitor every subsequent political development.", "Under the constitution, the emperor appoints the prime minister as designated by the Diet. The cabinet is responsible to the Diet. Ceremony, legal procedure, and political choice are related but distinct parts of the process; the ceremony does not make the emperor an independent policymaker.", "Compare this with earlier eras. Fujiwara marriage politics, warrior-vassal networks, Tokugawa domain control, and postwar parliamentary designation are different mechanisms of power. Similar titles or impressive rituals do not make their institutions equivalent."], "question": "In the postwar appointment chain, who makes the constitutional designation of the prime minister?", "options": ["The National Diet.", "The emperor acting on personal political preference.", "A hereditary council of daimyo."], "answer": 0, "why": "Article 67 provides for designation by the Diet; Article 6 describes appointment by the emperor.", "term": {"romaji": "shusho", "jp": "首相", "meaning": "Prime minister; a common term for the head of the cabinet."}, "refs": ["pm2026", "constitution"]}, {"id": "reiwa-3", "title": "What a smaller population changes", "lens": "Daily life", "scene": "A town must choose how to maintain transport and care with fewer residents.", "pages": ["The final 2025 census population count, published September 29, 2026, reported 122,972,528 residents nationwide, down from 126,146,099 in 2020. These are census reference populations, not an automatic count of people living in Japan at this instant.", "Population decline and aging are not uniform across places. A growing neighborhood and a shrinking rural settlement can exist within the same national trend. Fewer school-age children, changing care needs, and the cost of maintaining infrastructure create different local tradeoffs.", "A demographic statistic is a starting point for inquiry, not a verdict that a society has no future. Ask how migration, work arrangements, technology, public services, and community decisions affect people's options. Policies distribute both opportunities and burdens."], "question": "Why is a national population total insufficient for planning a local bus route?", "options": ["Age structure, settlement patterns, and needs vary between communities.", "Every locality changes at exactly the national rate.", "Census counts describe opinions rather than residents."], "answer": 0, "why": "Aggregate totals do not reveal the geography or daily needs behind them.", "term": {"romaji": "shoshikoreika", "jp": "少子高齢化", "meaning": "A declining birthrate and population aging, often discussed together in Japan."}, "refs": ["censusfinal"]}, {"id": "reiwa-4", "title": "Belonging is not one biography", "lens": "Society", "scene": "A community project brings together people with different languages and family histories.", "pages": ["Contemporary Japan includes regional, Indigenous, migrant, religious, and other diverse communities. A single image of a homogeneous household cannot explain this range. People can share institutions while having different experiences of inclusion, discrimination, and opportunity.", "Upopoy, the National Ainu Museum and Park, presents Ainu culture as living and supports transmission and revitalization. This changes the question from whether a culture belongs only in the past to how communities exercise agency in the present. Museums themselves can be studied as institutions of representation.", "When considering coexistence, ask who helps decide the rules, which languages information appears in, and who can access services. Inclusion is more than the presence of different foods or festivals. It also involves voice, resources, recognition, and practical rights."], "question": "Which question goes beyond a purely decorative view of cultural diversity?", "options": ["Can different communities shape decisions and access information and services?", "How many festival costumes can be displayed?", "Can everyone be described by the same household stereotype?"], "answer": 0, "why": "Recognition becomes more substantive when connected with agency and access.", "term": {"romaji": "tabunka kyosei", "jp": "多文化共生", "meaning": "Multicultural coexistence; a term used in discussions of living together across cultural differences."}, "refs": ["ainu"]}, {"id": "reiwa-5", "title": "Choose a relationship, then a phrase", "lens": "Language", "scene": "You need help from a stranger, then report back to a close friend.", "pages": ["Sumimasen can attract attention, express an apology, or acknowledge an imposition, depending on context. One English equivalent does not capture every use. Arigato gozaimasu is a polite expression of thanks; a shorter arigato often suits a closer or less formal relationship.", "A request such as mo ichido onegai shimasu means please say or do it once more in context. The thing repeated is often understood rather than fully restated. Learning an interaction includes identifying the speaker, audience, purpose, and shared situation, not just translating each word.", "These examples are contemporary learning phrases, not authenticated dialogue from ancient Japan. The app's pronunciation uses your device's modern Japanese speech engine when available. Historical language study and everyday conversation are connected but distinct learning goals."], "question": "You did not hear a museum guide. Which contemporary request fits?", "options": ["Mo ichido onegai shimasu: please say it once more.", "A claim that prehistoric people used exactly the same phrase.", "An unrelated historical title presented as a request."], "answer": 0, "why": "A useful phrase solves a communicative problem within a relationship and setting.", "term": {"romaji": "sumimasen", "jp": "すみません", "meaning": "Excuse me / sorry; its function depends on the interaction."}, "refs": ["chj"]}]}], "sources": {"paleo": ["Kokugakuin University Museum", "The Origin of Humans and the Japanese Archipelago", "https://museum.kokugakuin.ac.jp/en/archaeology02/"], "okinawa": ["National Museum of Nature and Science", "Amazing discoveries in Paleolithic Okinawa", "https://www.kahaku.go.jp/english/plan/2018/04okinawa/"], "bones": ["University of Tokyo Museum", "Human Life and Death as Told by Ancient Bones", "https://www.um.u-tokyo.ac.jp/exhibition/2023life_and_death_en.html"], "jomon": ["UNESCO", "Jomon Prehistoric Sites in Northern Japan", "https://whc.unesco.org/en/list/1632/"], "pottery": ["Kokugakuin University Museum", "Native Hunter-Gatherer Culture: The Jomon Period", "https://museum.kokugakuin.ac.jp/en/archaeology03/"], "dogu": ["The Metropolitan Museum of Art", "Dogu (Clay Figurine), collection record", "https://www.metmuseum.org/art/collection/search/53625"], "yayoi": ["National Museum of Japanese History", "When did the Yayoi period begin?", "https://archive.rekihaku.ac.jp/english/exhibitions/project/old/070703/index.html"], "yayoiart": ["The Metropolitan Museum of Art", "Yayoi Culture", "https://www.metmuseum.org/essays/yayoi-culture-ca-4th-century-b-c-3rd-century-a-d"], "kofun": ["UNESCO", "Mozu-Furuichi Kofun Group", "https://whc.unesco.org/en/list/1593/"], "asuka": ["Official Nara Travel Guide", "History: Kofun, Asuka and Nara", "https://www.visitnara.jp/history/"], "taika": ["Columbia University, Asia for Educators", "The Reform Edict of Taika", "https://afe.easia.columbia
