 solid var(--orange);background:#f8eadb;color:var(--orange);opacity:1;transform:rotate(-3deg)}.stamp .jp{font-size:25px;line-height:1.3;font-family:serif}.stamp span{font-size:9px;line-height:1.2;text-align:center;max-width:100%;overflow-wrap:anywhere}.stamp small{font-size:8px;letter-spacing:.05em}.skill-row{display:grid;grid-template-columns:84px 1fr 38px;gap:12px;align-items:center;font-size:11px;margin:16px 0}.skill-row small{text-align:right;color:var(--muted)}.settings-list{display:grid;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card)}.setting{display:flex;align-items:center;justify-content:space-between;gap:15px;text-align:left;padding:16px;min-height:63px;width:100%;font-size:13px}.setting+.setting{border-top:1px solid var(--line)}.setting p{font-size:10px;color:var(--muted);margin-top:3px}.switch{width:39px;height:24px;border-radius:15px;background:#cdd2c3;position:relative;flex-shrink:0}.switch:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;left:3px;top:3px;background:white;transition:transform .2s}.switch.on{background:var(--green)}.switch.on:after{transform:translateX(15px)}.source-row{padding:17px 0;border-bottom:1px solid var(--line);display:block;text-decoration:none}.source-row b{display:block;font-size:13px;line-height:1.5}.source-row span{font-size:11px;color:var(--muted);display:block;margin-top:4px}.source-row .eyebrow{font-size:8px;color:var(--orange);margin-bottom:5px}.compare-select{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:23px 0}.select-label{font-size:10px;color:var(--muted);display:block;margin-bottom:7px}select{width:100%;min-height:49px;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:11px 8px;color:var(--ink);font-size:16px}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:12px}.comparison>div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 13px;min-width:0}.comparison h3{font-size:13px}.comparison p{font-size:12px;line-height:1.7;margin-top:8px;overflow-wrap:anywhere}.empty{text-align:center;padding:33px 20px;background:#edf0e3;border-radius:22px}.empty svg{margin:0 auto 12px}.empty h2{font-size:25px}.empty p{font-size:13px;color:var(--muted);margin:12px 0}.toast{position:fixed;left:50%;bottom:calc(var(--bottom) + 17px);transform:translate(-50%,20px);max-width:calc(100vw - 40px);width:max-content;padding:12px 20px;background:#203e36;color:white;font-size:12px;line-height:1.6;border-radius:15px;z-index:120;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 8px 30px #172d2830}.toast.show{opacity:1;transform:translate(-50%,0)}.storage-warning{font-size:11px;background:#ffe5c7;color:#763b18;padding:12px 22px;display:none}.storage-warning.show{display:block}dialog{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:24px;padding:25px;max-width:400px;width:calc(100vw - 34px);box-shadow:0 20px 90px #13261d40}dialog::backdrop{background:#13261d7a;backdrop-filter:blur(4px)}dialog h2{font-size:28px;margin-bottom:14px}dialog p{font-size:14px;color:#596352;margin-bottom:20px}dialog .stack{gap:10px}.end-banner{margin-top:30px;padding:22px;border:1px dashed #bbc6ab;border-radius:20px;background:#edf0e1}.end-banner h3{font-size:15px;margin-bottom:8px}.end-banner p{font-size:12px;color:var(--muted)}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:14px}.day{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:9px;color:var(--muted)}.day i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);font-style:normal;font-size:12px}.day.done i{background:var(--green);color:white;border-color:var(--green)}.bookmark-list{display:grid;gap:10px}.note-preview{font-size:12px;line-height:1.65;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:10px}.scroll-top{scroll-margin-top:12px}.text-right{text-a <body><div class="app-shell"><div class="storage-warning" role="alert">This browser could not restore or save local progress. Use Passport to export a backup; private browsing or blocked storage may be responsible.</div><header class="topbar"><button class="brand" data-nav="journey" aria-label="TOKI, your journey"><span class="brand-mark" lang="ja">&#26178;</span>TOKI</button><div id="header-stats" class="header-stats"></div></header><main id="app" tabindex="-1" aria-label="TOKI learning content"></main><nav class="nav" aria-label="Main navigation"><button data-nav="journey"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c0-5 14-3 14-9 0-3-5-3-5-6"/><circle cx="5" cy="19" r="2"/><path d="m11 7 3-4 4 2"/></svg>Journey</button><button data-nav="explore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m16 8-3 5-5 3 3-5z"/></svg>Explore</button><button data-nav="dojo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6L21 9.5 16.5 14l1.1 6.2L12 17.3l-5.6 2.9L7.5 14 3 9.5l6.3-.9z"/></svg>Dojo</button><button data-nav="passport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="15" height="18" rx="2"/><path d="M8 3v18M11 17h6"/><circle cx="14" cy="10" r="3"/></svg>Passport</button></nav></div><div id="toast" class="toast" role="status" aria-live="polite"></div><input type="file" id="import-file" accept="application/json,.json" hidden><dialog id="confirm-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-text"><h2 id="dialog-title"></h2><p id="dialog-text"></p><div class="stack"><button id="dialog-confirm" class="btn warm"></button><button id="dialog-cancel" class="btn secondary">Keep current progress</button></div></dialog><noscript><p style="padding:30px">TOKI needs JavaScript to run its interactive lessons. The source material and curriculum are included in the app folder.</p></noscript><script>const DATA={"version": 1, "updated": "2026-10-10", "eras": [{"id": "first", "name": "First arrivals", "jp": "先史", "dates": "c. 38,000-14,000 BCE", "tag": "Before there was Japan", "desc": "Read a world without written records. Follow stone, shorelines, and the traces people left behind.", "region": "Across the archipelago", "artifact": "Obsidian blade", "refs": ["paleo", "okinawa", "bones"], "power": "Small communities, not an imperial state. Leadership and kinship are difficult to reconstruct.", "life": "Mobile lives combined skilled toolmaking with knowledge of changing local environments.", "voice": "No surviving transcripts. Archaeology reveals actions more readily than spoken words.", "lessons": [{"id": "first-1", "title": "Before the first page", "lens": "World", "scene": "You arrive on a cold shoreline. There is no country here called Japan.", "pages": ["Evidence places people in the archipelago tens of thousands of years before written records. Many accounts put the first well-attested arrivals roughly 38,000-40,000 years ago; the earliest dates and routes remain research questions. This is human history, not yet the history of a Japanese nation-state.", "During glacial periods, lower sea levels changed coastlines and connections with the mainland. Hokkaido could connect northward through Sakhalin. Other journeys required crossing water. Never picture one permanent land bridge joining every modern Japanese island to Asia.", "Archaeologists combine stone tools, excavated layers, and dated organic material. The first surviving trace at a site is not necessarily the first human visit. Absence of evidence is especially important when old coastlines are now underwater."], "question": "What is the safest conclusion about the earliest arrivals?", "options": ["Humans arrived long before Japan existed as a state; dates and routes need evidence.", "The first written emperor was also the first human inhabitant.", "Every island was connected to the mainland by one permanent bridge."], "answer": 0, "why": "A modern national boundary is not a prehistoric social boundary. Archaeological dates identify evidence, not a founding ceremony.", "term": {"romaji": "senshi", "jp": "先史", "meaning": "Prehistory: the past before locally surviving written records."}, "refs": ["paleo", "okinawa", "bones"]}, {"id": "first-2", "title": "The black stone network", "lens": "Power", "scene": "An obsidian flake lies far from the place where its rock formed.", "pages": ["Obsidian is volcanic glass. It can fracture into very sharp edges, making it valuable for cutting tools. Comparing its chemical composition with known geological sources helps archaeologists investigate where a piece originated. A stone can preserve a connection that no letter records.", "If material traveled far, people or objects moved. Exchange between neighboring groups, repeated hand-to-hand movement, and direct procurement can all produce distant finds. A long journey does not automatically establish a market, merchant class, or centralized trading government.", "Skill and information mattered even without coins or written contracts. Knowing where to find suitable stone, how to shape it, and whom to approach could be socially important. That is a plausible interpretation of the evidence, not proof of a particular chief's powers."], "question": "An obsidian tool is found far from its source. What does this establish?", "options": ["Movement of material, but not the exact exchange system.", "A money economy with professional merchants.", "A single ruler controlled the entire archipelago."], "answer": 0, "why": "Source analysis can establish connections. Institutions such as markets or taxation require additional evidence.", "term": {"romaji": "kokuyoseki", "jp": "黒曜石", "meaning": "Obsidian: volcanic glass used to make sharp stone tools."}, "refs": ["paleo", "okinawa", "bones"]}, {"id": "first-3", "title": "Pack for a changing world", "lens": "Daily life", "scene": "You are choosing what a mobile household could carry.", "pages": ["A stone tool was part of a larger toolkit. Wood, fibers, skins, and other organic materials often preserve poorly, so surviving stone can exaggerate how stone-centered daily life appears. Making, repairing, and carrying equipment required practiced knowledge.", "People used different environments rather than following one universal Ice Age lifestyle. Okinawan cave finds include shell fishhooks and evidence for seasonal aquatic foods. Northern settings and southern islands offered different animals, plants, coastlines, and risks.", "Mobility could involve returning to familiar places. A temporary camp was not evidence that its inhabitants lacked planning or attachment to a landscape. Think of seasonal knowledge and social relationships as resources alongside the visible contents of a tool bag."], "question": "Why might an excavated toolkit misrepresent daily life?", "options": ["Organic materials often decay, leaving stone disproportionately visible.", "People never used wood until they learned to write.", "Every community used identical tools and ate identical foods."], "answer": 0, "why": "Preservation filters the record. A missing wooden object is not proof that wood was unused.", "term": {"romaji": "sekki", "jp": "石器", "meaning": "Stone tool; a modern archaeological label, not an attested prehistoric word."}, "refs": ["paleo", "okinawa"]}, {"id": "first-4", "title": "The camp has no transcript", "lens": "Society", "scene": "A display needs a label explaining a prehistoric gathering.", "pages": ["People cooperated, cared for others, and passed skills between generations. Yet an excavated hearth rarely tells us who spoke first, how decisions were negotiated, or what counted as a family. Familiar modern categories can make a reconstruction feel more certain than it is.", "Human remains may provide evidence about health, diet, movement, or relatedness. None of these automatically reveals an individual's social identity or the exact meaning of a burial. Biological relationships and cultural belonging are related questions, not interchangeable answers.", "A responsible reconstruction separates observed evidence from a proposed explanation. \"Several tools were found together\" is an observation. \"A specialist instructed apprentices here\" is an interpretation requiring support. Our game scenes are imagined teaching situations, not recovered conversations."], "question": "Which museum label best separates evidence from interpretation?", "options": ["Tools cluster here; shared toolmaking is one possible explanation.", "These tools prove that the village chief taught his eldest son.", "We know exactly what this group called its ancestors."], "answer": 0, "why": "A good label makes its inferential step visible instead of inventing a social biography.", "term": {"romaji": "kasetsu", "jp": "仮説", "meaning": "Hypothesis: a proposed explanation to test against evidence."}, "refs": ["bones", "paleo"]}, {"id": "first-5", "title": "A language we cannot hear", "lens": "Language", "scene": "Someone asks you to translate a greeting from 30,000 years ago.", "pages": ["No written record gives us the languages spoken by the archipelago's earliest inhabitants. Modern Japanese cannot simply be projected backward into this period. Neither a familiar bow nor a modern greeting is an authenticated prehistoric interaction.", "Language history uses comparisons, sound correspondences, and surviving texts. Archaeology and genetics add different evidence, but a tool style or ancestry component is not a dictionary. People can adopt new languages without a complete replacement of their population.", "In TOKI, Japanese labels for prehistoric objects are modern study vocabulary. Audio, when available, uses a modern Japanese voice. Learn to say iseki, meaning archaeological site, while remembering that its inhabitants would not necessarily have recognized the word."], "question": "What should accompany a modern Japanese term in a prehistoric lesson?", "options": ["A warning that it is a modern label, not reconstructed ancient speech.", "A claim that all inhabitants already spoke modern Japanese.", "An invented greeting presented as an authentic quotation."], "answer": 0, "why": "Vocabulary can help you study the past without pretending we possess evidence of its speech.", "term": {"romaji": "iseki", "jp": "遺跡", "meaning": "Archaeological site: a place with surviving traces of past human activity."}, "refs": ["paleo", "oldjp"]}]}, {"id": "jomon", "name": "Jomon", "jp": "縄文", "dates": "c. 14,000 BCE-1st millennium BCE", "tag": "A village, not a kingdom", "desc": "Meet communities that made pottery, managed seasonal resources, and built enduring places without rice states.", "region": "Northern Honshu and beyond", "artifact": "Cord-marked pot", "refs": ["jomon", "pottery", "dogu"], "power": "No single Jomon government; settlement and burial evidence vary by place and time.", "life": "Fishing, gathering, hunting, storage, craft, and in some places plant management supported settled communities.", "voice": "Ritual objects survive; their exact meanings and the languages of their makers do not.", "lessons": [{"id": "jomon-1", "title": "The pottery plot twist", "lens": "World", "scene": "You find a cooking vessel, but no rice paddy beside it.", "pages": ["Jomon names a very long and regionally varied archaeological sequence, not one tribe or government. Its beginning is associated with early pottery around 16,000 years ago. Its ending differs across the archipelago as practices associated with Yayoi communities spread unevenly.", "The label means cord-marked, referring to impressed decoration on many vessels. Pottery allowed new ways to heat and process foods. It does not, by itself, prove full-time agriculture, cities, or social ranks. A technological invention need not arrive as part of one universal package.", "Northern Jomon sites preserve evidence of settled hunter-fisher-gatherer communities. This challenges a simple ladder in which everyone must become a farmer before living in one place. Environmental knowledge and diverse resources could support other ways of organizing life."], "question": "What assumption do settled Jomon communities challenge?", "options": ["That permanent settlement always requires grain agriculture.", "That pottery can preserve traces of food preparation.", "That communities respond to their local environments."], "answer": 0, "why": "Sedentary life and cereal agriculture are distinct developments; one does not mechanically require the other.", "term": {"romaji": "Jomon", "jp": "縄文", "meaning": "Cord-marked; the modern name of a long, diverse prehistoric cultural sequence."}, "refs": ["jomon", "pottery", "dogu"]}, {"id": "jomon-2", "title": "The village beyond the ruler", "lens": "Power", "scene": "You must explain why a village built a shared space.", "pages": ["Large settlements and repeated construction imply coordination. They do not tell us automatically whether work was commanded by a chief, organized by households, or undertaken for a shared ritual. Monumental effort is evidence of organization, not a complete political constitution.", "Burials, houses, and access to valuable materials can help investigate difference within a community. Patterns change across thousands of years. It is misleading to call all Jomon society perfectly equal or to imagine every settlement as a miniature kingdom.", "Compare this world with later rice taxation and court records. For Jomon communities, the evidence for authority is predominantly material. Asking who organized labor is useful, but a careful answer may remain a set of possibilities rather than the name of a ruler."], "question": "What does a large communal construction most directly demonstrate?", "options": ["People could coordinate labor.", "A hereditary emperor ordered it.", "Every household had exactly the same status."], "answer": 0, "why": "Coordination is visible in the construction; the precise institution behind it is a further question.", "term": {"romaji": "shuraku", "jp": "集落", "meaning": "Settlement: a cluster of places where people lived and worked."}, "refs": ["jomon", "bones"]}, {"id": "jomon-3", "title": "Dinner is seasonal", "lens": "Daily life", "scene": "Your household needs food beyond today's catch.", "pages": ["Jomon foodways varied with coast, river, forest, and season. Shellfish, fish, game, nuts, and other plants could contribute to meals. Processing and storing food demanded time and expertise. A foraging economy is not simply picking up whatever happens to be nearby.", "Shell middens preserve discarded shells, bones, and objects, though some deposits also held ritual significance. Their contents help reconstruct choices and environments. They do not provide a complete menu: soft plants and foods eaten elsewhere may leave fewer identifiable traces.", "Pit dwellings had floors dug into the ground, but buildings differed in form and use. A household's year combined obtaining food with maintaining shelter, tools, containers, and relationships. The dramatic artifact in a museum is only a small part of this work."], "question": "Why is a shell midden not a complete record of diet?", "options": ["Some foods preserve poorly or were consumed elsewhere.", "Shell middens always contain written recipes.", "People who ate shellfish could not also gather plants."], "answer": 0, "why": "Archaeological samples reflect disposal and preservation as well as consumption.", "term": {"romaji": "kaizuka", "jp": "貝塚", "meaning": "Shell midden: a deposit containing shells and other traces of human activity."}, "refs": ["jomon", "pottery"]}, {"id": "jomon-4", "title": "Who is the little clay figure?", "lens": "Society", "scene": "A dogu figurine is missing a limb. Write its museum label.", "pages": ["Dogu are clay figurines associated with Jomon contexts, especially later phases. They occur in varied styles. Some emphasize bodily features, and some appear to have been deliberately broken. Their striking forms make them memorable, but appearance alone cannot decode a belief system.", "Scholars have proposed fertility, healing, and other ritual interpretations. These are interpretations rather than translations from a surviving Jomon text. A figure can support a discussion of ritual activity without proving that every community worshipped one identical goddess.", "Ritual deposits and burial practices can help investigate how communities maintained relationships with the dead and with one another. The strongest historical habit is to distinguish a plausible explanation from a settled identification. Mystery is not an invitation to invent certainty."], "question": "Which claim about dogu is most defensible?", "options": ["Their ritual meanings are debated; several interpretations exist.", "Every dogu represents the same named goddess.", "A missing limb proves one specific healing ceremony everywhere."], "answer": 0, "why": "Material patterns support hypotheses, but no surviving Jomon manual fixes one meaning for every figurine.", "term": {"romaji": "dogu", "jp": "土偶", "meaning": "Clay figurine; Jomon examples are often interpreted in ritual contexts."}, "refs": ["dogu", "jomon"]}, {"id": "jomon-5", "title": "Stories without writing", "lens": "Language", "scene": "The village passes on knowledge, but leaves no written manual.", "pages": ["An absence of writing is not an absence of language, memory, or sophisticated knowledge. Oral teaching can preserve practical skills and collective stories. However, we cannot recover the exact wording of Jomon stories from a pot or a house foundation.", "The relationship between prehistoric populations and later languages is complex. Ainu language and culture deserve study on their own terms, not treatment as an unchanged Jomon survival. Living people are not museum specimens of an earlier archaeological period.", "Densho is a modern Japanese word for transmission or tradition. Use it to ask how knowledge moves between generations. In this era, role-play dialogue is explanatory English; the app deliberately avoids pretending that modern Japanese is a reliable reconstruction of prehistoric speech."], "question": "Why should Ainu culture not be labeled \"unchanged Jomon culture\"?", "options": ["Living cultures have their own histories and change over time.", "Ainu history only begins when Japanese writing appears.", "An archaeological culture always has one recoverable modern language."], "answer": 0, "why": "Continuity, contact, and change must be investigated, not collapsed into an identity claim.", "term": {"romaji": "densho", "jp": "伝承", "meaning": "Transmission or tradition; knowledge passed between people and generations."}, "refs": ["jomon", "ainu", "oldjp"]}]}, {"id": "yayoi", "name": "Yayoi", "jp": "弥生", "dates": "c. 900 BCE-c. 250 CE", "tag": "Rice changes the bargain", "desc": "Follow migration, farming, stored grain, and the political possibilities of unequal access.", "region": "Northern Kyushu, spreading unevenly", "artifact": "Bronze bell", "refs": ["yayoi", "yayoiart"], "power": "Regional leaders and polities developed; no single uniform Japanese state existed.", "life": "Wet-rice farming added irrigation schedules, stored harvests, and demanding seasonal labor.", "voice": "Chinese texts give an outsider's view of Wa; local everyday speech is much harder to reconstruct.", "lessons": [{"id": "yayoi-1", "title": "Not one agricultural switch", "lens": "World", "scene": "A new farming technique reaches one community before its neighbors.", "pages": ["Wet-rice cultivation spread through contacts and migration involving the Korean peninsula. Some newer chronologies place its northern Kyushu beginnings around the tenth or ninth century BCE, earlier than older textbook dates near 300 BCE. The chronological debate is part of the lesson.", "Different regions changed at different speeds. Existing inhabitants and newcomers interacted rather than swapping places in a single instant. New crops, tools, practices, and languages need not have spread along identical routes or on the same schedule.", "The Jomon-Yayoi distinction is useful but not a stopwatch that ticked over everywhere together. Hokkaido and the Ryukyu Islands followed different trajectories from the main wet-rice regions. A national timeline must leave room for overlapping regional histories."], "question": "Why do respectable timelines give different Yayoi starting dates?", "options": ["Dating methods and regional definitions differ; rice farming spread unevenly.", "The whole archipelago officially changed its calendar at once.", "The difference proves that no farming occurred before writing."], "answer": 0, "why": "A revised date can reflect new archaeological evidence rather than a simple factual mistake.", "term": {"romaji": "suiden", "jp": "水田", "meaning": "Paddy field: a field managed for wet-rice cultivation."}, "refs": ["yayoi", "yayoiart"]}, {"id": "yayoi-2", "title": "Who gets the water?", "lens": "Power", "scene": "Two households need the same irrigation channel.", "pages": ["Wet-rice farming can require coordinating water, work, and seasonal timing. Stored grain creates resources that may be redistributed, protected, exchanged, or taken. These conditions can support greater inequality, although farming does not automatically produce one political outcome.", "Differences among burials, settlements, and access to metal goods help archaeologists investigate status. Some moated sites and injuries suggest conflict. The evidence does not justify calling every Yayoi settlement permanently at war or treating every ditch as purely military.", "A leader able to organize labor and control valued resources could gain influence. Followers might seek security, ritual benefits, or access to exchange. Analyze the relationship between resources and authority rather than memorizing a claim that rice instantly created emperors."], "question": "How could stored grain strengthen a leader's position?", "options": ["It could support redistribution, dependents, and control over resources.", "It eliminated all dependence on other households.", "It automatically gave the leader the title of emperor."], "answer": 0, "why": "A surplus offers political possibilities; institutions and local relationships determine how it is used.", "term": {"romaji": "chikuseki", "jp": "蓄積", "meaning": "Accumulation: the building up of stores or resources over time."}, "refs": ["yayoi", "yayoiart"]}, {"id": "yayoi-3", "title": "A harvest has a calendar", "lens": "Daily life", "scene": "Your community must coordinate labor before the harvest arrives.", "pages": ["Rice farming reorganized parts of the working year around field preparation, planting, water management, and harvesting. Communities still drew on other foods and resources. Farming was an addition and transformation, not an immediate end to fishing or gathering.", "Storage protected some harvests and made accumulated resources visible. Agricultural tools and containers reveal work that a political narrative can miss. Households faced the risk that pests, weather, or conflict might undermine months of labor.", "Bronze objects such as dotaku bells are often interpreted in ritual settings rather than simply as everyday tools. Iron and bronze served different purposes. A technological package should be examined object by object: material alone does not establish how everyone used it."], "question": "Which description best fits the change in daily life?", "options": ["Farming added coordinated seasonal work while other foodways continued.", "Every household stopped fishing immediately.", "Bronze bells replaced all agricultural tools."], "answer": 0, "why": "Avoid all-or-nothing change. Mixed livelihoods and local variation persisted.", "term": {"romaji": "dotaku", "jp": "銅鐸", "meaning": "Bronze bell associated with Yayoi ritual and archaeological contexts."}, "refs": ["yayoi", "yayoiart"]}, {"id": "yayoi-4", "title": "Meet Himiko through someone else", "lens": "Society", "scene": "A Chinese account describes a ruler named Himiko.", "pages": ["Third-century Chinese records describe Himiko as ruler of Yamatai and report diplomatic relations with Wei. This is valuable written evidence for regional politics, ritual authority, and connections beyond the islands. It is not a diary written by Himiko herself.", "The location of Yamatai remains debated, with major arguments involving northern Kyushu and the Kinai region. Archaeological discoveries inform that debate but do not turn every proposed identification into an established fact. Read a map's question mark as useful information.", "A powerful female ruler complicates assumptions that political authority was always exercised only by men. It does not prove universal gender equality. One prominent individual and the everyday position of all women are different scales of historical analysis."], "question": "What can Himiko's prominence establish without overreaching?", "options": ["A woman could hold significant authority; this does not prove universal equality.", "All women had the same political power as Himiko.", "Her capital's exact location is universally agreed."], "answer": 0, "why": "A single case can challenge an absolute claim while leaving broader social questions open.", "term": {"romaji": "Himiko", "jp": "卑弥呼", "meaning": "The ruler of Yamatai described in third-century Chinese records."}, "refs": ["yayoiart"]}, {"id": "yayoi-5", "title": "The name in an outsider's text", "lens": "Language", "scene": "You encounter the written name Wa.", "pages": ["Chinese sources used Wa for peoples and polities in the archipelago. An outsider's label is not necessarily a community's preferred name for itself. It can reveal the observer's categories as much as the observed society's own identity.", "The origins and spread of Japonic languages are studied through linguistic and archaeological evidence. Major accounts connect them with prehistoric migrations, but precise routes and timings remain debated. Modern Japanese pronunciation cannot stand in for an unrecorded Yayoi conversation.", "When reading a translated account, ask who wrote it, for what audience, and through how many intermediaries information traveled. Written evidence is powerful, but not neutral. This source criticism will matter again when courts, colonial administrations, and modern states describe other communities."], "question": "What is the first question to ask about an outsider's name for a population?", "options": ["Who used the label, and what perspective shaped it?", "Does it prove everyone had a single national identity?", "Can we use its modern reading to reconstruct ordinary speech exactly?"], "answer": 0, "why": "A label is evidence of a relationship and a perspective, not a transparent window into self-identification.", "term": {"romaji": "Wa", "jp": "倭", "meaning": "An early Chinese designation for peoples or polities in the Japanese archipelago."}, "refs": ["yayoiart", "oldjp"]}]}, {"id": "kofun", "name": "Kofun", "jp": "古墳", "dates": "c. 250-600", "tag": "Power gets a skyline", "desc": "Read the enormous tombs, migrant skills, and alliances behind the rise of Yamato.", "region": "Yamato and the Osaka plain", "artifact": "Haniwa figure", "refs": ["kofun", "asuka"], "power": "Yamato leaders built a network of powerful lineages, not an immediately uniform bureaucracy.", "life": "Farming, specialist production, transport, and tomb building supported elite display.", "voice": "Writing arrived through continental connections; later chronicles are not eyewitness records of every early event.", "lessons": [{"id": "kofun-1", "title": "A tomb you can see from afar", "lens": "World", "scene": "A vast keyhole-shaped mound dominates the landscape.", "pages": ["The Kofun period takes its name from ancient burial mounds. Some were keyhole-shaped, while others were round or square. Their size, form, and associated objects reveal patterns of elite competition, connection, and distinction across parts of the archipelago.", "The Yamato polity grew through relationships among regional elites. Monumental tombs suggest a hierarchy and shared political culture, but the ability to build them was not equivalent to administering every village through a centralized legal code. State formation was a process.", "Traditional names attach certain tombs to particular emperors. An attribution and an independently established archaeological identification are not the same thing. Many tombs have restrictions on access, limiting what researchers can test directly."], "question": "What do the tombs most strongly support?", "options": ["Elite hierarchy and coordinated labor, without proving uniform national administration.", "Equal wealth for every inhabitant.", "A fully documented bureaucracy identical to the later Nara state."], "answer": 0, "why": "Monuments reveal resources and political relationships; they cannot supply every missing administrative detail.", "term": {"romaji": "kofun", "jp": "古墳", "meaning": "Ancient burial mound; also the name of this archaeological period."}, "refs": ["kofun", "asuka"]}, {"id": "kofun-2", "title": "A king needs other powerful people", "lens": "Power", "scene": "A regional lineage considers joining Yamato's network.", "pages": ["Power depended on relationships among leading families and the communities attached to them. Alliances, prestige goods, ritual standing, and military force all mattered. A ruler could be preeminent without having direct, equally effective control everywhere.", "Uji is a conventional term for important lineage groups in early political organization. Such groups could claim ancestry, hold offices, and support specialized functions. Treat them as historical organizations, not as timeless versions of modern surnames.", "Compare a network of allied elites with a later court that classifies land and households. The distinction helps explain why reforming rulers would try to redefine taxation and officeholding. Political centralization was partly a struggle to alter existing sources of power."], "question": "Why could a powerful Yamato ruler still need regional allies?", "options": ["Authority worked through existing lineages and uneven local relationships.", "No one outside the capital possessed land or followers.", "A royal title made cooperation unnecessary."], "answer": 0, "why": "Dominance within a network is different from bypassing that network entirely.", "term": {"romaji": "uji", "jp": "氏", "meaning": "A lineage or clan group important in early Japanese political organization."}, "refs": ["asuka", "taika", "kofun"]}, {"id": "kofun-3", "title": "Clay figures, real work", "lens": "Daily life", "scene": "A haniwa house gives you a glimpse of a vanished building.", "pages": ["Haniwa were clay objects placed on or around tombs. Their forms included cylinders, houses, animals, and people. They help researchers investigate elite ritual worlds and aspects of clothing, equipment, and buildings that may not otherwise survive.", "A representation is not a photograph of everyone's daily life. A figure associated with an elite burial may emphasize status, ceremonial attire, or an ideal role. Compare it with settlement archaeology before treating it as evidence for all households.", "Producing pottery, moving earth, feeding workers, and organizing construction required extensive labor. The ruler's tomb therefore also records the work of people whose names were not preserved. Asking who made a monument shifts history beyond the person supposedly buried inside."], "question": "How should a haniwa house be used as evidence?", "options": ["As a representation to compare with other archaeological evidence.", "As a guaranteed floor plan of every ordinary home.", "As proof that only elite people built houses."], "answer": 0, "why": "An artifact has a context and purpose. Representation and everyday practice can differ.", "term": {"romaji": "haniwa", "jp": "埴輪", "meaning": "Clay objects and figures arranged in Kofun funerary settings."}, "refs": ["kofun", "asuka"]}, {"id": "kofun-4", "title": "Knowledge crosses the water", "lens": "Society", "scene": "A craft specialist brings expertise from the Korean peninsula.", "pages": ["People moving through East Asian networks helped transmit technologies, writing, and specialized knowledge. The archipelago was not sealed from its neighbors. Connections with the Korean peninsula were particularly important to elite politics and material culture.", "Migrant specialists could become attached to powerful groups, bringing skills that enhanced a patron's position. Migration, diplomacy, and competition were intertwined. This history cannot be reduced either to passive copying or to isolated invention.", "The modern historical term toraijin refers to people who came from abroad in these early periods. Actual experiences varied by origin, occupation, and relationship to local rulers. An umbrella label should not erase individual agency or turn diverse people into one homogeneous group."], "question": "What makes migration politically significant here?", "options": ["Skills and connections could strengthen both newcomers and their patrons.", "Technology could move only when entire populations were replaced.", "The archipelago had no sustained external connections."], "answer": 0, "why": "People carried expertise, and access to expertise could alter the balance among elites.", "term": {"romaji": "toraijin", "jp": "渡来人", "meaning": "A historical label for immigrants to early Japan, especially from continental East Asia."}, "refs": ["asuka", "kofun"]}, {"id": "kofun-5", "title": "A title is a claim", "lens": "Language", "scene": "A later chronicle gives an early ruler a grand title.", "pages": ["Okimi, often translated as great king, is associated with early rulers. Tenno, the title translated as emperor, became established later. Translating every period with one modern English title can conceal important changes in how sovereignty was imagined.", "Written inscriptions and later chronicles offer different kinds of evidence. An inscription is closer to the time it was produced, but may be brief or formulaic. A chronicle can be much fuller while projecting later priorities onto earlier rulers.", "Ask when a title is actually attested and what authority it claims. Terms such as king, emperor, chief, and sovereign are interpretive choices, not perfectly interchangeable labels. The app uses familiar names but flags major changes in the institutions behind them."], "question": "Why distinguish okimi from later imperial terminology?", "options": ["Titles can reveal changing claims about sovereignty.", "All titles had identical meanings in every century.", "A later chronicle is automatically an eyewitness account."], "answer": 0, "why": "Vocabulary can preserve political change that a single English label flattens.", "term": {"romaji": "okimi", "jp": "大王", "meaning": "Great king: a title associated with early rulers before later imperial terminology became established."}, "refs": ["asuka", "oldjp"]}]}, {"id": "asuka", "name": "Asuka", "jp": "飛鳥", "dates": "538-710", "tag": "Rewriting the rules", "desc": "Buddhism, diplomacy, rival lineages, and reform transform the court.", "region": "Asuka, central Honshu", "artifact": "Temple roof tile", "refs": ["asuka", "taika", "oldjp"], "power": "The court pursued stronger central institutions while negotiating lineage power and succession.", "life": "Temples and palaces concentrated crafts, resources, imported knowledge, and labor.", "voice": "Chinese writing became a tool of government and prestige; spoken language was not simply Chinese.", "lessons": [{"id": "asuka-1", "title": "A new religion is a relationship", "lens": "World", "scene": "A Buddhist image reaches a court divided over what to do with it.", "pages": ["Buddhism reached the court through connections with the Korean kingdom of Baekje; traditional accounts give different dates, commonly 538 or 552. Ideas traveled with images, texts, artisans, and diplomatic relationships. Religious transmission was also social and political exchange.", "Rival lineages supported different positions in court struggles. Sponsoring a temple could express devotion, prestige, and access to international culture. It is misleading to imagine a simple contest between a single uniform native religion and one entirely foreign package.", "Buddhist practices and worship of local kami would interact for centuries. Later categories that sharply separate Buddhism and Shinto should not be imposed unchanged on every early community. Religious life was made through patronage, practice, and adaptation."], "question": "Why was Buddhist patronage politically important?", "options": ["It connected religious prestige with diplomacy, expertise, and court alliances.", "It removed all local ritual practices overnight.", "It had no connection to elite competition."], "answer": 0, "why": "A temple could be a devotional institution and a statement about a patron's place in a wider world.", "term": {"romaji": "bukkyo", "jp": "仏教", "meaning": "Buddhism: a diverse religious tradition transmitted through East Asian networks."}, "refs": ["asuka", "taika", "oldjp"]}, {"id": "asuka-2", "title": "The reform on paper", "lens": "Power", "scene": "A court announces that old arrangements must change.", "pages": ["The coup of 645 was followed by reforms associated with the Taika era. The court sought stronger control over land, households, offices, and taxation, drawing on continental models. These aims challenged older patterns of authority vested in powerful lineages.", "A reform edict is evidence of what rulers wanted, not proof that their wishes were immediately implemented. Surviving accounts were compiled later and require critical reading. It is safer to see centralization as a long process than as a completed overnight revolution.", "Ritsuryo government joined penal and administrative codes with ranked officeholding and fiscal organization. The system developed through the late seventh and early eighth centuries. Borrowed models were adapted to local political circumstances rather than simply copied without change."], "question": "A reform edict orders national change. What does it prove first?", "options": ["That the court articulated a policy, not that implementation was universal.", "Every household complied immediately and identically.", "Local elites ceased to exist on the day it was issued."], "answer": 0, "why": "Normative sources describe intended rules. Practice must be checked with additional evidence.", "term": {"romaji": "ritsuryo", "jp": "律令", "meaning": "The legal-administrative system associated with penal and administrative codes."}, "refs": ["taika"]}, {"id": "asuka-3", "title": "The temple is a workplace", "lens": "Daily life", "scene": "You approach a building site, not a finished monument.", "pages": ["A major temple demanded timber, tiles, pigments, metalwork, transport, and skilled construction. Craftspeople and laborers made a new religious landscape physically possible. The surviving building can hide the supply chains and obligations behind it.", "Patronage drew resources toward courtly centers. For people outside those centers, changes in rule could mean demands for labor or goods, not just a new religious ideal. History looks different from the viewpoint of a household supplying materials than from that of a donor.", "Roof tiles are a useful clue to these networks. Their manufacture required expertise and organized production. Tracing styles and workshops can help reconstruct connections, although a shared style alone does not identify a worker's birthplace or legal status."], "question": "Which question best recovers ordinary people's role in temple building?", "options": ["Who supplied materials, expertise, transport, and labor?", "Which ruler deserves sole credit for every stage of construction?", "Did religious buildings exist outside economic relationships?"], "answer": 0, "why": "A monument is the outcome of many linked forms of work, not only its patron's intention.", "term": {"romaji": "kawara", "jp": "瓦", "meaning": "Roof tile; an archaeological clue to construction techniques and production networks."}, "refs": ["asuka", "taika"]}, {"id": "asuka-4", "title": "Send an envoy, learn a system", "lens": "Society", "scene": "The court considers an expensive and risky overseas mission.", "pages": ["Missions to Sui and Tang China connected court leaders with prestigious models of statecraft, religion, and learning. Students and monks could remain abroad to study. Travel was hazardous, and the people who returned could bring strategically valuable knowledge.", "Diplomatic language conveyed status claims. A ruler's chosen title or manner of addressing another sovereign was not merely polite decoration. It positioned the court within a wider order of relationships and could be read as deference, rivalry, or independence.", "These exchanges involved the Korean peninsula as well as China. An account centered only on Japan and a single mainland power misses the multi-sided networks through which people, books, and skills moved. Influence was negotiated and transformed in use."], "question": "What could an overseas mission bring besides imported objects?", "options": ["Knowledge and diplomatic claims that helped reshape court institutions.", "A guarantee that domestic rivalries would disappear.", "Proof that foreign models were adopted without modification."], "answer": 0, "why": "Travel and translation expanded what court reformers could imagine and attempt.", "term": {"romaji": "kenzuishi", "jp": "遣隋使", "meaning": "An envoy or mission sent to Sui China."}, "refs": ["asuka", "taika"]}, {"id": "asuka-5", "title": "Writing power into a title", "lens": "Language", "scene": "The court wants language that presents its authority as universal.", "pages": ["Chinese writing was a vehicle for diplomacy, doctrine, law, and prestige. Using Chinese texts did not mean every inhabitant spoke Chinese. Literacy, reading practices, and ordinary speech were different domains with different social distributions.", "The title tenno came to express a distinctive claim to sovereignty. Its establishment belongs to the development of the late seventh-century state, not to an unchanged institution extending transparently into prehistory. Political language helped make authority imaginable.", "Our modern readings make historical terms accessible, but they do not reconstruct seventh-century pronunciation. Later sources also attribute texts and actions to earlier figures. Distinguish an attribution, a surviving document, and the historical event that a document describes."], "question": "Which distinction matters when studying early writing?", "options": ["Written language, reading practice, and everyday speech are not identical.", "Anyone who used a Chinese character necessarily spoke Chinese at home.", "Modern audio exactly reproduces seventh-century pronunciation."], "answer": 0, "why": "Scripts circulate across linguistic communities, and pronunciations change over time.", "term": {"romaji": "tenno", "jp": "天皇", "meaning": "Emperor; a sovereign title established in the developing early Japanese state."}, "refs": ["oldjp", "asuka"]}]}, {"id": "nara", "name": "Nara", "jp": "奈良", "dates": "710-794", "tag": "The state counts its people", "desc": "A planned capital, household registers, taxation, and poetry reveal two very different worlds.", "region": "Heijo-kyo and its provinces", "artifact": "Wooden writing tablet", "refs": ["asuka", "taika", "oldjp"], "power": "A coded court bureaucracy claimed authority through ranked offices, registers, and provincial administration.", "life": "Goods and labor flowed toward the capital; most people lived and worked far from its elite precincts.", "voice": "Chinese-style texts and phonetic uses of characters coexisted; poetry preserves a selective range of voices.", "lessons": [{"id": "nara-1", "title": "A capital on a grid", "lens": "World", "scene": "You enter Heijo-kyo, a city designed to make rule visible.", "pages": ["The court established the capital at Heijo-kyo, present-day Nara, in 710. Its planned layout drew on continental precedents. Palaces, administrative facilities, and major temples concentrated authority and resources within a deliberately ordered urban landscape.", "The capital was part of a wider fiscal and transport network. Provincial products, labor, and documents linked distant communities with central institutions. Seeing an impressive city should prompt a second question: what relationships made that concentration possible?", "Nara was not the daily environment of most inhabitants. Rural settlements and regional differences remain essential to the story. A surviving elite object may tell us much about the capital without representing the living conditions of the population as a whole."], "question": "What should a planned capital make you ask next?", "options": ["How resources and labor reached it from other communities.", "Whether everyone in the archipelago lived in similar urban conditions.", "Whether a grid plan proves that local differences vanished."], "answer": 0, "why": "The city's design and the networks supporting it are two sides of state formation.", "term": {"romaji": "Heijo-kyo", "jp": "平城京", "meaning": "The capital established at Nara in 710."}, "refs": ["asuka", "taika", "oldjp"]}, {"id": "nara-2", "title": "Your household, their register", "lens": "Power", "scene": "An official turns a household into entries in a record.", "pages": ["Registers and land arrangements made people and production legible to the court. The ritsuryo state sought to allocate obligations through classifications of households, status, and land. Administrative categories were instruments of power, not just neutral descriptions.", "So, yo, and cho are conventional names for major obligations involving rice, labor or its commutation, and goods. The exact burden depended on category and circumstance. Transport and military duties could add further strain beyond a simple three-part classroom diagram.", "Rules did not always match realities on the ground. Evasion, negotiation, changes in cultivation, and the growth of privileged holdings complicated the fiscal system. The important dynamic is the gap between a court's administrative ambition and its ability to sustain extraction."], "question": "Why did household registers matter politically?", "options": ["They helped assign obligations and make the population administratively visible.", "They guaranteed equal burdens for every person.", "They eliminated the need to negotiate with local conditions."], "answer": 0, "why": "Counting and classifying people can make taxation and service enforceable, though imperfectly.", "term": {"romaji": "so-yo-cho", "jp": "租庸調", "meaning": "A conventional grouping of major rice, labor-related, and goods obligations."}, "refs": ["taika", "asuka"]}, {"id": "nara-3", "title": "A delivery tag tells a story", "lens": "Daily life", "scene": "A wooden tablet accompanies goods sent toward the capital.", "pages": ["Mokkan are wooden tablets used for writing. Surviving examples can include labels, administrative notes, and other brief texts. Their practical contents reveal movement and work that grand chronicles may leave out. Ordinary paperwork is often extraordinary evidence.", "A label can connect an object with an origin, sender, quantity, or destination. Such details make visible the people and routes behind court consumption. A delivery was not an abstraction to the person producing or carrying it.", "Still, one tag is a partial record. It may omit negotiation, hardship, or the actual destination of every item. Combine it with excavated buildings, other documents, and the legal framework. The more varied the evidence, the less a single elite narrative dominates."], "question": "What makes a delivery tablet valuable for social history?", "options": ["It can reveal practical connections among production, people, and administration.", "It always contains a complete biography of the sender.", "It is less useful than a chronicle because its purpose was ordinary."], "answer": 0, "why": "Routine records often capture relationships that official narratives take for granted.", "term": {"romaji": "mokkan", "jp": "木簡", "meaning": "A wooden writing tablet used for labels, records, and other texts."}, "refs": ["asuka", "taika", "oldjp"]}, {"id": "nara-4", "title": "Many voices, selective survival", "lens": "Society", "scene": "A poem gives emotional form to a journey or separation.", "pages": ["The Manyoshu is a major early poetry anthology associated with the Nara age. Its poems are linked with people of different social positions, including court figures and people beyond the highest elite. It broadens the kinds of experience available to a historian.", "An anthology is not an unfiltered population survey. Selection, attribution, performance, and transmission shape what survives. A poem can convey emotional and social worlds without giving a statistically representative account of ordinary life.", "Women also held sovereign authority in this broad era, and elite women participated in literary life. Their visibility should not be erased. Nor should the prominence of some women substitute for investigating status, labor, family, and constraints across society."], "question": "How should the Manyoshu be used?", "options": ["As a rich but selected and mediated record of voices and experiences.", "As a complete transcript of every social group's daily conversations.", "As proof that every household had identical access to writing."], "answer": 0, "why": "Texts expand our evidence while retaining the biases of their production and survival.", "term": {"romaji": "Manyoshu", "jp": "万葉集", "meaning": "Collection of Ten Thousand Leaves; a major early Japanese poetry anthology."}, "refs": ["oldjp"]}, {"id": "nara-5", "title": "One script, several jobs", "lens": "Language", "scene": "The same Chinese character can carry meaning or represent sound.", "pages": ["Early Japanese writing used Chinese characters in several ways. Texts could be composed in Chinese-style language, while characters could also be used for their sounds to represent Japanese. The relationship between script and language was creative and technically demanding.", "Man'yogana is the conventional term for phonographic uses of characters associated with early Japanese texts. Later kana developed from such practices. This was a historical process, not a single moment when someone invented the fully modern writing system.", "Kanbun refers to Chinese-style writing and its reading traditions in Japan. Modern Japanese uses kanji alongside kana, but reading an early text still requires specialist knowledge of older language and writing conventions. Being able to read modern Japanese is not enough by itself."], "question": "Why is a Chinese character not proof that a text simply records spoken Chinese?", "options": ["Characters could represent Japanese sounds as well as carry lexical meanings.", "Chinese characters were never used for their meanings.", "All early texts used the modern kana system."], "answer": 0, "why": "The function of a written sign depends on the writing practice in which it appears.", "term": {"romaji": "kanbun", "jp": "漢文", "meaning": "Chinese-style writing and associated reading traditions in Japan."}, "refs": ["oldjp", "chj"]}]}, {"id": "heian", "name": "Heian", "jp": "平安", "dates": "794-1185", "tag": "The court has a group chat", "desc": "Marriage politics, estate income, sharp observation, and poetry make influence an art.", "region": "Heian-kyo, today's Kyoto", "artifact": "Poetry fan", "refs": ["heian", "yamatoe", "chj"], "power": "Fujiwara regents, emperors, retired sovereigns, temples, and provincial elites held overlapping power.", "life": "Courtly refinement depended on estate revenues and labor well beyond the capital.", "voice": "Poetry, handwriting, allusion, and the timing of a reply could signal cultivation and social standing.", "lessons": [{"id": "heian-1", "title": "Behind the beautiful capital", "lens": "World", "scene": "A courtly scene looks peaceful. Follow the resources outside the frame.", "pages": ["The capital moved to Heian-kyo in 794. Court culture became renowned for poetry, narrative, visual art, and elaborate social distinctions. Yet the history of the period includes much more than the small aristocratic world most vividly represented in surviving literature.", "Private estates, known as shoen, developed varied privileges and layered claims to revenue. Temples, aristocrats, local managers, and cultivators could hold different interests in the same land. \"Owner\" alone often fails to capture this complex arrangement.", "Provincial warrior networks gained importance over time, especially as elites sought protection and control over resources. The transition toward warrior government was not simply the sudden disappearance of a useless court. Older and newer institutions would coexist and compete."], "question": "Why is \"one owner per estate\" an inadequate model for many shoen?", "options": ["Several parties could hold different rights and revenue claims.", "Estates existed without anyone cultivating them.", "Every estate was directly administered by the same military ruler."], "answer": 0, "why": "Landholding can be a bundle of rights and obligations rather than one exclusive title.", "term": {"romaji": "shoen", "jp": "荘園", "meaning": "An estate with layered claims and, often, privileges affecting revenue or official intervention."}, "refs": ["heian", "yamatoe", "chj"]}, {"id": "heian-2", "title": "The family behind the throne", "lens": "Power", "scene": "An aristocratic family wants enduring influence over succession.", "pages": ["The Fujiwara used marriage ties to the imperial house and offices such as regent to exercise enormous influence. Being the maternal relative of a sovereign could provide a durable route to power. Political authority often ran through kinship, not only through a formal title.", "Sessho conventionally names a regent for a child sovereign, while kanpaku refers to a regent for an adult sovereign. The precise balance of power changed. Emperors and later retired emperors were also active political actors, not permanently powerless scenery.", "Map the relationships rather than memorizing \"emperor rules\" or \"Fujiwara rules.\" Access, succession, office, ritual authority, and resources could be held by different people. This is your first major practice in separating formal legitimacy from practical influence."], "question": "How did marriage serve Fujiwara political strategy?", "options": ["It linked the family to succession and regency through the imperial household.", "It abolished the imperial institution.", "It guaranteed that every emperor lacked all independent political agency."], "answer": 0, "why": "Kinship could structure access to office and succession without making the political balance static.", "term": {"romaji": "sessho", "jp": "摂政", "meaning": "A regent, conventionally for a child sovereign."}, "refs": ["heian"]}, {"id": "heian-3", "title": "The labor behind the layers", "lens": "Daily life", "scene": "An elegant garment reaches a court woman. Trace its hidden work.", "pages": ["Court attire, paper, buildings, food, and ceremonies required specialized production and sustained resources. Elite tastes rested on work done by cultivators, craftspeople, servants, and transporters. Beauty and hierarchy belonged to the same social system.", "Most people did not live like figures in court narratives. Village obligations, agricultural conditions, health, and local disputes shaped very different lives. A lavish literary description is evidence for a particular milieu, not a national standard of living.", "Even the court was not socially uniform. Rank, family connections, gender, and office affected access and opportunity. A lady-in-waiting could be highly literate and influential while operating within a constrained structure of patronage and service."], "question": "What is missing when Heian daily life is described only through court clothing?", "options": ["The labor, rural resources, and unequal access that supported elite display.", "Evidence that textiles were ever made.", "The idea that rank mattered at court."], "answer": 0, "why": "Follow the production and distribution of an object to recover people outside the literary spotlight.", "term": {"romaji": "nyobo", "jp": "女房", "meaning": "A court lady or lady-in-waiting; an elite social role, not a label for all women."}, "refs": ["heian", "yamatoe"]}, {"id": "heian-4", "title": "Your poem is your reputation", "lens": "Society", "scene": "An exchange calls for more than an ordinary acknowledgment.", "pages": ["For cultivated courtiers, a poem could communicate feeling, learning, and social awareness. References to seasons or earlier literature made meaning through shared knowledge. Handwriting, paper, and the timing of a reply could also shape how an exchange was understood.", "These conventions were not universal rules for every inhabitant. They belonged to a particular social world and varied with relationship and occasion. In role-play, the historically informed move is to attend to context rather than apply a timeless rule of Japanese politeness.", "Writers such as Murasaki Shikibu and Sei Shonagon illuminate observation, rivalry, aspiration, and constraint within court life. Their works have authorial voices and literary purposes. They are rich sources, not transparent recordings of every interaction."], "question": "Why might a courtly reply in verse matter politically or socially?", "options": ["It could display shared learning and sensitivity within elite networks.", "It was legally required of every agricultural household.", "Its meaning depended only on the literal dictionary definition of each word."], "answer": 0, "why": "Status could be performed through cultural fluency, allusion, and the management of relationships.", "term": {"romaji": "waka", "jp": "和歌", "meaning": "Japanese poetry; at court, often a vehicle for cultivated social exchange."}, "refs": ["heian", "chj"]}, {"id": "heian-5", "title": "Kana opens new possibilities", "lens": "Language", "scene": "You compare an official document with a vernacular narrative.", "pages": ["Hiragana and katakana emerged from practices of simplifying or adapting Chinese characters. They made it possible to write Japanese in new ways alongside continued use of Chinese-style learning and writing. The result was coexistence, not the immediate replacement of kanji.", "Women at court made major contributions to vernacular literature, but \"women used kana and men used Chinese\" is too rigid. Practices crossed that divide, and access to education depended on more than gender alone. Literary convention and individual ability must be distinguished.", "Classical Japanese differs from modern Japanese in grammar, vocabulary, spelling, and sound. TOKI's contemporary pronunciation aids help you recognize terms; they are not an audio reconstruction of a Heian conversation. Study language change without turning a costume-drama phrase into a universal fact."], "question": "Which description of Heian writing is most accurate?", "options": ["Kana and Chinese-style writing coexisted, with practices crossing simple gender divisions.", "Kana immediately eliminated kanji.", "Modern Japanese and Heian Japanese had identical grammar and pronunciation."], "answer": 0, "why": "Scripts and registers were associated with social settings, but not sealed into absolute categories.", "term": {"romaji": "kana", "jp": "仮名", "meaning": "Phonographic Japanese scripts: hiragana and katakana."}, "refs": ["chj", "heian"]}]}, {"id": "kamakura", "name": "Kamakura", "jp": "鎌倉", "dates": "1185/1192-1333", "tag": "Two centers, tangled power", "desc": "Follow land claims, warrior service, regents, new religious movements, and costly defense.", "region": "Kamakura and Kyoto", "artifact": "Warrior petition", "refs": ["kamakura", "samurai", "chj"], "power": "Warrior government and court institutions coexisted; Hojo regents later dominated the shogunate.", "life": "Land revenue, service obligations, inheritance, and litigation mattered as much as battlefield ideals.", "voice": "Petitions, religious teaching, and performed war tales reached different audiences in different registers.", "lessons": [{"id": "kamakura-1", "title": "When does an era really begin?", "lens": "World", "scene": "Two textbooks give you 1185 and 1192.", "pages": ["The defeat of the Taira in 1185 and Minamoto no Yoritomo's appointment as shogun in 1192 mark different stages in the emergence of the Kamakura government. Choosing an era boundary depends partly on which institutional change a historian emphasizes.", "The court remained in Kyoto while the warrior government developed in Kamakura. Temples, estates, and local authorities retained important roles. The shorthand \"emperors reigned, shoguns ruled\" can orient a beginner but should not erase overlapping jurisdictions and ongoing court agency.", "Rather than hunt for one magical founding day, connect military victory, appointments, land administration, and relationships with followers. Political systems accumulate capacities. This same habit will help you interpret the Meiji transformation and the postwar settlement."], "question": "Why can both 1185 and 1192 appear as Kamakura starting dates?", "options": ["They mark different developments in the formation of warrior government.", "One date uses a different number of days in a year.", "Nothing politically important happened between them."], "answer": 0, "why": "Periodization is an analytical choice tied to evidence and the historical process being emphasized.", "term": {"romaji": "bakufu", "jp": "幕府", "meaning": "Warrior government or shogunate; a conventional historical term."}, "refs": ["kamakura", "samurai", "chj"]}, {"id": "kamakura-2", "title": "The shogun is not the whole chart", "lens": "Power", "scene": "You are a vassal seeking confirmation of a land claim.", "pages": ["Gokenin were direct vassals of the Kamakura shogunate. Service and the recognition or protection of land rights linked them to the regime. Loyalty was embedded in material expectations, family strategies, and disputes over revenue.", "After Yoritomo's line weakened, Hojo regents became dominant within the shogunate. The person holding the title shogun was not always the strongest decision-maker. Formal rank and effective control could sit in different hands.", "Land cases and appointments are therefore central to warrior politics. A petition or judgment might matter more to a household's future than a celebrated duel. Avoid explaining the whole system through a single timeless code of honor."], "question": "Why did a warrior need more than fighting skill to prosper?", "options": ["Land rights, service relationships, and legal recognition also mattered.", "The shogunate never handled land disputes.", "The title shogun always identified the strongest individual."], "answer": 0, "why": "Political institutions protected or redistributed resources, making law and patronage central to warrior life.", "term": {"romaji": "gokenin", "jp": "御家人", "meaning": "A direct vassal of the Kamakura shogunate."}, "refs": ["kamakura", "samurai"]}, {"id": "kamakura-3", "title": "The estate has competing claims", "lens": "Daily life", "scene": "A cultivator encounters a new steward but old obligations remain.", "pages": ["Jito were estate stewards appointed under warrior authority. Their responsibilities and opportunities could overlap or conflict with claims held by aristocrats, temples, and local people. A new official did not necessarily erase every earlier right.", "Cultivating households supported the revenues at stake. Disputes over dues and control could shape their daily conditions, even when the surviving documents focus on elite litigants. Look for the productive work underneath an argument about ownership.", "Inheritance divided or concentrated property according to changing family strategies. Women in warrior families could hold and transmit property, though conditions varied and constraints developed. Neither total exclusion nor full modern equality accurately captures this history."], "question": "What could happen when a jito arrived at an estate?", "options": ["Warrior authority could overlap with existing claims and provoke disputes.", "All earlier claims necessarily vanished overnight.", "Cultivators stopped being essential to estate revenue."], "answer": 0, "why": "Medieval administration often layered new authority onto older relationships.", "term": {"romaji": "jito", "jp": "地頭", "meaning": "An estate steward associated with the warrior government."}, "refs": ["kamakura", "samurai"]}, {"id": "kamakura-4", "title": "Faith beyond one stereotype", "lens": "Society", "scene": "Different teachers offer different paths through suffering and uncertainty.", "pages": ["Pure Land movements, Zen traditions, and Nichiren's teaching gained new prominence in the medieval period. Their followers and practices varied. Older temple institutions and esoteric traditions also persisted; new movements did not simply clear the religious landscape.", "Nenbutsu, invocation of Amida Buddha, became central to several Pure Land traditions, though their doctrines differed. Religious teaching could address audiences beyond the court. Accessibility of a practice did not mean every teacher or follower shared one theology.", "The Mongol-led invasions of 1274 and 1281 imposed heavy defense burdens. Storms mattered, but defenders, fortifications, logistics, and the attackers' difficulties also mattered. A one-cause miracle story obscures both military work and the regime's problems rewarding service."], "question": "Why is \"all samurai followed Zen\" misleading?", "options": ["Warriors and other people participated in varied, overlapping religious traditions.", "Zen did not exist in medieval Japan.", "New religious movements immediately removed every older temple."], "answer": 0, "why": "Social groups are not religious monoliths. Institutions and individual practices varied.", "term": {"romaji": "nenbutsu", "jp": "念仏", "meaning": "Invocation of Amida Buddha, important in Pure Land traditions."}, "refs": ["kamakura", "samurai"]}, {"id": "kamakura-5", "title": "The tale is not the battle", "lens": "Language", "scene": "A performed war tale makes a fallen house feel unforgettable.", "pages": ["The Tale of the Heike evokes the rise and fall of the Taira and themes of impermanence. Its performance and textual traditions developed over time. It is a major literary and cultural source, not an unedited transcript of the events it narrates.", "Mujo, impermanence, frames worldly power as unstable. Such language helped listeners interpret loss, ambition, and changing fortune. A narrative can communicate a historical worldview even where an individual episode requires comparison with other evidence.", "Compare a literary tale with a petition. One may foreground pathos and exemplary conduct; another may strategically assert a legal right. Genre affects what a source emphasizes. Reading historical language means asking what the words were trying to accomplish."], "question": "How should a war tale be read alongside a legal petition?", "options": ["As a different genre with different aims, strengths, and distortions.", "As an identical kind of record with the same evidentiary limits.", "As useless because literature cannot reveal historical values."], "answer": 0, "why": "A source's purpose shapes its language. Literary meaning and factual reconstruction are connected but distinct tasks.", "term": {"romaji": "mujo", "jp": "無常", "meaning": "Impermanence; the instability of worldly things, a major Buddhist and literary theme."}, "refs": ["chj", "kamakura"]}]}, {"id": "muromachi", "name": "Muromachi", "jp": "室町", "dates": "1336-1573", "tag": "A fractured country, a creative age", "desc": "Weak centers coexist with strong local actors, commercial networks, and influential arts.", "region": "Kyoto, provinces, and maritime routes", "artifact": "Tea bowl", "refs": ["muromachi", "samurai", "yamatoe"], "power": "Ashikaga shoguns depended on powerful provincial lords amid divided loyalties and competing institutions.", "life": "Markets, transport, village organization, and specialist trades expanded despite instability.", "voice": "Linked verse, theater, and written agreements made culture and collective action social practices.", "lessons": [{"id": "muromachi-1", "title": "A center that cannot hold everything", "lens": "World", "scene": "Two courts claim legitimacy while provincial powers maneuver.", "pages": ["After Kamakura fell in 1333, an attempted restoration of direct imperial rule gave way to Ashikaga warrior government. Rival northern and southern courts contested legitimacy during the fourteenth century. The northern court and Ashikaga interests were closely linked.", "The Ashikaga government, conventionally dated from 1336 or 1338, depended heavily on powerful provincial military governors. The era name Muromachi comes from a Kyoto district associated with the shogunal headquarters. It describes a political center, not complete control of the country.", "The courts were reunited in 1392, but competition within the warrior order continued. The Onin War, beginning in 1467, devastated Kyoto and accelerated fragmentation. Institutions did not simply disappear; their authority became increasingly contested and locally reworked."], "question": "Why did a shogunal headquarters in Kyoto not imply uniform national control?", "options": ["Provincial powers retained resources and influence the center depended on.", "Every provincial lord was merely a powerless clerk.", "Rival legitimacy claims had no political consequences."], "answer": 0, "why": "Central titles and local capabilities must be examined separately.", "term": {"romaji": "shugo", "jp": "守護", "meaning": "A provincial military governor; some became powerful territorial lords."}, "refs": ["muromachi", "kamakura"]}, {"id": "muromachi-2", "title": "People can organize sideways", "lens": "Power", "scene": "Villagers coordinate a demand rather than approach a lord individually.", "pages": ["Ikki is a broad term for leagues, collective action, or uprisings. Participants and purposes varied: villagers, warriors, religious communities, and others could form associations. It does not name one permanent revolutionary class or one uniform political program.", "Collective action could seek debt cancellation, defend local interests, or challenge officials and rival powers. Cooperation might rest on written agreements and oaths. People with limited individual leverage could gain influence through coordinated action.", "These movements also had exclusions and internal hierarchies. An uprising was not automatically a campaign for modern democracy. Ask who joined, what they wanted, whom they opposed, and how they enforced cooperation before choosing a modern political label."], "question": "What must you establish before calling an ikki democratic?", "options": ["Its membership, aims, internal rules, and context.", "Only that more than one person took part.", "Only that participants opposed someone powerful."], "answer": 0, "why": "Collective organization and modern democratic principles are not the same category.", "term": {"romaji": "ikki", "jp": "一揆", "meaning": "A league or form of collective action; its meaning depends on the participants and context."}, "refs": ["muromachi"]}, {"id": "muromachi-3", "title": "Business continues during disorder", "lens": "Daily life", "scene": "A craft group bargains for protection and trading privileges.", "pages": ["Political instability did not prevent economic development. Markets, transportation, specialized production, and towns grew in many regions. War could disrupt livelihoods while also creating demand and opportunities for particular producers and intermediaries.", "Za were associations of merchants or craftspeople with varied arrangements and privileges. Links with temples, nobles, or other patrons could help secure access and protection. Do not equate every za directly with a modern company or a European guild.", "For a household, this world combined opportunities with exposure to dues, conflict, and changing patrons. The same road could carry commodities and troops. Economic and political history should be read together, not as separate stories of uninterrupted growth and uninterrupted chaos."], "question": "What does commercial growth during political instability teach?", "options": ["Economic and political developments can follow different but connected paths.", "War never harmed any livelihood.", "Markets require a perfectly centralized state before they can exist."], "answer": 0, "why": "Fragmented authority can coexist with active exchange, though risk and benefits are unevenly distributed.", "term": {"romaji": "za", "jp": "座", "meaning": "A merchant or craft association, often linked to a patron and particular privileges."}, "refs": ["muromachi", "samurai", "yamatoe"]}, {"id": "muromachi-4", "title": "Culture is a relationship", "lens": "Society", "scene": "A performance gathers patrons and artists into the same room.", "pages": ["No theater developed under important warrior patronage, especially in the Ashikaga milieu. Performance linked artistic skill, religious themes, literary knowledge, and elite support. Culture was not merely an escape from politics; patronage could help structure political relationships.", "Tea, gardens, ink painting, and other arts also developed through contacts among temples, warriors, and wider networks. Their histories involve selection and change. A practice that looks timeless today often took shape through particular institutions and tastes.", "Court traditions continued alongside innovations. Avoid a stark replacement story in which rough warriors abolished refined aristocratic culture. Many military elites valued cultural competence precisely because it helped them participate in prestigious social worlds."], "question": "Why would a warrior ruler invest in cultural patronage?", "options": ["It could express legitimacy, build relationships, and display cultivation.", "Military elites were categorically uninterested in literature and art.", "Patronage had no connection with social standing."], "answer": 0, "why": "Culture could be one of the resources through which authority was recognized.", "term": {"romaji": "No", "jp": "能", "meaning": "A classical Japanese theater tradition shaped by medieval performance and patronage."}, "refs": ["muromachi", "samurai"]}, {"id": "muromachi-5", "title": "The poem has other authors", "lens": "Language", "scene": "Your verse must answer the contribution before it.", "pages": ["Renga, linked verse, is collaborative poetry. Participants build a sequence through relationships among successive contributions, drawing on conventions, seasonal references, and shared learning. Skill involves listening and responding, not only producing an isolated brilliant line.", "Such gatherings could bring people into relationships that were cultural and social at once. Ru
