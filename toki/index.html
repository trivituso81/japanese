.edu/main_pop/ps/ps_japan-taika.htm"], "oldjp": ["Oxford / NINJAL", "Oxford-NINJAL Corpus of Old Japanese", "https://oncoj.ninjal.ac.jp/about_the_project_English.html"], "chj": ["NINJAL", "Corpus of Historical Japanese: overview", "https://clrd.ninjal.ac.jp/chj/overview-en.html"], "heian": ["The Metropolitan Museum of Art", "Heian Period (794-1185)", "https://www.metmuseum.org/essays/heian-period-794-1185"], "yamatoe": ["The Metropolitan Museum of Art", "Yamato-e Painting", "https://www.metmuseum.org/essays/yamato-e-painting"], "kamakura": ["The Metropolitan Museum of Art", "Kamakura and Nanbokucho Periods", "https://www.metmuseum.org/essays/kamakura-and-nanbokucho-periods-1185-1392"], "samurai": ["The Metropolitan Museum of Art", "Samurai", "https://www.metmuseum.org/essays/samurai"], "muromachi": ["The Metropolitan Museum of Art", "Muromachi Period", "https://www.metmuseum.org/essays/muromachi-period-1392-1573"], "swords": ["Columbia University, Asia for Educators", "Collection of Swords, 1588", "https://afe.easia.columbia.edu/main_pop/ps/ps_japan-tokugawa-edicts-swords.htm"], "buke": ["Columbia University, Asia for Educators", "Laws of Military Households, 1615", "https://afe.easia.columbia.edu/main_pop/ps/ps_japan-tokugawa-edicts-military.htm"], "classes": ["Columbia University, Asia for Educators", "Tokugawa Ieyasu on Military Government and the Social Order", "https://afe.easia.columbia.edu/main_pop/ps/ps_japan-ieyasu-four-classes.htm"], "porcelain": ["The Metropolitan Museum of Art", "Edo-Period Japanese Porcelain", "https://www.metmuseum.org/essays/edo-period-japanese-porcelain"], "hagakure": ["Columbia University, Asia for Educators", "Hagakure: introduction and excerpts", "https://afe.easia.columbia.edu/main_pop/ps/ps_japan-hakagure.htm"], "aizawa": ["Columbia University, Asia for Educators", "Aizawa Seishisai, New Theses", "https://afe.easia.columbia.edu/main_pop/ps/ps_japan-aizawa-seishisai-shinron.htm"], "fukuzawa": ["Columbia University, Asia for Educators", "The Autobiography of Fukuzawa Yukichi", "https://afe.easia.columbia.edu/main_pop/ps/ps_japan-fukuzawa-yukichi.htm"], "oath": ["Columbia University, Asia for Educators", "The Charter Oath, 1868", "https://afe.easia.columbia.edu/main_pop/ps/ps_japan-charter-oath-1868.htm"], "meijiconst": ["Columbia University, Asia for Educators", "The Meiji Constitution of 1889", "https://afe.easia.columbia.edu/main_pop/ps/ps_japan-meiji-constitution.htm"], "iwakura": ["Columbia University, Asia for Educators", "Letter on the Iwakura Mission, 1871", "https://afe.easia.columbia.edu/main_pop/ps/ps_japan-meiji-to-grant.htm"], "suffrage": ["National Diet Library", "Universal Manhood Suffrage and Peace Preservation, 1925", "https://www.ndl.go.jp/modern/e/cha3/description13.html"], "rice": ["National Diet Library", "Taisho Democracy: an archival overview", "https://www.ndl.go.jp/modern/e/cha3/index.html"], "constitution": ["National Diet Library", "The Constitution of Japan", "https://www.ndl.go.jp/constitution/e/etc/c01.html"], "ainu": ["Upopoy National Ainu Museum and Park", "Ainu culture, language and revitalization", "https://ainu-upopoy.go.jp/en/facility/upopoy/"], "pm2026": ["Prime Minister's Office of Japan", "Designation of the Prime Minister, February 18, 2026", "https://japan.kantei.go.jp/105/actions/202602/_00001.html"], "census": ["Statistics Bureau of Japan", "2025 Census preliminary counts, released May 29, 2026", "https://www.stat.go.jp/english/info/news/20260625.html"], "silk": ["UNESCO", "Tomioka Silk Mill and Related Sites", "https://whc.unesco.org/en/list/1449/"], "ryukyu": ["Okinawa Prefectural Archives", "Establishment of Okinawa Prefecture, 1879", "https://www.archives.pref.okinawa.jp/news/that_day/4631"], "okinawa1972": ["Okinawa Convention and Visitors Bureau", "Fifty years since reversion in 1972", "https://www.okinawastory.jp/feature/50th_anniversary"], "manchuria": ["National Diet Library", "Manchurian Incident of 1931", "https://www.ndl.go.jp/modern/e/cha4/description01.html"], "kono": ["Ministry of Foreign Affairs of Japan", "Kono Statement, August 4, 1993", "https://www.mofa.go.jp/a_o/rp/page25e_000343.html"], "quake": ["Japan Meteorological Agency", "The 2011 Great East Japan Earthquake", "https://www.jma.go.jp/jma/en/2011_Earthquake/Information_on_2011_Earthquake.html"], "reconstruction": ["Reconstruction Agency", "Great East Japan Earthquake and reconstruction", "https://www.reconstruction.go.jp/english/topics/GEJE/"], "hiroshima": ["City of Hiroshima", "The realities of the atomic bombing", "https://www.city.hiroshima.lg.jp/english/peace/1029920/1009857.html"], "nanjing": ["Ministry of Foreign Affairs of Japan", "History Issues Q&A", "https://www.mofa.go.jp/policy/q_a/faq16.html"], "kanto": ["National Diet Library", "Great Kanto Earthquake of 1923", "https://www.ndl.go.jp/modern/e/cha3/description11.html"], "minamata": ["National Institute for Minamata Disease", "Social background and causes of Minamata disease", "https://nimd.env.go.jp/archives/english/minamata_disease_in_depth/"], "bubble": ["Bank of Japan", "Economic activity and the legacy of the asset bubble, February 2025", "https://www.boj.or.jp/en/about/press/koen_2025/ko250219a.htm"], "censusfinal": ["City of Tomisato, reporting Statistics Bureau figures", "2025 Census final population counts, September 29, 2026", "https://www.city.tomisato.lg.jp/0000017422.html"], "article9": ["National Diet Library", "Birth of the Constitution: renunciation of war", "https://www.ndl.go.jp/constitution/e/ronten/02ronten.html"]}};
const ACTIVITIES={"timeline": [[538, "Buddhist transmission to the Yamato court", "Often dated to 538; 552 is another traditional date. Buddhism arrived through networks involving the Korean peninsula.", "asuka", "asuka"], [645, "Taika reform program", "A program associated with centralization; announcing reform was not the same as implementing it everywhere.", "asuka", "taika"], [710, "Capital established at Heijo-kyo", "The new capital in Nara became a center of court government and temple patronage.", "nara", "asuka"], [794, "Court moves to Heian-kyo", "The new capital became the center of Heian court culture; power remained geographically layered.", "heian", "heian"], [1185, "Minamoto victory in the Genpei War", "Warrior institutions developed around this transition. 1192 is another conventional date for the Kamakura founding.", "kamakura", "kamakura"], [1192, "Yoritomo receives the shogunal title", "The title marks one moment in a longer process of building warrior government.", "kamakura", "kamakura"], [1274, "First Mongol-led invasion", "Forces of the Mongol empire and its allies attacked northern Kyushu; another invasion followed in 1281.", "kamakura", "samurai"], [1333, "Kamakura government falls", "A brief imperial restoration followed before the establishment of Ashikaga military rule.", "muromachi", "kamakura"], [1467, "Onin War begins", "Conflict centered on Kyoto helped intensify fragmentation, though regional developments differed.", "sengoku", "muromachi"], [1543, "Portuguese firearms reach Tanegashima", "Firearms were adopted and produced within Japan; they interacted with existing military practices.", "sengoku", "samurai"], [1588, "Hideyoshi orders a sword hunt", "The edict asserted control over weapons and social order; actual implementation needs separate study.", "sengoku", "swords"], [1603, "Ieyasu appointed shogun", "Tokugawa government combined shogunal authority with the rule of domains.", "edo", "buke"], [1615, "Laws of Military Households", "Rules governing daimyo expressed the shogunate's efforts to regulate warrior elites.", "edo", "buke"], [1853, "Perry arrives in Japan", "The encounter accelerated an existing crisis; treaty-port commerce followed subsequent agreements.", "bakumatsu", "fukuzawa"], [1868, "Meiji Restoration", "The fall of Tokugawa rule opened a process of state reconstruction, not an instantaneous completion of modernization.", "meiji", "oath"], [1879, "Ryukyu annexed as Okinawa Prefecture", "The abolition of the kingdom formed part of an unequal incorporation into the modern Japanese state.", "meiji", "ryukyu"], [1889, "Meiji constitution promulgated", "The constitution located sovereignty in the emperor and established a particular balance of state institutions.", "meiji", "meijiconst"], [1918, "Rice riots", "Protests over rice prices connected household provisioning with political legitimacy.", "taisho", "rice"], [1923, "Great Kanto Earthquake", "The disaster was followed by deadly violence against Koreans and others amid false rumors.", "taisho", "kanto"], [1925, "Male franchise expanded", "The removal of the property qualification did not enfranchise women; the Peace Preservation Law also strengthened repression.", "taisho", "suffrage"], [1931, "Manchurian Incident", "Kwantung Army officers staged an explosion and used it to justify military expansion.", "war", "manchuria"], [1945, "Japan surrenders", "Surrender was announced on August 15; the formal signing took place on September 2. Human consequences continued.", "war", "hiroshima"], [1947, "Postwar constitution takes effect", "Popular sovereignty, rights, and the symbolic emperor replaced the Meiji constitutional framework.", "postwar", "constitution"], [1956, "Minamata disease officially reported", "Recognition of the pollution and accountability unfolded through a prolonged struggle.", "postwar", "minamata"], [1972, "Okinawa returns to Japanese administration", "The mainland occupation had ended in 1952. Regional timelines matter.", "postwar", "okinawa1972"], [1989, "Heisei era begins", "A new era name did not replace the postwar constitution.", "heisei", "constitution"], [2011, "Great East Japan Earthquake", "The earthquake, tsunami, and nuclear accident had distinct but connected consequences.", "heisei", "quake"], [2019, "Reiwa era begins", "Official era dating changed while the postwar constitutional system continued.", "reiwa", "constitution"], [2026, "Takaichi designated prime minister, February 18", "This dated event is documented by the Prime Minister's Office; this app is not a live officeholder tracker.", "reiwa", "pm2026"]], "scenarios": [{"id": "winter", "era": "jomon", "title": "Before the winter", "role": "A member of a coastal household", "intro": "Autumn is ending. Your group must balance stores, relationships, and knowledge of the shore. This is an imagined situation, not a recovered Jomon conversation.", "refs": ["jomon", "pottery"], "steps": [{"title": "The tide gives you a choice", "text": "There is time for one substantial task today. What will you prioritize?", "low": "Supplies are thin; the choice now feels less comfortable.", "choices": [{"label": "Gather and process food", "result": "You increase immediate stores, but spend time that could have supported other relationships.", "delta": [2, 0, 0]}, {"label": "Help another household repair its gear", "result": "There is less food to show tonight, but you strengthen a reciprocal relationship.", "delta": [-1, 2, 1]}, {"label": "Explore a different stretch of coast", "result": "You learn a new resource location. Exploration takes time and does not guarantee an immediate return.", "delta": [-1, 0, 3]}]}, {"title": "Visitors at the hearth", "text": "A neighboring group arrives while your household is preparing food.", "low": "Your stores are low, so sharing involves a real sacrifice.", "choices": [{"label": "Share a portion and exchange news", "result": "Some food leaves your stores. In return, relationships and environmental information may become more useful.", "delta": [-1, 2, 1]}, {"label": "Exchange toolmaking knowledge", "result": "You focus on a skill exchange rather than a large meal. Cooperation need not require currency.", "delta": [0, 1, 2]}, {"label": "Keep most stores for the household", "result": "You preserve a buffer, but an opportunity for closer exchange passes.", "delta": [1, -1, 0]}]}, {"title": "What will tomorrow remember?", "text": "You want to pass useful knowledge to a younger member of the group.", "low": "Limited stores make knowledge about reliable resources especially valuable.", "choices": [{"label": "Practice food processing together", "result": "Hands-on repetition connects a material skill with the seasons.", "delta": [1, 0, 2]}, {"label": "Visit a neighboring household together", "result": "You pass on relationships as well as instructions.", "delta": [0, 2, 1]}, {"label": "Revisit the newly explored coast", "result": "You invest in environmental knowledge whose payoff may arrive later.", "delta": [-1, 0, 3]}]}]}, {"id": "letter", "era": "heian", "title": "The letter before sunrise", "role": "A fictional junior attendant", "intro": "A household at court needs a carefully judged reply. Literary skill matters, but so do rank, timing, and the labor that supports elegance.", "refs": ["heian", "yamatoe"], "steps": [{"title": "A delicate reply", "text": "A senior attendant asks for help preparing a response.", "low": "Your household's resources are limited; even a polished response has material costs.", "choices": [{"label": "Ask about the relationship first", "result": "You learn why the recipient and occasion matter before choosing words.", "delta": [0, 1, 2]}, {"label": "Choose elaborate paper and presentation", "result": "Presentation may signal care, but it consumes valuable material.", "delta": [-2, 2, 0]}, {"label": "Prepare a concise draft quickly", "result": "You conserve supplies and meet the immediate deadline, with less time to investigate nuance.", "delta": [1, 0, 1]}]}, {"title": "An allusion you do not recognize", "text": "The proposed poem refers to an older work.", "low": "A mistake could be socially costly when other resources are scarce.", "choices": [{"label": "Consult an experienced attendant", "result": "You acknowledge a gap and draw on a relationship to interpret the reference.", "delta": [0, 1, 2]}, {"label": "Use an allusion you understand well", "result": "You choose control over display. Familiar material can still be adapted thoughtfully.", "delta": [1, 0, 1]}, {"label": "Ask a peer to work through it together", "result": "Interpretation becomes cooperative; the peer gains a reason to help again.", "delta": [0, 2, 1]}]}, {"title": "Who made the polished result possible?", "text": "The reply is ready, but delivery requires other people's work.", "low": "There is little room for waste, so coordination matters.", "choices": [{"label": "Coordinate with the messenger", "result": "Timely delivery connects literary expression with practical organization.", "delta": [1, 1, 1]}, {"label": "Credit the people who helped", "result": "You make supporting labor visible and strengthen relationships within the household.", "delta": [0, 2, 1]}, {"label": "Record what you learned for next time", "result": "You turn this occasion into a resource for future interpretation.", "delta": [0, 0, 3]}]}]}, {"id": "petition", "era": "kamakura", "title": "One field, two claims", "role": "A fictional estate intermediary", "intro": "A cultivator, a steward, and a distant estate holder disagree over obligations. There is no simple map with one owner and one unquestioned right.", "refs": ["kamakura", "samurai"], "steps": [{"title": "Before the argument", "text": "Each party insists that its claim is obvious. How do you begin?", "low": "A weak resource position makes a prolonged dispute harder to sustain.", "choices": [{"label": "Collect existing records", "result": "Documents may clarify obligations, though they also preserve the interests of their creators.", "delta": [-1, 0, 3]}, {"label": "Listen separately to the parties", "result": "You learn how the dispute looks from different positions and create space for negotiation.", "delta": [0, 2, 1]}, {"label": "Inspect the harvest situation", "result": "Practical conditions reveal what can actually be extracted without undermining cultivation.", "delta": [2, 0, 1]}]}, {"title": "The immediate payment", "text": "The steward seeks a payment before all claims have been resolved.", "low": "The household has little surplus, so every demand has consequences.", "choices": [{"label": "Negotiate a temporary arrangement", "result": "A provisional compromise can keep production going without settling every legal issue.", "delta": [1, 1, 1]}, {"label": "Request a formal review", "result": "You invest in clarifying authority, at the cost of time and resources.", "delta": [-2, 0, 3]}, {"label": "Seek support from another interested party", "result": "A wider network can add influence, but creates new relationships and obligations.", "delta": [-1, 3, 0]}]}, {"title": "Make the outcome usable", "text": "An agreement that nobody understands may generate another dispute.", "low": "Limited resources make a repeat conflict especially costly.", "choices": [{"label": "Write down the obligations", "result": "A record supports future claims but must still be interpreted and enforced.", "delta": [0, 1, 2]}, {"label": "Explain the arrangement locally", "result": "Shared understanding makes implementation more plausible.", "delta": [0, 2, 1]}, {"label": "Check the demands against the next harvest", "result": "You connect formal obligations with the productive limits of the field.", "delta": [2, 0, 1]}]}]}, {"id": "print", "era": "edo", "title": "A print shop on a deadline", "role": "A fictional apprentice in a city shop", "intro": "A new print has customers waiting. Your work depends on craftspeople, suppliers, regulations, and the habits of a crowded city.", "refs": ["classes", "porcelain", "hagakure"], "steps": [{"title": "What will catch attention?", "text": "The shop needs a subject that can find an audience.", "low": "Materials are scarce, so a failed edition would hurt.", "choices": [{"label": "Study what customers ask about", "result": "Audience knowledge can guide a choice, though demand is never guaranteed.", "delta": [1, 0, 2]}, {"label": "Consult the experienced designer", "result": "The relationship can improve judgment and quality.", "delta": [-1, 2, 1]}, {"label": "Reuse a familiar theme with a new detail", "result": "You reduce risk and material waste, at the cost of less novelty.", "delta": [2, 0, 0]}]}, {"title": "A problem with the paper", "text": "The delivery is smaller than expected.", "low": "With few supplies left, coordination matters more than speed.", "choices": [{"label": "Reduce the first print run", "result": "You conserve materials while learning whether customers respond.", "delta": [2, 0, 1]}, {"label": "Negotiate another delivery", "result": "A supplier relationship becomes part of the production process.", "delta": [-1, 2, 1]}, {"label": "Coordinate carefully with the printer", "result": "Better preparation may reduce waste without creating more paper.", "delta": [1, 1, 1]}]}, {"title": "Reading the finished print", "text": "A customer asks what the image says about city life.", "low": "Your narrow margin is a reminder that art also has a material economy.", "choices": [{"label": "Discuss the people and work behind it", "result": "You connect the visible image with the network that produced it.", "delta": [0, 1, 2]}, {"label": "Explain that it is a selected viewpoint", "result": "A fashionable image is evidence of representation, not a photograph of every household.", "delta": [0, 0, 3]}, {"label": "Listen to the customer's interpretation", "result": "Reception can differ from the maker's intention and teach the shop something new.", "delta": [0, 2, 1]}]}]}, {"id": "school", " d"><h2>Your path through time</h2><span class="eyebrow">${done()} / 90 MISSIONS</span></div><div class="progress-line"><i style="width:${done()/90*100}%"></i></div><div class="timeline-list mt">${E.map(eraRow).join('')}</div><div class="end-banner"><h3>One history. Many perspectives.</h3><p>Power, ordinary lives, social relationships, language, and the evidence that helps us understand them. Every chapter is open from the start.</p></div><p class="footer-note">A broad foundation, not the final word.<br>Researched through October 10, 2026.</p>`}

function eraPage(id){const e=EM[id];if(!e)return journey();const c=completeCount(e);return `${back('Your journey')}<section class="era-banner"><span class="era-jp" lang="ja">${esc(e.jp)}</span><div class="eyebrow accent">CHAPTER ${String(E.indexOf(e)+1).padStart(2,'0')} &middot; ${esc(e.dates)}</div><h1>${esc(e.name)}</h1><p>${esc(e.desc)}</p><div class="progress-line"><i style="width:${c*20}%"></i></div><div class="between small" style="margin-top:9px"><span>${c} of 5 missions explored</span><span>${c===5?'Stamp earned':5-c+' to your stamp'}</span></div></section>${e.sensitive?'<div class="note warm"><b>A serious chapter</b>Contains non-graphic discussion of war, colonial violence, sexual coercion, and civilian suffering. Study at your own pace. There are no conquest rewards or timers.</div>':''}<div class="section-head"><h2>Five ways to see it</h2><span class="eyebrow">STORY + PRACTICE</span></div><div class="stack">${e.lessons.map((l,i)=>`<button class="lesson-item" data-act="start" data-id="${l.id}"><span class="lesson-num">${state.completed[l.id]?icon('check',16):i+1}</span><span class="content"><span class="eyebrow">${l.lens}</span><h3>${esc(l.title)}</h3><small>${state.completed[l.id]?`Best recall ${state.completed[l.id].best}/2 &middot; Revisit`:state.sessions[l.id]?'In progress &middot; Resume':'3 reading cards &middot; 2 retrieval questions'}</small></span>${icon('chevron',16)}</button>`).join('')}</div><div class="section-head"><h2>The era at a glance</h2></div><div class="card"><span class="pill">${icon('explore',12)} ${esc(e.region)}</span><div class="lens-grid">${[['Power','power'],['Daily life','life'],['Language','voice']].map(([label,key])=>`<div class="lens-card"><h3>${icon(lensIcon(label),17)} ${label}</h3><p>${esc(e[key])}</p></div>`).join('')}</div></div><div class="note mt"><b>Period boundaries are tools, not walls.</b>Archaeological changes were regionally uneven. Some political periods overlap; founding dates and period labels can differ between historians.</div>${refs(e.refs)}`}
function startLesson(id,restart=false){if(!LM[id])return;if(restart||!state.sessions[id])state.sessions[id]={step:0,answers:[null,null],orders:[shuffle([0,1,2]),shuffle([0,1,2])],xp:0};state.activeLesson=id;save();go('lesson/'+id)}

 const qi=st-4,q=getQ(id+':'+(qi===0?'concept':'term')),a=s.answers[qi];return `${header}<div class="eyebrow accent">RETRIEVE, DON\'T JUST RECOGNIZE &middot; ${qi+1}/2</div><h1 class="question">${esc(q.title)}</h1>${renderOptions(q,s.orders[qi],a,'lesson-answer',id)}${a?renderFeedback(q,a.correct)+button(qi===1?'Finish this mission':'One more connection','next-step',id):'<p class="micro mt">Choose the strongest answer. Mistakes become review cards, not penalties.</p>'}${a?refs(l.refs):''}`;
}
function renderOptions(q,order,a,action,id=''){return `<div class="options">${order.map((v,i)=>`<button class="option ${a?(v===0?'correct':v===a.selected?'wrong':''):''} ${a&&a.selected===v?'chosen':''}" data-act="${action}" data-id="${esc(id)}" data-val="${v}" ${a?'disabled':''}><span class="option-letter">${a&&v===0?icon('check',13):a&&v===a.selected?icon('close',13):'ABC'[i]}</span><span>${esc(q.options[v])}</span></button>`).join('')}</div>`}

function lessonResult(l,s){const score=s.answers.filter(a=>a?.correct).length,e=EM[l.era],c=completeCount(e),next=L[L.indexOf(l)+1];return `${back('Back to '+e.name,'era/'+e.id)}<section class="result"><div class="result-emblem"><span class="jp" lang="ja">${esc(e.jp)}</span></div><div class="eyebrow accent">MISSION EXPLORED</div><h1>${score===2?'You made the<br>connections.':'The story stays.<br>Keep connecting.'}</h1><p>${esc(l.title)}<br>${c===5?'All five perspectives explored. Era stamp earned.':'Another perspective added to your journey.'}</p><div class="result-stats"><div><b>${score}/2</b><span>Recall this time</span></div><div><b>+${s.xp||0}</b><span>XP earned</span></div><div><b>${c}/5</b><span>Era missions</span></div></div></section>${score<2?'<div class="note"><b>Understanding grows through return visits.</b>The missed questions are in focused review. Completion tracks the stories you explored; memory strength tracks repeated successful retrieval.</div>':''}<label class="field-label" for="reflection">One thing worth remembering</label><textarea id="reflection" data-lesson="${l.id}" maxlength="4000" placeholder="What surprised you? What changed your view?">${esc(state.notes[l.id]||'')}</textarea><p class="micro" style="margin:7px 0 22px">Your note saves as you type, on this device.</p><div class="stack">${next?button('Continue to the next story','start',next.id):navButton('See your completed journey','passport')}${navButton('Return to this era','era/'+e.id,'secondary')}<button class="text-btn" data-act="restart" data-id="${l.id}">${icon('refresh',14)} Study this mission again</button></div>${refs(l.refs)}`}

s[id].lastCorrect&&state.questions[id].streak>=2),percent=tested.length?Math.round(strong.length/tested.length*100):0;return `<div class="skill-row"><span>${lens}</span><div class="progress-line"><i style="width:${percent}%"></i></div><small>${tested.length?percent+'%':'New'}</small></div>`}).join('')}<p class="micro">Strength = two or more correct retrievals separated by at least 20 hours. Percentages use questions you have attempted, not all unstudied content. A reading completion alone never grants memory strength.</p></div><div class="section-head"><h2>Your era stamps</h2><span class="eyebrow">EXPLORE ALL 5 TO EARN</span></div><div class="stamps">${E.map(e=>`<button class="stamp ${completeCount(e)===5?'earned':''}" data-nav="era/${e.id}" aria-label="${esc(e.name)}: ${completeCount(e)} of 5 missions"><span class="jp" lang="ja">${esc(e.jp)}</span><span>${esc(e.name)}</span><small>${completeCount(e)===5?'EXPLORED':completeCount(e)+' / 5'}</small></button>`).join('')}</div><div class="section-head"><h2>Your field notebook</h2><button class="text-btn" data-nav="notebook">Open ${icon('arrow',14)}</button></div><div class="goal-card">${icon('bookmark',24)}<div class="goal-text"><b>${state.saved.length} saved ${state.saved.length===1?'mission':'missions'}</b><p>${Object.values(state.notes).filter(Boolean).length} personal notes &middot; Private on this device.</p></div></div><div class="section-head"><h2>Make it yours</h2></div><div class="settings-list"><button class="setting" data-act="setting" data-id="large" role="switch" aria-checked="${state.settings.large}"><div>Larger reading text<p>More room for the words.</p></div><span class="switch ${state.settings.large?'on':''}"></span></button><button class="setting" data-act="setting" data-id="sound" role="switch" aria-checked="${state.settings.sound}"><div>Gentle game sounds<p>Off by default. No background music.</p></div><span class="switch ${state.settings.sound?'on':''}"></span></button><button class="setting" data-act="export"><div>Back up your progress<p>Export a JSON file. Keep it somewhere safe.</p></div>${icon('download',19)}</button><button class="setting" data-act="import"><div>Restore a backup<p>Replaces progress in this browser after confirmation.</p></div>${icon('upload',19)}</button><button class="setting" data-nav="about"><div>About TOKI & iPhone setup<p>Offline use, privacy, and learning design.</p></div>${icon('info',19)}</button><button class="setting" data-nav="sources"><div>Source library<p>${Object.keys(DATA.sources).length} references and further readings.</p></div>${icon('book',19)}</button><button class="setting" data-act="reset"><div style="color:var(--orange)">Reset progress<p>Deletes this browser's saved journey.</p></div>${icon('refresh',19)}</button></div><p class="footer-note">Progress belongs to this browser and this site address.<br>No login, tracking, or cloud synchronization.<br>Back up before clearing browser data or changing devices.</p>`}

function about(){return `${back('Your passport','passport')}<div class="page-intro"><div class="eyebrow accent">MEET TOKI</div><h1>A pocket-sized<br>journey through time.</h1><p>Designed for curiosity, not cramming.</p></div><div class="stack"><article class="card"><h3>What is included</h3><p>18 era chapters, 90 missions, 270 reading cards, 180 retrieval prompts, 90 study terms, six three-decision stories, timeline games, word matching, and 12 contemporary phrase situations.</p><p>This is a broad chronological and thematic foundation, not an exhaustive history or a complete Japanese-language course. Each era deserves further study.</p></article><article class="card"><h3>Add TOKI to your iPhone</h3><p>Publish the app folder at an HTTPS website, then open that address in Safari. Open the Safari sharing controls, then choose Add to Home Screen. Enable Open as Web App when shown, and tap Add. Launch it from that icon for the standalone app experience.</p><p>After a successful online load, the service worker caches the app for offline study on supported browsers. External sources and some speech voices still need connectivity. An HTML file viewed in the iPhone Files preview is not the same as a hosted web app.</p><p id="offline-status" class="small">${location.protocol==='file:'?'Standalone file mode: the lessons are embedded; Home Screen installation needs the hosted folder.':('serviceWorker'in navigator&&navigator.serviceWorker.controller)?'Offline app cache is active for this browser.':'Offline installation is not yet confirmed. Load from HTTPS or localhost and reopen after caching.'}</p></article><article class="card"><h3>Your progress, honestly</h3><p>Lessons, answers, review schedules, bookmarks, notes, daily activity, and decision-story choices save in this browser\'s local storage. No data is sent to a server. There is no account or automatic cross-device sync.</p><p>Clearing website data, changing browser or site address, private browsing, or device loss can remove access to that progress. Export a backup from your Passport. Imported backups replace this browser\'s current progress only after confirmation.</p></article><article class="card"><h3>How memory practice works</h3><p>A correct first retrieval is scheduled for one day later. Successful retrievals at least 20 hours apart advance through 3, 7, 14, and 30-day intervals. A wrong answer resets the interval to 10 minutes and becomes immediately available in focused practice.</p><p>XP recognizes activity, not historical expertise. First mission completions earn 25 XP plus 5 per correct answer; completed missions do not award XP again. Decision stories award 20 XP once. Other game modes award their completion bonus once per local day. Repetition remains available without limits.</p></article><article class="card"><h3>Respect the evidence</h3><p>Earliest dates and routes are uncertain, period boundaries overlap, and neither modern borders nor modern Japanese can be projected unchanged into prehistory. Language audio is a device-generated modern reading. Romanization omits macrons for accessibility; long vowels still matter.</p><p>Imagined scenes and meter values make social tradeoffs visible but are not recovered conversations or empirical models. War and colonial violence are discussed without graphic imagery or conquest mechanics.</p></article><article class="card"><h3>Built to be approachable</h3><p>Tap controls work without dragging or swiping. There are no timers or lost lives. Larger reading text is available in Passport. Reduced-motion preferences are respected. Speech and gentle sounds are optional.</p></article></div><div class="note mt"><b>Content snapshot: October 10, 2026</b>Current-era facts are explicitly dated. This app does not fetch live news or silently update political officeholders or statistics.</div>${navButton('Explore the source library','sources','secondary mt')}`}

function finishLesson(id){const s=state.sessions[id];if(!s||s.step>=6||!s.answers[0]||!s.answers[1])return;const score=s.answers.filter(a=>a.correct).length,old=state.completed[id];s.xp=old?0:reward('mission:'+id,25+5*score);state.completed[id]={best:Math.max(old?.best||0,score),at:Date.now(),attempts:(old?.attempts||0)+1};s.step=6;activity();save();render(true);sound(true);if(!EM[LM[id].era].sensitive)celebrate();}
function exportProgress(){try{const payload={...state,exportedAt:new Date().toISOString(),app:'TOKI Japanese History'},blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='toki-progress-'+localDay()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);toast('Backup file created. Keep it outside this browser.')}catch(e){toast('The backup could not be created in this browser.')}}
$('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>2000000){toast('That file is too large. TOKI backups must be under 2 MB.');return;}try{const raw=JSON.parse(await file.text()),clean=cleanState(raw);modal('Replace this journey?',`The backup contains ${Object.keys(clean.completed).length} completed missions and ${clean.xp} XP. Current local progress will be replaced. Export a backup first to keep both.`,'Restore backup',()=>{state=clean;save();go('passport');toast('Your backup has been restored.');});}catch(err){toast('Not a valid TOKI progress backup. Nothing was changed.')}});
document.addEventListener('input',e=>{if(e.target.id==='search'){searchText=e.target.value;$('#search-results').innerHTML=searchResults();}if(e.target.id==='reflection'&&LM[e.target.dataset.lesson]){state.notes[e.target.dataset.lesson]=e.target.value.slice(0,4000);save();}});
document.addEventListener('change',e=>{if(e.target.id==='compare-a'&&EM[e.target.value]){compareA=e.target.value;render()}if(e.target.id==='compare-b'&&EM[e.target.value]){compareB=e.target.value;render()}});
function focusFeedback(){requestAnimationFrame(()=>{const f=$('.feedback');if(f){f.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});f.focus?.({preventScroll:true});}})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-nav],[data-act]');if(!b||b.disabled)return;if(b.dataset.nav){go(b.dataset.nav);return;}const a=b.dataset.act,id=b.dataset.id,val=Number(b.dataset.val);try{switch(a){
case 'start':startLesson(id);break;
case 'restart':startLesson(id,true);break;
case 'bookmark':if(!LM[id])break;state.saved=state.saved.includes(id)?state.saved.filter(v=>v!==id):[...state.saved,id];save();render();toast(state.saved.includes(id)?'Mission added to your field notebook.':'Bookmark removed. Your note is still saved.');break;
case 'filter':filter=id;render();$('#search')?.focus({preventScroll:true});break;
case 'prev-step':{const s=state.sessions[id];if(s&&s.step>0&&s.step<=3){s.step--;save();render(true)}break;}
case 'next-step':{const s=state.sessions[id];if(!s||s.step===6)break;if(s.step===5){finishLesson(id);break;}if(s.step===4&&!s.answers[0])break;s.step++;save();render(true);break;}
case 'lesson-answer':{const s=state.sessions[id];if(!s||s.step<4||s.step>5||![0,1,2].includes(val))break;const qi=s.step-4;if(s.answers[qi])break;s.answers[qi]={selected:val,correct:val===0};recordQ(id+':'+(qi===0?'concept':'term'),val===0);save();sound(val===0);render();focusFeedback();break;}
case 'speak-term':if(LM[id])speak(LM[id].term.jp);break;
case 'speak-phrase':if(ACTIVITIES.phrases[Number(id)])speak(ACTIVITIES.phrases[Number(id)][0]);break;
case 'review':startQuiz('review');break;
case 'mixed':startQuiz('mixed');break;
case 'quiz-answer':if(quiz&&quiz.i<quiz.ids.length&&!quiz.answers[quiz.i]&&[0,1,2].includes(val)){quiz.answers[quiz.i]={selected:val,correct:val===0};recordQ(quiz.ids[quiz.i],val===0);sound(val===0);render();focusFeedback();}break;
case 'quiz-next':if(quiz&&quiz.answers[quiz.i]){quiz.i++;if(quiz.i===quiz.ids.length){quiz.earned=reward('quiz:'+quiz.mode+':'+localDay(),15);activity();}render(true);}break;
case 'new-timeline':newTimeline();break;
case 'timeline-select':if(tgame&&!tgame.checked&&tgame.ids.includes(Number(id))&&!tgame.selected.includes(Number(id))&&tgame.selected.length<4){tgame.selected.push(Number(id));sound();render();}break;
case 'timeline-undo':if(tgame&&!tgame.checked){tgame.selected.pop();render()}break;
case 'timeline-hint':if(tgame){tgame.hints=true;render()}break;
case 'timeline-check':if(tgame&&!tgame.checked&&tgame.selected.length===4){tgame.checked=true;tgame.earned=reward('timeline:'+localDay(),15);activity();render(true);sound();}break;
case 'new-match':newMatch();break;
case 'match-select':{if(!match||match.done||match.busy||match.matched.includes(id)||!match.ids.includes(id))break;const m=match,side=b.dataset.side;if(side==='left')m.selL=m.selL===id?null:id;else m.selR=m.selR===id?null:id;if(m.selL&&m.selR){if(m.selL===m.selR){m.matched.push(m.selL);m.selL=m.selR=null;sound();if(m.matched.length===4){m.done=true;m.earned=reward('match:'+localDay(),12);activity();render(true);celebrate();break;}toast('A connection made.');}else{m.misses++;m.busy=true;sound(false);toast('Not this pair. Look at the meaning and try again.');setTimeout(()=>{m.busy=false;m.selL=m.selR=null;if(routeParts()[0]==='match')render()},850)}}render();break;}
case 'scenario-choose':{const sc=ACTIVITIES.scenarios.find(x=>x.id===id),s=state.scenarios[id];if(!sc||!s||s.ack===false||s.finished||s.choices.length>=3||![0,1,2].includes(val))break;s.choices.push(val);s.ack=false;save();render();focusFeedback();break;}
case 'scenario-next':{const s=state.scenarios[id];if(!s||s.ack!==false||s.finished)break;s.ack=true;if(s.choices.length===3){s.finished=true;const xp=reward('scenario:'+id,20);activity();toast(`Story explored. +${xp} XP.`)}save();render(true);break;}
case 'scenario-restart':state.scenarios[id]={choices:[],ack:true,finished:false};save();render(true);break;
case 'new-phrase':newPhrase();break;
case 'phrase-answer':if(phrase&&phrase.i<12&&!phrase.answers[phrase.i]&&[0,1,2].includes(val)){phrase.answers[phrase.i]={selected:val,correct:val===0};sound(val===0);render();focusFeedback();}break;
case 'phrase-next':if(phrase&&phrase.answers[phrase.i]){phrase.i++;phrase.order=shuffle([0,1,2]);if(phrase.i===12){phrase.earned=reward('phrase:'+localDay(),15);activity();}render(true);}break;
case 'setting':if(['sound','large'].includes(id)){state.settings[id]=!state.settings[id];save();render();if(id==='sound'&&state.settings.sound)sound();}break;
case 'export':exportProgress();break;
case 'import':$('#import-file').click();break;
case 'reset':modal('Start a new journey?','This deletes local missions, notes, bookmarks, and review history. Export a progress backup first to keep your current journey.','Delete local progress',()=>{state=fresh();save();go('journey');toast('A new journey is ready.');});break;
}}catch(err){console.error(err);toast('That action could not finish. Your saved progress has not been erased.')}});
window.addEventListener('hashchange',()=>render(true));
window.addEventListener('pagehide',save);
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{state=cleanState(JSON.parse(e.newValue));render();toast('Progress updated from another tab.')}catch(err){}}});
if('speechSynthesis'in window)speechSynthesis.getVoices();
if('serviceWorker'in navigator&&['https:','http:'].includes(location.protocol))navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{if(routeParts()[0]==='about')render()}).catch(()=>{});
render();
</script></body></html>
