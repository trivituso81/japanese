<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Kanji Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
:root {
  --bg:#12100e; --panel:#1f1b16; --panel2:#2a241d; --line:#3d342a; --ink:#f3ebe1;
  --muted:#9d9080; --faint:#6d6256; --gold:#d4a24a; --gold-dim:#8a6a2e; --glow:#e8c36a;
  --ok:#7cb87a; --bad:#c47a6a; --slot:#16130f; --radius:14px;
  --font:"DM Sans", system-ui, sans-serif;
  --jp:"Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-t:env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; }
html, body { margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--font); }
body {
  background: radial-gradient(120% 70% at 50% -15%, #2b2218 0%, transparent 55%), var(--bg);
  -webkit-tap-highlight-color: transparent;
}
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0; }
#app {
  max-width:480px; margin:0 auto;
  padding: calc(12px + var(--safe-t)) 14px calc(16px + var(--safe-b));
  min-height:100dvh;
}
.screen-level {
  min-height: calc(100dvh - 28px - var(--safe-t) - var(--safe-b));
  display:flex; flex-direction:column; justify-content:center; gap:28px;
}
.brand { text-align:center; }
.brand h1 { margin:0; font-size:clamp(2.5rem, 12vw, 3.3rem); letter-spacing:-0.03em; line-height:1; }
.brand h1 span { color:var(--gold); }
.brand p { margin:12px 0 0; color:var(--muted); }
.choices { display:grid; gap:12px; }
.choice {
  text-align:left; padding:18px; border-radius:var(--radius);
  background:linear-gradient(160deg, var(--panel2), var(--panel));
  border:1px solid var(--line);
}
.choice:active { transform:scale(0.98); }
.choice strong { display:block; font-size:1.4rem; margin-bottom:4px; }
.choice span { color:var(--muted); font-size:0.9rem; }
.backlink { text-align:center; color:var(--faint); font-size:0.85rem; text-decoration:none; }

.shell { display:flex; flex-direction:column; gap:12px; min-height: calc(100dvh - 28px - var(--safe-t) - var(--safe-b)); }
.topbar { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
.group { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.pill {
  font-size:0.78rem; font-weight:600; color:var(--muted);
  padding:8px 11px; border-radius:999px; background:var(--panel); border:1px solid var(--line);
}
.pill b { color:var(--ink); }
.pill.warn { border-color:var(--gold-dim); color:var(--gold); }
.ibtn, .btn {
  height:40px; min-width:40px; padding:0 14px; border-radius:12px;
  background:var(--panel); border:1px solid var(--line); font-weight:600; font-size:0.85rem;
}
.btn.primary { background:linear-gradient(160deg, #3a3024, #2a241d); border-color:var(--gold-dim); color:var(--gold); }
.btn:disabled, .ibtn:disabled { opacity:0.4; pointer-events:none; }
.ibtn:active, .btn:active { background:var(--panel2); }

.anvil {
  background:linear-gradient(180deg, #2c261f, #1b1713);
  border:1px solid var(--line); border-radius:18px; padding:14px;
}
.lbl { font-size:0.7rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--faint); font-weight:700; margin-bottom:8px; }
.slots { display:flex; justify-content:center; align-items:center; gap:8px; min-height:86px; }
.slots.shake { animation: shake 0.42s ease; }
@keyframes shake {
  0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)}
  60%{transform:translateX(-4px)} 80%{transform:translateX(4px)}
}
.slot {
  width:76px; height:76px; border-radius:16px; background:var(--slot);
  border:1.5px dashed var(--gold-dim);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
}
.slot.filled { border-style:solid; border-color:var(--gold); background:#231e17; }
.slot.pop { animation: pop 0.22s ease; }
@keyframes pop { from { transform:scale(0.7); opacity:0; } to { transform:none; opacity:1; } }
.slot .g { font-family:var(--jp); font-weight:700; font-size:1.85rem; line-height:1; }
.slot .n { font-size:0.62rem; color:var(--muted); max-width:68px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.plus { color:var(--faint); font-weight:700; font-size:1.1rem; }
.locked-banner {
  margin-top:10px; padding:10px 12px; border-radius:12px;
  background:rgba(212,162,74,0.1); border:1px solid var(--gold-dim);
  display:flex; flex-direction:column; gap:8px; align-items:stretch;
}
.locked-banner p { margin:0; font-size:0.88rem; color:var(--muted); }

.reveal:empty { display:none; }
.card {
  background:linear-gradient(165deg, #2f2820, #1e1a15);
  border:1px solid var(--gold-dim); border-radius:18px; padding:16px;
  animation: cardIn 0.28s ease; box-shadow: 0 16px 40px rgba(0,0,0,0.35);
}
.card.new { box-shadow: 0 0 0 1px rgba(232,195,106,0.35), 0 0 36px rgba(212,162,74,0.2), 0 16px 40px rgba(0,0,0,0.35); }
@keyframes cardIn { from { opacity:0; transform:translateY(8px) scale(0.98); } to { opacity:1; transform:none; } }
.badge { display:inline-block; font-size:0.68rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--gold); margin-bottom:6px; }
.card-char { font-family:var(--jp); font-weight:900; font-size:clamp(4rem, 22vw, 5.4rem); line-height:1; text-align:center; }
.card-mean { text-align:center; font-size:1.15rem; font-weight:600; margin:4px 0 12px; }
.parts { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:6px; margin-bottom:12px; }
.mini {
  min-width:48px; padding:6px 8px; border-radius:10px; background:var(--slot);
  border:1px solid var(--line); display:flex; flex-direction:column; align-items:center;
}
.mini .g { font-family:var(--jp); font-weight:700; font-size:1.15rem; }
.mini .n { font-size:0.6rem; color:var(--muted); }
.mnemo { background:rgba(0,0,0,0.22); border-radius:12px; padding:10px 12px; margin-bottom:12px; }
.mnemo .t { font-size:0.68rem; font-weight:600; color:var(--gold); margin-bottom:4px; }
.mnemo p { margin:0; font-size:0.92rem; line-height:1.4; color:#e6ddd0; }
.wordbtn {
  width:100%; display:flex; align-items:center; gap:10px; text-align:left;
  padding:10px 12px; border-radius:12px; background:var(--slot); border:1px solid var(--line);
}
.wordbtn .w { font-family:var(--jp); font-weight:700; font-size:1.25rem; }
.wordbtn .meta { flex:1; min-width:0; }
.wordbtn .rd { color:var(--gold); font-size:0.82rem; }
.wordbtn .wm { color:var(--muted); font-size:0.78rem; }
.wordbtn .spk { color:var(--faint); }
.card-foot { display:flex; justify-content:space-between; align-items:center; margin-top:12px; gap:8px; }
.card-foot .hint { color:var(--faint); font-size:0.75rem; }
.link { color:var(--gold); font-size:0.85rem; font-weight:600; text-decoration:underline; text-underline-offset:3px; }

.inv {
  flex:1; min-height:180px; display:flex; flex-direction:column;
  border:1px solid var(--line); border-radius:18px; overflow:hidden; background:#18150f;
}
.inv.dim .tile { opacity:0.35; pointer-events:none; }
.grid {
  flex:1; overflow:auto; display:grid; gap:8px;
  grid-template-columns:repeat(auto-fill, minmax(64px, 1fr));
  padding:8px 10px 12px; align-content:start; -webkit-overflow-scrolling:touch;
}
.tile {
  min-height:64px; min-width:56px; padding:8px 4px 6px; border-radius:12px;
  background:var(--panel); border:1px solid var(--line);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
}
.tile:active { transform:scale(0.96); }
.tile.on { border-color:var(--gold); }
.tile.nudge {
  border-color:var(--glow);
  box-shadow:0 0 0 2px rgba(232,195,106,0.35), 0 0 16px rgba(212,162,74,0.25);
  animation:pulse 1.6s ease infinite;
}
@keyframes pulse {
  0%,100% { box-shadow:0 0 0 2px rgba(232,195,106,0.3), 0 0 10px rgba(212,162,74,0.15); }
  50% { box-shadow:0 0 0 3px rgba(232,195,106,0.5), 0 0 20px rgba(212,162,74,0.35); }
}
.tile.glow { animation:glow 1.4s ease; }
@keyframes glow {
  0% { box-shadow:none; } 30% { box-shadow:0 0 20px rgba(232,195,106,0.55); border-color:var(--glow); } 100% { box-shadow:none; }
}
.tile .g { font-family:var(--jp); font-weight:700; font-size:1.55rem; line-height:1; }
.tile .n {
  font-size:0.62rem; color:var(--muted); text-align:center; line-height:1.15;
  max-width:100%; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
}

.tools { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.tools .grow { flex:1; }
.toggle {
  display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px;
  background:var(--panel); border:1px solid var(--line); font-size:0.8rem; font-weight:600; color:var(--muted);
}
.toggle.on { color:var(--ink); border-color:var(--gold-dim); }
.toggle .dot { width:8px; height:8px; border-radius:50%; background:var(--faint); }
.toggle.on .dot { background:var(--ok); }
.hint-panel {
  margin-top:10px; padding:10px 12px; border-radius:12px;
  background:rgba(212,162,74,0.08); border:1px solid var(--gold-dim);
}
.hint-panel .lbl { margin-bottom:6px; }
.hint-list { display:flex; flex-wrap:wrap; gap:6px; }
.hint-chip {
  font-size:0.72rem; color:var(--muted); padding:5px 8px; border-radius:999px;
  background:var(--slot); border:1px solid var(--line); line-height:1.2;
}
.hint-chip b { color:var(--gold); font-weight:700; }
.hint-empty { margin:0; font-size:0.8rem; color:var(--faint); }
.book-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(72px, 1fr)); gap:8px; }
.btile {
  aspect-ratio:1; border-radius:12px; background:var(--panel); border:1px solid var(--line);
  display:flex; flex-direction:column; align-items:center; justify-content:center; padding:6px; gap:2px;
}
.btile.lock { background:transparent; border:1.5px dashed var(--line); }
.btile .g { font-family:var(--jp); font-weight:700; font-size:1.55rem; line-height:1; }
.btile.lock .g { opacity:0.3; font-size:1.1rem; }
.btile .h { font-size:0.58rem; color:var(--faint); text-align:center; line-height:1.2; max-height:2.4em; overflow:hidden; }
.detail { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; display:grid; gap:12px; }
.detail h2 { margin:0; font-family:var(--jp); font-size:2.4rem; font-weight:900; }
.words { display:grid; gap:8px; }
.muted { color:var(--muted); font-size:0.85rem; }
.toast {
  position:fixed; left:50%; bottom:calc(18px + var(--safe-b)); transform:translateX(-50%);
  background:var(--panel2); border:1px solid var(--line); padding:10px 14px; border-radius:999px;
  font-size:0.82rem; z-index:40; pointer-events:none; box-shadow:0 8px 24px rgba(0,0,0,0.4);
}
.center { min-height:50vh; display:grid; place-items:center; color:var(--muted); text-align:center; padding:24px; }

/* Practice / review */
.practice {
  background:linear-gradient(165deg, #2a241d, #1a1713);
  border:1px solid var(--line); border-radius:18px; padding:16px;
  display:grid; gap:14px; animation: cardIn 0.25s ease;
}
.practice-top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
.progress-pill { font-size:0.78rem; font-weight:700; color:var(--gold); }
.practice-prompt { text-align:center; }
.practice-prompt .big {
  font-family:var(--jp); font-weight:900; font-size:clamp(3.2rem, 18vw, 4.6rem); line-height:1; margin:8px 0;
}
.practice-prompt .sub { color:var(--muted); font-size:0.95rem; }
.choice-list { display:grid; gap:8px; }
.choice-btn {
  width:100%; text-align:left; padding:14px 14px; border-radius:12px;
  background:var(--panel); border:1px solid var(--line); font-weight:600; font-size:1rem;
}
.choice-btn .jp { font-family:var(--jp); font-size:1.4rem; font-weight:700; }
.choice-btn.correct { border-color:var(--ok); background:rgba(124,184,122,0.12); }
.choice-btn.wrong { border-color:var(--bad); background:rgba(196,122,106,0.12); }
.choice-btn:disabled { cursor:default; }
.listen-row { display:grid; gap:8px; }
.sentence-box {
  font-family:var(--jp); font-size:1.25rem; line-height:2.1; text-align:center;
  padding:12px; border-radius:12px; background:var(--slot); border:1px solid var(--line);
}
.sentence-box ruby { ruby-align: center; }
.sentence-box rt { font-size:0.5em; color:var(--muted); }
.sentence-box .target {
  color:var(--gold); font-weight:900; border-bottom:2px solid var(--gold-dim); padding:0 2px;
}
.en-reveal {
  text-align:center; color:var(--muted); font-size:0.95rem; padding:8px;
  border-radius:10px; border:1px dashed var(--line);
}
.en-reveal.open { color:var(--ink); border-style:solid; background:var(--panel); }
.summary-list { display:grid; gap:8px; }
.summary-row {
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px;
  background:var(--panel); border:1px solid var(--line);
}
.summary-row .ch { font-family:var(--jp); font-size:1.6rem; font-weight:700; width:2rem; }
.summary-row .mark { margin-left:auto; font-weight:700; }
.summary-row .mark.ok { color:var(--ok); }
.summary-row .mark.bad { color:var(--bad); }

.pill.session b { color: var(--gold); }
.grid.locked .tile { opacity: 0.38; filter: grayscale(0.35); pointer-events: none; }
.slots.locked .slot { opacity: 0.45; pointer-events: none; }
.btn-primary {
  width: 100%; padding: 12px 14px; border-radius: 12px; font-weight: 700;
  background: linear-gradient(180deg, var(--gold), #b8842f); color: #1a140c;
  border: none; font-size: 0.95rem;
}
.btn-primary:disabled { opacity: 0.5; }
.btn-ghost {
  width: 100%; padding: 12px 14px; border-radius: 12px; font-weight: 600;
  background: var(--panel); color: var(--ink); border: 1px solid var(--line);
}
.practice-feedback { font-size: 0.9rem; color: var(--muted); text-align: center; }
.choice-btn.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.choice-btn .spk-mini {
  flex: 0 0 auto; width: 36px; height: 36px; border-radius: 10px;
  background: var(--slot); border: 1px solid var(--line); display: grid; place-items: center;
  color: var(--gold); font-size: 0.85rem;
}
.sentence-hint { text-align: center; font-size: 0.8rem; color: var(--faint); }

</style>
</head>
<body>
<div id="app"></div>

<script>
/* ===================== DATA ===================== */
const STORAGE_KEY = "kanjiforge";
const SESSION_CAP = 5;
const MNEMONIC_LABELS = {
  etymological: "based on origin",
  phonetic: "one part is for sound",
  invented: "memory aid only",
};

var state = {
  ready: false,
  error: null,
  screen: "level",
  level: null,
  components: [],
  recipes: [],
  kanji: [],
  words: [],
  discovered: [],
  discoveryOrder: [],
  anvil: [null, null],
  showThird: false,
  shaking: false,
  failStreak: 0,
  nudgeKey: null,
  glowKey: null,
  hintsOn: true,
  card: null,
  celebrate: false,
  bookFocus: null,
  toast: null,
  // Phase 1.5 session
  sessionNew: [],
  sessionLocked: false,
  sessionDone: false,
  pendingPractice: null, // char waiting for practice after book detour
  // practice / review overlay
  flow: null, // null | practice | sentence | review | summary
  practice: null,
  review: null,
  summary: null,
  sentence: null,
};

function loadStore() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}") || {}; }
  catch (e) { return {}; }
}
function persistLevel() {
  if (!state.level) return;
  const store = loadStore();
  store[state.level] = {
    discovered: state.discovered.slice(),
    discoveryOrder: state.discoveryOrder.slice(),
    hintsOn: state.hintsOn,
    sessionNew: state.sessionNew.slice(),
    sessionLocked: !!state.sessionLocked,
    sessionDone: !!state.sessionDone,
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
}
async function loadData() {
  try {
    async function fetchJson(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(url + " " + r.status);
      return r.json();
    }
    const [components, recipes, kanji, words] = await Promise.all([
      fetchJson("components.json"),
      fetchJson("recipes.json"),
      fetchJson("kanji.json"),
      fetchJson("words.json"),
    ]);
    state.components = components;
    state.recipes = recipes;
    state.kanji = kanji;
    state.words = words;
    state.ready = true;
  } catch (e) {
    state.error = String(e && e.message ? e.message : e);
  }
}
function scopeLevels(level) { return level === "N4" ? ["N5", "N4"] : ["N5"]; }
function recipesForLevel(level) {
  const s = new Set(scopeLevels(level));
  return state.recipes.filter(function (r) { return s.has(r.level); });
}
function startersForLevel(level) {
  return recipesForLevel(level).filter(function (r) {
    return r.starter || !r.parts || r.parts.length === 0;
  });
}
function kanjiMeta(ch) {
  return state.kanji.find(function (k) { return k.char === ch; }) || { char: ch, meaning: "?", level: "?" };
}
function shortMeaning(ch) {
  return (kanjiMeta(ch).meaning || "?").split(/[,;/]/)[0].trim();
}
function recipeFor(ch) {
  return state.recipes.find(function (r) { return r.char === ch; });
}
function wordFor(word) {
  return state.words.find(function (w) { return w.word === word; }) || null;
}
function wordsUsing(ch) {
  return state.words.filter(function (w) { return (w.kanji || []).indexOf(ch) >= 0; });
}
function componentByToken(tok) {
  return state.components.find(function (c) {
    return c.id === tok || c.glyph === tok || c.display === tok;
  }) || null;
}
function partLabel(tok) {
  var c = componentByToken(tok);
  if (c) return c.name;
  var m = kanjiMeta(tok);
  if (m.meaning && m.meaning !== "?") return m.meaning.split(/[,;/]/)[0].trim();
  return tok;
}
function partGlyph(tok) {
  var c = componentByToken(tok);
  return c ? (c.display || c.glyph) : tok;
}
function tileFromComponent(c) {
  return {
    key: "c:" + c.id,
    kind: "component",
    glyph: c.display || c.glyph,
    name: c.name,
    match: [c.id, c.glyph, c.display].filter(Boolean),
  };
}
function tileFromKanji(ch) {
  var m = kanjiMeta(ch);
  return {
    key: "k:" + ch,
    kind: "kanji",
    glyph: ch,
    name: (m.meaning || ch).split(/[,;/]/)[0].trim(),
    match: [ch],
  };
}
function inventoryTiles() {
  var comps = state.components.map(tileFromComponent);
  var order = state.discoveryOrder.length ? state.discoveryOrder : state.discovered;
  var seen = {};
  var out = [];
  order.forEach(function (ch) {
    if (state.discovered.indexOf(ch) < 0 || seen[ch]) return;
    seen[ch] = true;
    out.push(tileFromKanji(ch));
  });
  state.discovered.forEach(function (ch) {
    if (seen[ch]) return;
    out.push(tileFromKanji(ch));
  });
  return comps.concat(out);
}
/** Undiscovered recipes whose parts are all currently in inventory. */
function craftableHintRecipes(limit) {
  var tiles = inventoryTiles();
  var out = [];
  var pool = recipesForLevel(state.level);
  for (var i = 0; i < pool.length; i++) {
    var r = pool[i];
    if (!r.parts || r.parts.length < 2) continue;
    if (state.discovered.indexOf(r.char) >= 0) continue;
    var used = {};
    var ok = true;
    for (var pi = 0; pi < r.parts.length; pi++) {
      var hit = -1;
      for (var ti = 0; ti < tiles.length; ti++) {
        if (used[ti]) continue;
        if (tileMatchesPart(tiles[ti], r.parts[pi])) { hit = ti; break; }
      }
      if (hit < 0) { ok = false; break; }
      used[hit] = true;
    }
    if (!ok) continue;
    out.push(r);
    if (limit && out.length >= limit) break;
  }
  return out;
}
function renderHintPanel() {
  if (!state.hintsOn) return "";
  var crafts = craftableHintRecipes(8);
  var chips = crafts.map(function (r) {
    var label = (r.parts || []).map(partLabel).join(" + ");
    return '<span class="hint-chip">' + esc(label) + ' <b>→ ?</b></span>';
  }).join("");
  return (
    '<div class="hint-panel">' +
      '<div class="lbl">Hints</div>' +
      (chips
        ? '<div class="hint-list">' + chips + '</div>'
        : '<p class="hint-empty">No ready combines. Open Book for locked-kanji recipes.</p>') +
    '</div>'
  );
}
function tileMatchesPart(tile, part) { return tile.match.indexOf(part) >= 0; }
function findExactRecipe(tiles) {
  if (tiles.length < 2 || tiles.length > 3) return null;
  var pool = recipesForLevel(state.level).filter(function (r) {
    return r.parts && r.parts.length === tiles.length;
  });
  for (var ri = 0; ri < pool.length; ri++) {
    var r = pool[ri];
    var used = [];
    for (var i = 0; i < tiles.length; i++) used[i] = false;
    function dfs(pi) {
      if (pi === r.parts.length) return true;
      for (var ti = 0; ti < tiles.length; ti++) {
        if (used[ti]) continue;
        if (!tileMatchesPart(tiles[ti], r.parts[pi])) continue;
        used[ti] = true;
        if (dfs(pi + 1)) return true;
        used[ti] = false;
      }
      return false;
    }
    if (dfs(0)) return r;
  }
  return null;
}
function anyThreePartNeedsThird(tiles2) {
  if (tiles2.length !== 2) return false;
  var pool = recipesForLevel(state.level).filter(function (r) {
    return r.parts && r.parts.length === 3;
  });
  for (var ri = 0; ri < pool.length; ri++) {
    var parts = pool[ri].parts;
    for (var i = 0; i < 3; i++) {
      for (var j = 0; j < 3; j++) {
        if (i === j) continue;
        if (tileMatchesPart(tiles2[0], parts[i]) && tileMatchesPart(tiles2[1], parts[j])) return true;
        if (tileMatchesPart(tiles2[1], parts[i]) && tileMatchesPart(tiles2[0], parts[j])) return true;
      }
    }
  }
  return false;
}
function speakJa(text) {
  if (!text || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP";
  var voices = window.speechSynthesis.getVoices();
  for (var i = 0; i < voices.length; i++) {
    if (voices[i].lang && voices[i].lang.indexOf("ja") === 0) { u.voice = voices[i]; break; }
  }
  window.speechSynthesis.speak(u);
}
function showToast(msg) {
  state.toast = msg;
  render();
  setTimeout(function () {
    if (state.toast === msg) { state.toast = null; render(); }
  }, 2200);
}
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function isKana(ch) {
  var c = ch.charCodeAt(0);
  return (c >= 0x3040 && c <= 0x309F) || (c >= 0x30A0 && c <= 0x30FF) || ch === "ー" || ch === "ゝ" || ch === "ゞ";
}
function isKanji(ch) {
  var c = ch.charCodeAt(0);
  return (c >= 0x4E00 && c <= 0x9FFF) || (c >= 0x3400 && c <= 0x4DBF);
}
</script>

<script>
/* ===================== PRACTICE HELPERS ===================== */
function meaningChoices(ch) {
  var correct = shortMeaning(ch);
  var recipe = recipeFor(ch) || { parts: [] };
  var parts = recipe.parts || [];
  var pool = recipesForLevel(state.level).filter(function (r) {
    if (r.char === ch) return false;
    if (!r.parts || !r.parts.length) return false;
    return r.parts.some(function (p) { return parts.indexOf(p) >= 0; });
  });
  if (pool.length < 2) {
    pool = recipesForLevel(state.level).filter(function (r) { return r.char !== ch; });
  }
  var distractors = [];
  var used = {};
  used[correct.toLowerCase()] = true;
  shuffle(pool).forEach(function (r) {
    if (distractors.length >= 2) return;
    var m = shortMeaning(r.char);
    if (!m || used[m.toLowerCase()]) return;
    used[m.toLowerCase()] = true;
    distractors.push(m);
  });
  while (distractors.length < 2) {
    distractors.push("unknown " + (distractors.length + 1));
  }
  return shuffle([
    { text: correct, correct: true },
    { text: distractors[0], correct: false },
    { text: distractors[1], correct: false },
  ]);
}
function lookalikeChoices(ch) {
  var meta = kanjiMeta(ch);
  var looks = (meta.lookalikes || []).filter(function (x) { return x && x !== ch; });
  if (looks.length < 2) {
    var extras = recipesForLevel(state.level).map(function (r) { return r.char; })
      .filter(function (c) { return c !== ch && looks.indexOf(c) < 0; });
    looks = looks.concat(shuffle(extras)).slice(0, 2);
  } else {
    looks = shuffle(looks).slice(0, 2);
  }
  return shuffle([
    { text: ch, correct: true },
    { text: looks[0], correct: false },
    { text: looks[1] || "？", correct: false },
  ]);
}
function listenChoices(ch) {
  var recipe = recipeFor(ch) || {};
  var starter = wordFor(recipe.starter_word) || {
    word: recipe.starter_word || ch,
    reading: "",
    meaning: "",
    kanji: [ch],
  };
  var batch = state.sessionNew.slice();
  var levelChars = recipesForLevel(state.level).map(function (r) { return r.char; });
  var prefer = batch.concat(levelChars);
  var candidates = [];
  var seen = {};
  seen[starter.word] = true;
  prefer.forEach(function (other) {
    if (other === ch) return;
    wordsUsing(other).forEach(function (w) {
      if (seen[w.word]) return;
      if ((w.kanji || []).indexOf(ch) >= 0) return;
      seen[w.word] = true;
      candidates.push(w);
    });
  });
  if (candidates.length < 2) {
    state.words.forEach(function (w) {
      if (seen[w.word]) return;
      if ((w.kanji || []).indexOf(ch) >= 0) return;
      seen[w.word] = true;
      candidates.push(w);
    });
  }
  var picks = shuffle(candidates).slice(0, 2);
  while (picks.length < 2) {
    picks.push({ word: "？", reading: "", meaning: "" });
  }
  return shuffle([
    { word: starter.word, reading: starter.reading || "", correct: true },
    { word: picks[0].word, reading: picks[0].reading || "", correct: false },
    { word: picks[1].word, reading: picks[1].reading || "", correct: false },
  ]);
}
function buildPractice(ch, kinds) {
  return {
    char: ch,
    kinds: kinds.slice(),
    index: 0,
    answered: false,
    picked: -1,
    correct: false,
    choices: null,
    showMnemonic: false,
  };
}
function ensurePracticeChoices() {
  var p = state.practice;
  if (!p || p.choices) return;
  var kind = p.kinds[p.index];
  if (kind === "meaning") p.choices = meaningChoices(p.char);
  else if (kind === "lookalike") p.choices = lookalikeChoices(p.char);
  else p.choices = listenChoices(p.char);
}
function startPracticeLadder(ch) {
  state.flow = "practice";
  state.practice = buildPractice(ch, ["meaning", "lookalike", "listen"]);
  ensurePracticeChoices();
  state.card = null;
  state.celebrate = false;
  render();
}
function startSentence(ch) {
  var recipe = recipeFor(ch) || {};
  var w = wordFor(recipe.starter_word) || {};
  state.flow = "sentence";
  state.practice = null;
  state.sentence = {
    char: ch,
    word: w.word || recipe.starter_word || ch,
    wordReading: w.reading || "",
    sentence: w.sentence || (w.word || ch),
    reading: w.sentence_reading || w.reading || "",
    en: w.sentence_en || w.meaning || "",
    showEn: false,
  };
  render();
}
function finishLadderToWorkbench() {
  state.flow = null;
  state.practice = null;
  state.sentence = null;
  if (state.sessionNew.length >= SESSION_CAP) {
    state.sessionLocked = true;
    persistLevel();
  }
  render();
}
function buildReviewQueue(chars) {
  var q = [];
  chars.forEach(function (ch) {
    q.push({ char: ch, kind: "meaning" });
    q.push({ char: ch, kind: "lookalike" });
  });
  return shuffle(q);
}
function startSessionReview(onlyMissed) {
  var chars = onlyMissed && state.summary
    ? state.summary.filter(function (r) { return !r.ok; }).map(function (r) { return r.char; })
    : state.sessionNew.slice();
  if (!chars.length) {
    state.flow = "summary";
    render();
    return;
  }
  state.flow = "review";
  state.summary = null;
  state.review = {
    queue: buildReviewQueue(chars),
    index: 0,
    // per kanji: true if both tasks correct so far / overall
    score: {},
    answered: false,
    picked: -1,
    correct: false,
    choices: null,
    showMnemonic: false,
  };
  chars.forEach(function (ch) { state.review.score[ch] = true; });
  fillReviewChoices();
  render();
}
function fillReviewChoices() {
  var r = state.review;
  if (!r || r.index >= r.queue.length) return;
  var item = r.queue[r.index];
  r.answered = false;
  r.picked = -1;
  r.correct = false;
  r.showMnemonic = false;
  r.choices = item.kind === "meaning" ? meaningChoices(item.char) : lookalikeChoices(item.char);
}
function finishReviewToSummary() {
  var score = state.review.score;
  var chars = state.sessionNew.slice();
  state.summary = chars.map(function (ch) {
    return { char: ch, ok: score[ch] !== false, meaning: shortMeaning(ch) };
  });
  state.review = null;
  state.flow = "summary";
  state.sessionDone = true;
  state.sessionLocked = true;
  persistLevel();
  render();
}
function newSession() {
  state.sessionNew = [];
  state.sessionLocked = false;
  state.sessionDone = false;
  state.flow = null;
  state.practice = null;
  state.review = null;
  state.summary = null;
  state.sentence = null;
  state.card = null;
  clearAnvil();
  persistLevel();
  render();
}
/** Align sentence text with kana reading for furigana (skip furigana on bareChar). */
function furiganaHtml(sentence, reading, bareChar) {
  var s = sentence || "";
  var r = reading || "";
  var html = "";
  var si = 0, ri = 0;
  while (si < s.length) {
    var ch = s[si];
    if (!isKanji(ch)) {
      html += esc(ch);
      if (ri < r.length && r[ri] === ch) ri++;
      else if (isKana(ch) && ri < r.length) {
        // try advance reading to matching kana
        var found = r.indexOf(ch, ri);
        if (found >= 0) ri = found + 1;
      }
      si++;
      continue;
    }
    // gather consecutive kanji run
    var runStart = si;
    while (si < s.length && isKanji(s[si])) si++;
    var run = s.slice(runStart, si);
    // find reading until next kana in sentence matches
    var nextKana = "";
    for (var k = si; k < s.length; k++) {
      if (isKana(s[k])) { nextKana = s[k]; break; }
      if (!isKanji(s[k]) && !isKana(s[k])) break;
    }
    var readStart = ri;
    var readEnd = r.length;
    if (nextKana) {
      var nx = r.indexOf(nextKana, ri);
      if (nx >= 0) readEnd = nx;
    } else {
      // rest of reading that is kana
      readEnd = r.length;
    }
    var runReading = r.slice(readStart, readEnd);
    ri = readEnd;
    // emit each kanji in run — if single reading for multi-kanji, attach to whole run
    if (run.length === 1) {
      if (run === bareChar) {
        html += '<span class="target" data-act="sentence-word" data-stop>' + esc(run) + '</span>';
      } else if (runReading) {
        html += "<ruby>" + esc(run) + "<rt>" + esc(runReading) + "</rt></ruby>";
      } else {
        html += esc(run);
      }
    } else {
      // multi-kanji compound: furigana over whole run unless it contains bareChar
      var parts = [];
      for (var i = 0; i < run.length; i++) {
        if (run[i] === bareChar) {
          parts.push({ bare: true, ch: run[i] });
        } else {
          parts.push({ bare: false, ch: run[i] });
        }
      }
      var hasBare = parts.some(function (p) { return p.bare; });
      if (!hasBare && runReading) {
        html += "<ruby>" + esc(run) + "<rt>" + esc(runReading) + "</rt></ruby>";
      } else {
        // show bare without ruby; others without split readings
        parts.forEach(function (p) {
          if (p.bare) {
            html += '<span class="target" data-act="sentence-word" data-stop>' + esc(p.ch) + '</span>';
          } else {
            html += esc(p.ch);
          }
        });
        // if compound has bare + others, put remaining reading as hint on non-bare only when whole reading known — skip
      }
    }
  }
  return html;
}
</script>

  var total = recipesForLevel(state.level).length;
  var found = state.discovered.length;
  var overlay = renderFlowOverlay();
  if (overlay) {
    return (
      '<div class="shell">' +
        '<div class="topbar"><div class="group">' +
          '<button class="ibtn" data-act="change-level" title="Change level">' + esc(state.level) + '</button>' +
          '<div class="pill session">New kanji today: <b>' + state.sessionNew.length + '</b> / ' + SESSION_CAP + '</div>' +
        '</div></div>' +
        overlay +
      '</div>'
    );
  }
  var slots = state.showThird ? 3 : 2;
  var locked = state.sessionLocked || state.sessionDone;
  var slotHtml = [];
  for (var i = 0; i < slots; i++) {
    var t = state.anvil[i];
    if (i) slotHtml.push('<span class="plus">+</span>');
    slotHtml.push(
      '<button class="slot' + (t ? ' filled' : '') + (state.showThird && i === 2 ? ' pop' : '') +
      '" data-act="clear-slot" data-i="' + i + '"' + (locked ? ' disabled' : '') + '>' +
      (t ? '<div class="g">' + esc(t.glyph) + '</div><div class="n">' + esc(t.name) + '</div>' : '') +
      '</button>'
    );
  }
  var selected = {};
  state.anvil.forEach(function (t) { if (t) selected[t.key] = true; });
  var tilesHtml = inventoryTiles().map(function (t) {
    var cls = "tile";
    if (selected[t.key]) cls += " on";
    if (state.nudgeKey === t.key) cls += " nudge";
    if (state.glowKey === t.key) cls += " glow";
    return (
      '<button class="' + cls + '" data-act="pick-tile" data-key="' + esc(t.key) + '"' + (locked ? " disabled" : "") + '>' +
        '<div class="g">' + esc(t.glyph) + '</div><div class="n">' + esc(t.name) + '</div>' +
      '</button>'
    );
  }).join("");

  var lockBanner = "";
  if (state.sessionDone) {
    lockBanner =
      '<div class="locked-banner">' +
        '<p>Session complete. Start a new session to discover more.</p>' +
        '<button class="btn-primary" data-act="show-summary">Session summary</button>' +
        '<button class="btn-ghost" data-act="new-session">New session</button>' +
      '</div>';
  } else if (state.sessionLocked) {
    lockBanner =
      '<div class="locked-banner">' +
        '<p>Today\'s five are ready. Review them to unlock the next session.</p>' +
        '<button class="btn-primary" data-act="start-review">Review today\'s ' + SESSION_CAP + '</button>' +
      '</div>';
  }

  return (
    '<div class="shell">' +
      '<div class="topbar"><div class="group">' +
        '<button class="ibtn" data-act="change-level" title="Change level">' + esc(state.level) + '</button>' +
        '<div class="pill">Discovered <b>' + found + '</b> / ' + total + '</div>' +
        '<div class="pill session">New kanji today: <b>' + state.sessionNew.length + '</b> / ' + SESSION_CAP + '</div>' +
      '</div><div class="group"><button class="ibtn" data-act="open-book">Book</button></div></div>' +
      '<div class="tools">' +
        '<button class="toggle' + (state.hintsOn ? ' on' : '') + '" data-act="toggle-hints"><span class="dot"></span>Hints ' + (state.hintsOn ? 'on' : 'off') + '</button>' +
      '</div>' +
      '<div class="anvil"><div class="lbl">Anvil</div>' +
        '<div class="slots' + (state.shaking ? ' shake' : '') + (locked ? ' locked' : '') + '">' + slotHtml.join("") + '</div>' +
        lockBanner +
        renderHintPanel() +
      '</div>' +
      '<div class="reveal">' + (state.card ? renderCard(state.card, state.celebrate) : '') + '</div>' +
      '<div class="inv"><div class="lbl">Inventory</div><div class="grid' + (locked ? ' locked' : '') + '">' + tilesHtml + '</div></div>' +
    '</div>'
  );
}

function renderBook() {
  var list = recipesForLevel(state.level);
  var total = list.length;
  var found = state.discovered.length;
  var focus = state.bookFocus ? recipeFor(state.bookFocus) : null;
  var focusMeta = state.bookFocus ? kanjiMeta(state.bookFocus) : null;
  var detail = "";
  if (focus && state.discovered.indexOf(focus.char) >= 0) {
    var words = wordsUsing(focus.char);
    var typeLabel = MNEMONIC_LABELS[focus.mnemonic_type] || "memory aid only";
    var partsHtml = (focus.parts || []).map(function (p, i) {
      return (i ? '<span class="plus">+</span>' : '') +
        '<div class="mini"><div class="g">' + esc(partGlyph(p)) + '</div><div class="n">' + esc(partLabel(p)) + '</div></div>';
    }).join("");
    var wordRows = words.map(function (w) {
      return (
        '<button class="wordbtn" data-act="speak" data-text="' + esc(w.reading || w.word) + '">' +
          '<div class="w">' + esc(w.word) + '</div>' +
          '<div class="meta"><div class="rd">' + esc(w.reading || "") + '</div><div class="wm">' + esc(w.meaning || "") + '</div></div>' +
          '<div class="spk">♪</div>' +
        '</button>'
      );
    }).join("");
    detail =
      '<div class="detail">' +
        '<div><h2>' + esc(focus.char) + '</h2><div class="muted">' + esc((focusMeta.meaning || "").split(/[,;/]/)[0]) + '</div></div>' +
        '<div class="parts" style="justify-content:flex-start">' + (partsHtml || '<span class="muted">Starter</span>') + '</div>' +
        '<div class="mnemo"><div class="t">' + esc(typeLabel) + '</div><p>' + esc(focus.mnemonic || "") + '</p></div>' +
        '<div><div class="lbl" style="padding:0 0 8px">Words</div><div class="words">' + (wordRows || '<div class="muted">No words yet.</div>') + '</div></div>' +
        '<button class="ibtn" data-act="close-book-focus">Close</button>' +
      '</div>';
  }
  var grid = list.map(function (r) {
    if (state.discovered.indexOf(r.char) >= 0) {
      return '<button class="btile" data-act="book-open" data-char="' + esc(r.char) + '"><div class="g">' + esc(r.char) + '</div></button>';
    }
    var hint = state.hintsOn ? ((r.parts || []).map(partLabel).join(" + ") || "starter") : "";
    return '<div class="btile lock"><div class="g">?</div>' + (hint ? '<div class="h">' + esc(hint) + '</div>' : '') + '</div>';
  }).join("");

  return (
    '<div class="shell">' +
      '<div class="topbar"><div class="group">' +
        '<button class="ibtn" data-act="close-book">←</button>' +
        '<div class="pill">Book <b>' + found + '</b> / ' + total + '</div>' +
      '</div></div>' +
      '<div class="tools">' +
        '<button class="toggle' + (state.hintsOn ? ' on' : '') + '" data-act="toggle-hints"><span class="dot"></span>Hints ' + (state.hintsOn ? 'on' : 'off') + '</button>' +
        '<span class="grow"></span>' +
        '<button class="ibtn" data-act="export">Export</button>' +
        '<button class="ibtn" data-act="import">Import</button>' +
      '</div>' +
      detail +
      '<div class="book-grid">' + grid + '</div>' +
    '</div>'
  );
}

function render() {
  var root = document.getElementById("app");
  if (!state.ready) {
    root.innerHTML = state.error
      ? '<div class="center">Could not load data.<br>' + esc(state.error) + '</div>'
      : '<div class="center">Loading forge…</div>';
    return;
  }
  var body = "";
  if (state.screen === "level") body = renderLevelScreen();
  else if (state.screen === "book") body = renderBook();
  else body = renderWorkbench();
  if (state.toast) body += '<div class="toast">' + esc(state.toast) + '</div>';
  root.innerHTML = body;
}
</script>

<script>
/* ===================== LOGIC ===================== */
function clearAnvil() {
  state.showThird = false;
  state.anvil = [null, null];
}
function buildCard(recipe) {
  var meta = kanjiMeta(recipe.char);
  var meaning = (meta.meaning || "").split(/[,;/]/)[0].trim();
  var wordObj = wordFor(recipe.starter_word) || {
    word: recipe.starter_word || "",
    reading: "",
    meaning: "",
  };
  return {
    char: recipe.char,
    meaning: meaning,
    parts: recipe.parts || [],
    mnemonic: recipe.mnemonic || "",
    mnemonic_type: recipe.mnemonic_type || "invented",
    wordObj: wordObj,
  };
}
function discover(recipe, isNew) {
  if (isNew) {
    state.discovered.push(recipe.char);
    state.discoveryOrder.push(recipe.char);
    if (state.sessionNew.indexOf(recipe.char) < 0 && state.sessionNew.length < SESSION_CAP) {
      state.sessionNew.push(recipe.char);
    }
    state.glowKey = "k:" + recipe.char;
    persistLevel();
    setTimeout(function () { state.glowKey = null; render(); }, 1400);
  }
  state.failStreak = 0;
  state.nudgeKey = null;
  state.card = buildCard(recipe);
  state.celebrate = isNew;
  clearAnvil();
  render();
  var w = wordFor(recipe.starter_word);
  if (w && w.reading) speakJa(w.reading);
}
function failCombine() {
  state.shaking = true;
  state.failStreak += 1;
  render();
  setTimeout(function () {
    state.shaking = false;
    clearAnvil();
    maybeNudge();
    render();
  }, 420);
}
function maybeNudge() {
  if (state.failStreak < 5) return;
  var undiscovered = recipesForLevel(state.level).filter(function (r) {
    return r.parts && r.parts.length >= 2 && state.discovered.indexOf(r.char) < 0;
  });
  if (!undiscovered.length) { state.nudgeKey = null; return; }
  var target = undiscovered[Math.floor(Math.random() * undiscovered.length)];
  var part = target.parts[Math.floor(Math.random() * target.parts.length)];
  var tiles = inventoryTiles();
  var hit = null;
  for (var i = 0; i < tiles.length; i++) {
    if (tileMatchesPart(tiles[i], part)) { hit = tiles[i]; break; }
  }
  state.nudgeKey = hit ? hit.key : null;
  state.failStreak = 0;
}
function tryResolveAnvil() {
  if (state.sessionLocked || state.sessionDone) return;
  var filled = state.anvil.filter(Boolean);
  if (filled.length === 2 && !state.showThird) {
    var exact = findExactRecipe(filled);
    if (exact) { discover(exact, state.discovered.indexOf(exact.char) < 0); return; }
    if (anyThreePartNeedsThird(filled)) {
      state.showThird = true;
      state.anvil = [state.anvil[0], state.anvil[1], null];
      render();
      return;
    }
    failCombine();
    return;
  }
  if (filled.length === 3) {
    var exact3 = findExactRecipe(filled);
    if (exact3) discover(exact3, state.discovered.indexOf(exact3.char) < 0);
    else failCombine();
  }
}
function pickTile(key) {
  if (state.card || state.flow) return;
  if (state.sessionLocked || state.sessionDone) return;
  var tiles = inventoryTiles();
  var tile = null;
  for (var i = 0; i < tiles.length; i++) if (tiles[i].key === key) { tile = tiles[i]; break; }
  if (!tile) return;
  for (var j = 0; j < state.anvil.length; j++) {
    if (state.anvil[j] && state.anvil[j].key === key) return;
  }
  var slots = state.showThird ? 3 : 2;
  while (state.anvil.length < slots) state.anvil.push(null);
  var idx = -1;
  for (var k = 0; k < slots; k++) if (!state.anvil[k]) { idx = k; break; }
  if (idx < 0) return;
  state.anvil[idx] = tile;
  state.nudgeKey = null;
  render();
  var filled = state.anvil.filter(Boolean).length;
  if (filled === 2 || filled === 3) setTimeout(tryResolveAnvil, 70);
}
function clearSlot(i) {
  if (state.card || state.flow) return;
  if (state.sessionLocked || state.sessionDone) return;
  if (!state.anvil[i]) return;
  state.anvil[i] = null;
  var filled = state.anvil.filter(Boolean).length;
  if (state.showThird && filled < 2) {
    state.showThird = false;
    state.anvil = [state.anvil[0] || null, state.anvil[1] || null];
  }
  render();
}
function startLevel(level) {
  state.level = level;
  state.screen = "workbench";
  state.card = null;
  state.celebrate = false;
  state.bookFocus = null;
  state.failStreak = 0;
  state.nudgeKey = null;
  state.glowKey = null;
  state.flow = null;
  state.practice = null;
  state.review = null;
  state.summary = null;
  state.sentence = null;
  clearAnvil();

  var saved = loadStore()[level] || {};
  state.hintsOn = saved.hintsOn !== false;
  var starters = startersForLevel(level).map(function (r) { return r.char; });
  var savedDisc = Array.isArray(saved.discovered) ? saved.discovered : [];
  var savedOrder = Array.isArray(saved.discoveryOrder) ? saved.discoveryOrder : [];
  var scope = {};
  recipesForLevel(level).forEach(function (r) { scope[r.char] = true; });
  var discMap = {};
  starters.concat(savedDisc).forEach(function (c) { if (scope[c]) discMap[c] = true; });
  state.discovered = Object.keys(discMap);
  var order = [];
  function pushUnique(c) { if (scope[c] && discMap[c] && order.indexOf(c) < 0) order.push(c); }
  starters.forEach(pushUnique);
  savedOrder.forEach(pushUnique);
  state.discovered.forEach(pushUnique);
  state.discoveryOrder = order;

  var sess = Array.isArray(saved.sessionNew) ? saved.sessionNew.filter(function (c) {
    return state.discovered.indexOf(c) >= 0;
  }) : [];
  state.sessionNew = sess.slice(0, SESSION_CAP);
  state.sessionLocked = !!saved.sessionLocked || state.sessionNew.length >= SESSION_CAP;
  state.sessionDone = !!saved.sessionDone;
  if (state.sessionDone) state.sessionLocked = true;

  persistLevel();
  render();
}
function exportProgress() {
  var data = localStorage.getItem(STORAGE_KEY) || "{}";
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(data).then(
      function () { showToast("Progress copied"); },
      function () { prompt("Copy your progress JSON:", data); }
    );
  } else {
    prompt("Copy your progress JSON:", data);
  }
}
function importProgress() {
  var raw = prompt("Paste progress JSON:");
  if (raw == null || !String(raw).trim()) return;
  try {
    var parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== "object") throw new Error("bad");
    localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
    if (state.level) startLevel(state.level);
    else render();
    showToast("Progress imported");
  } catch (e) {
    showToast("Import failed");
  }
}
function answerPractice(i) {
  var p = state.practice;
  if (!p || p.answered) return;
  var c = p.choices[i];
  if (!c) return;
  p.answered = true;
  p.picked = i;
  p.correct = !!c.correct;
  p.showMnemonic = !p.correct;
  render();
  if (p.correct) {
    setTimeout(function () {
      if (state.practice === p && p.answered && p.correct) advancePractice();
    }, 450);
  }
}
function advancePractice() {
  var p = state.practice;
  if (!p) return;
  if (p.index + 1 < p.kinds.length) {
    p.index += 1;
    p.answered = false;
    p.picked = -1;
    p.correct = false;
    p.choices = null;
    p.showMnemonic = false;
    ensurePracticeChoices();
    render();
    return;
  }
  startSentence(p.char);
}
function answerReview(i) {
  var r = state.review;
  if (!r || r.answered) return;
  var c = r.choices[i];
  if (!c) return;
  r.answered = true;
  r.picked = i;
  r.correct = !!c.correct;
  r.showMnemonic = !r.correct;
  var item = r.queue[r.index];
  if (!r.correct) r.score[item.char] = false;
  render();
  if (r.correct) {
    setTimeout(function () {
      if (state.review === r && r.answered && r.correct) advanceReview();
    }, 450);
  }
}
function advanceReview() {
  var r = state.review;
  if (!r) return;
  if (r.index + 1 < r.queue.length) {
    r.index += 1;
    fillReviewChoices();
    render();
    return;
  }
  finishReviewToSummary();
}
function onClick(ev) {
  var t = ev.target.closest("[data-act]");
  if (!t) return;
  var act = t.getAttribute("data-act");
  if (act === "pick-level") { startLevel(t.getAttribute("data-level")); return; }
  if (act === "change-level") { state.screen = "level"; state.card = null; state.flow = null; render(); return; }
  if (act === "pick-tile") { pickTile(t.getAttribute("data-key")); return; }
  if (act === "clear-slot") { clearSlot(Number(t.getAttribute("data-i"))); return; }
  if (act === "continue-practice") {
    var pch = state.card && state.card.char;
    state.card = null;
    state.celebrate = false;
    state.pendingPractice = null;
    if (pch) startPracticeLadder(pch);
    else render();
    return;
  }
  if (act === "dismiss-card") {
    if (ev.target.closest("[data-stop]")) return;
    // New discoveries must use Continue (starts practice).
    if (state.celebrate) return;
    state.card = null;
    state.celebrate = false;
    render();
    return;
  }
  if (act === "speak") { speakJa(t.getAttribute("data-text") || ""); return; }
  if (act === "open-book") { state.screen = "book"; state.bookFocus = null; state.card = null; render(); return; }
  if (act === "open-book-char") {
    if (state.celebrate && state.card) state.pendingPractice = state.card.char;
    state.screen = "book"; state.bookFocus = t.getAttribute("data-char");
    state.card = null; state.celebrate = false; render(); return;
  }
  if (act === "close-book") {
    state.screen = "workbench"; state.bookFocus = null;
    if (state.pendingPractice) {
      var pending = state.pendingPractice;
      state.pendingPractice = null;
      startPracticeLadder(pending);
      return;
    }
    render();
    return;
  }
  if (act === "close-book-focus") { state.bookFocus = null; render(); return; }
  if (act === "book-open") { state.bookFocus = t.getAttribute("data-char"); render(); return; }
  if (act === "toggle-hints") { state.hintsOn = !state.hintsOn; persistLevel(); render(); return; }
  if (act === "export") { exportProgress(); return; }
  if (act === "import") { importProgress(); return; }
  if (act === "practice-answer") { answerPractice(Number(t.getAttribute("data-i"))); return; }
  if (act === "practice-next") { advancePractice(); return; }
  if (act === "sentence-word") {
    if (state.sentence) speakJa(state.sentence.wordReading || state.sentence.word);
    return;
  }
  if (act === "sentence-play") {
    if (ev.target.closest("[data-stop]")) return;
    if (state.sentence) speakJa(state.sentence.reading || state.sentence.sentence);
    return;
  }
  if (act === "sentence-en") {
    if (state.sentence) { state.sentence.showEn = true; render(); }
    return;
  }
  if (act === "sentence-done") { finishLadderToWorkbench(); return; }
  if (act === "start-review") { startSessionReview(false); return; }
  if (act === "review-answer") { answerReview(Number(t.getAttribute("data-i"))); return; }
  if (act === "review-next") { advanceReview(); return; }
  if (act === "review-again") { startSessionReview(true); return; }
  if (act === "new-session") { newSession(); return; }
  if (act === "show-summary") {
    if (!state.summary) {
      state.summary = state.sessionNew.map(function (ch) {
        return { char: ch, ok: true, meaning: shortMeaning(ch) };
      });
    }
    state.flow = "summary";
    render();
    return;
  }
}
document.getElementById("app").addEventListener("click", onClick);
if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = function () {};
(async function boot() {
  render();
  await loadData();
  render();
})();
</script>
</body>
