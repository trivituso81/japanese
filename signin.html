<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Sign in — トムさんの勉強ガイド</title>
<style>
  :root {
    --bg: #eef2f8; --card: #fff; --text: #12141a; --soft: #445064;
    --accent: #0e7490; --miss: #be1248; --ok: #0f766e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; font-family: -apple-system, system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }
  main {
    width: min(100%, 380px); background: var(--card); border: 2px solid var(--text);
    border-radius: 12px; padding: 28px 22px; text-align: center;
    box-shadow: 4px 4px 0 rgba(18,20,26,.12);
    display: flex; flex-direction: column; gap: 14px; align-items: stretch;
  }
  h1 { font-size: 1.25rem; margin: 0; line-height: 1.35; }
  p { margin: 0; color: var(--soft); font-size: 15px; line-height: 1.5; }
  #detail { color: var(--soft); font-size: 14px; }
  #err { color: var(--miss); font-size: 14px; font-weight: 600; min-height: 0; white-space: pre-wrap; }
  #status { font-size: 14px; color: var(--soft); min-height: 1.2em; }
  main[data-state="success"] #status { color: var(--ok); font-weight: 600; }
  main[data-state="failure"] #status { color: var(--miss); font-weight: 600; }
  #gisBtn { display: flex; justify-content: center; min-height: 48px; min-width: 0; }
  #gisBtn > div { width: 100%; max-width: 320px; }
  a.primary, button.primary {
    display: block; width: 100%; min-height: 52px; padding: 12px 16px;
    font: inherit; font-size: 16px; font-weight: 700; border-radius: 8px;
    border: 2px solid var(--accent); background: var(--accent); color: #fff;
    cursor: pointer; text-decoration: none; text-align: center;
    -webkit-tap-highlight-color: rgba(14,116,144,.25);
    box-sizing: border-box; line-height: 1.3;
    appearance: none; -webkit-appearance: none;
  }
  button.primary:disabled { opacity: .55; cursor: default; }
  .link, button.link {
    display: block; width: 100%; min-height: 52px; padding: 12px 16px;
    font: inherit; font-size: 16px; font-weight: 700; border-radius: 8px;
    border: 2px solid var(--text); background: var(--card); color: var(--text);
    cursor: pointer; text-decoration: none; text-align: center;
    box-sizing: border-box; line-height: 1.3;
    appearance: none; -webkit-appearance: none;
  }
  [hidden] { display: none !important; }
</style>
<script src="firebase-config.js?v=20260828y"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<main id="card" data-state="checking">
  <h1 id="title">Sign in with Google</h1>
  <p id="lead">Tap the Google button below. After you pick your account, this page will finish signing you in.</p>
  <p id="detail">Progress backs up to your Google account via Firebase (not Google Drive).</p>
  <p id="status">Loading Google…</p>
  <p id="err"></p>
  <div id="gisBtn"></div>
  <button type="button" class="primary" id="go" hidden>Continue with Google</button>
  <button type="button" class="primary" id="continueHome" hidden>Continue</button>
  <button type="button" class="link" id="tryAgain" hidden>Try again</button>
  <button type="button" class="link" id="signOutBtn" hidden>Sign out</button>
  <a class="link" id="back" href="./index.html?v=20260828y#/">Back to study guide</a>
  <button type="button" class="link" id="exitBtn" hidden>Exit</button>
</main>
<script>
(function () {
  var BUILD = "20260828y";
  var KEY = "mnn-study-v1";
  var KEY_JUST = KEY + ":justSignedIn";
  var KEY_EXPECT = KEY + ":expectAuth";
  var KEY_HINT = KEY + ":authHint";
  var HOME = "./index.html?v=" + BUILD + "&r=" + Date.now() + "&signedin=1#/";
  var EXIT = "./index.html?v=" + BUILD + "&r=" + Date.now() + "#/";
  var CLIENT_ID = window.GOOGLE_CLIENT_ID || "";
  var IS_IOS = /iPhone|iPad|iPod/i.test(navigator.userAgent)
    || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  var card = document.getElementById("card");
  var title = document.getElementById("title");
  var lead = document.getElementById("lead");
  var detail = document.getElementById("detail");
  var status = document.getElementById("status");
  var err = document.getElementById("err");
  var gisBtn = document.getElementById("gisBtn");
  var go = document.getElementById("go");
  var continueHome = document.getElementById("continueHome");
  var tryAgain = document.getElementById("tryAgain");
  var signOutBtn = document.getElementById("signOutBtn");
  var back = document.getElementById("back");
  var exitBtn = document.getElementById("exitBtn");
  var settled = false;
  var signingIn = false;
  var auth = null;
  var gisReady = false;

  function setVisible(el, on) {
    if (!el) return;
    if (on) el.removeAttribute("hidden");
    else el.setAttribute("hidden", "");
  }

  function showReady() {
    settled = false;
    signingIn = false;
    card.setAttribute("data-state", "ready");
    title.textContent = "Sign in with Google";
    lead.textContent = IS_IOS
      ? "Tap the Google button. Safari will open your account picker, then bring you back here."
      : "Tap the Google button below. After you pick your account, this page will finish signing you in.";
    detail.textContent = "Progress backs up to your Google account via Firebase (not Google Drive).";
    status.textContent = gisReady
      ? "Ready. Tap the Google button (or Continue below)."
      : "Ready. Tap Continue with Google.";
    err.textContent = "";
    setVisible(gisBtn, gisReady);
    setVisible(go, true);
    go.disabled = false;
    setVisible(continueHome, false);
    setVisible(tryAgain, false);
    setVisible(signOutBtn, false);
    setVisible(back, true);
    setVisible(exitBtn, false);
  }

  function showChecking(msg) {
    card.setAttribute("data-state", "checking");
    title.textContent = "Sign in with Google";
    lead.textContent = "Finishing Google sign-in…";
    status.textContent = msg || "Checking sign-in…";
    err.textContent = "";
    setVisible(gisBtn, false);
    setVisible(go, false);
    setVisible(continueHome, false);
    setVisible(tryAgain, false);
    setVisible(signOutBtn, false);
    setVisible(back, false);
    setVisible(exitBtn, false);
  }

  function showSuccess(user) {
    if (settled) return;
    settled = true;
    signingIn = false;
    card.setAttribute("data-state", "success");
    title.textContent = "Signed in";
    var email = (user && user.email) ? user.email : "Google account";
    lead.textContent = "You are signed in as " + email + ".";
    detail.textContent = "Progress will back up to this Google account via Firebase (not Google Drive).";
    status.textContent = "Sign-in successful.";
    err.textContent = "";
    try {
      sessionStorage.setItem(KEY_JUST, "1");
      localStorage.setItem(KEY_EXPECT, "1");
      localStorage.setItem(KEY_HINT, JSON.stringify({
        uid: user && user.uid ? user.uid : "",
        email: user && user.email ? user.email : "",
        at: Date.now()
      }));
      localStorage.removeItem(KEY + ":guest");
    } catch (e) {}
    setVisible(gisBtn, false);
    setVisible(go, false);
    setVisible(continueHome, true);
    setVisible(tryAgain, false);
    setVisible(signOutBtn, true);
    setVisible(back, false);
    setVisible(exitBtn, false);
  }

  function showFailure(msg) {
    if (settled && card.getAttribute("data-state") === "success") return;
    settled = true;
    signingIn = false;
    card.setAttribute("data-state", "failure");
    title.textContent = "Sign-in failed";
    lead.textContent = "Google sign-in did not finish on this page.";
    detail.textContent = "You can try again, or exit back to the study guide.";
    status.textContent = "Sign-in was not completed.";
    err.textContent = msg || "Sign-in failed.";
    setVisible(gisBtn, false);
    setVisible(go, false);
    setVisible(continueHome, false);
    setVisible(tryAgain, true);
    setVisible(signOutBtn, false);
    setVisible(back, false);
    setVisible(exitBtn, true);
  }

  function goHome() {
    try {
      sessionStorage.setItem(KEY_JUST, "1");
      localStorage.setItem(KEY_EXPECT, "1");
    } catch (e) {}
    status.textContent = "Opening study guide…";
    location.replace(HOME);
  }

  function exitHome() {
    try {
      sessionStorage.removeItem(KEY_JUST);
      localStorage.removeItem(KEY_EXPECT);
    } catch (e) {}
    location.replace(EXIT);
  }

  function friendly(e) {
    var code = e && e.code ? e.code : "";
    if (code === "auth/operation-not-allowed") return "Google sign-in is not enabled in Firebase yet.";
    if (code === "auth/unauthorized-domain") return "This website is not an authorised domain in Firebase.";
    if (code === "auth/popup-blocked") return "Safari blocked the sign-in window. Tap the Google button and try again.";
    if (code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request") {
      return "Sign-in was cancelled.";
    }
    if (code === "auth/network-request-failed") return "Network error. Check Wi‑Fi/cellular and try again.";
    if (code === "auth/invalid-credential") return "Google sign-in returned an invalid credential. Try again.";
    return (e && e.message) || "Sign-in failed.";
  }

  function finishWithIdToken(idToken) {
    if (!idToken) return showFailure("Google did not return an ID token.");
    if (signingIn || settled) return;
    signingIn = true;
    showChecking("Finishing sign-in…");
    go.disabled = true;
    var cred = firebase.auth.GoogleAuthProvider.credential(idToken);
    auth.signInWithCredential(cred)
      .then(function (result) {
        if (result && result.user) {
          return auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
            .catch(function () {})
            .then(function () { showSuccess(result.user); });
        }
        signingIn = false;
        showFailure("No Google account returned.");
      })
      .catch(function (e) {
        signingIn = false;
        showFailure(friendly(e));
      });
  }

  function clickGisButton() {
    var btn = document.querySelector("#gisBtn div[role=button], #gisBtn [role=button]");
    if (btn) {
      btn.click();
      return true;
    }
    return false;
  }

  function startFirebasePopup() {
    if (signingIn || settled) return;
    err.textContent = "";
    status.textContent = "Opening Google…";
    go.disabled = true;
    signingIn = true;
    var provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    auth.signInWithPopup(provider)
      .then(function (result) {
        if (result && result.user) showSuccess(result.user);
        else {
          signingIn = false;
          showFailure("No Google account returned.");
        }
      })
      .catch(function (e) {
        signingIn = false;
        go.disabled = false;
        showFailure(friendly(e));
      });
  }

  function renderGis() {
    if (!CLIENT_ID || !window.google || !google.accounts || !google.accounts.id) return false;
    try {
      var loginUri = location.href.split("#")[0];
      google.accounts.id.initialize({
        client_id: CLIENT_ID,
        callback: function (response) {
          if (!response || !response.credential) return showFailure("Google did not return a credential.");
          finishWithIdToken(response.credential);
        },
        auto_select: false,
        cancel_on_tap_outside: true,
        context: "signin",
        /* Redirect on iPhone — Firebase redirect via firebaseapp.com breaks on
           Safari 16.1+ (third-party storage). GIS redirect stays same-origin. */
        ux_mode: IS_IOS ? "redirect" : "popup",
        login_uri: loginUri,
        use_fedcm_for_prompt: false
      });
      google.accounts.id.renderButton(gisBtn, {
        type: "standard",
        theme: "outline",
        size: "large",
        text: "continue_with",
        shape: "rectangular",
        logo_alignment: "left",
        width: Math.min(320, Math.max(240, gisBtn.clientWidth || 300))
      });
      gisReady = true;
      return true;
    } catch (e) {
      return false;
    }
  }

  function waitForGis(tries) {
    if (renderGis()) {
      if (!settled) showReady();
      return;
    }
    if (tries <= 0) {
      if (!settled) showReady();
      return;
    }
    setTimeout(function () { waitForGis(tries - 1); }, 200);
  }

  if (!window.FIREBASE_CONFIG || typeof firebase === "undefined") {
    showFailure("Could not load Google sign-in. Check your connection, then reload.");
    return;
  }
  if (!CLIENT_ID) {
    showFailure("Google sign-in is not configured on this page.");
    return;
  }
  try {
    if (!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
  } catch (e) {
    showFailure((e && e.message) || "Firebase failed to start.");
    return;
  }

  auth = firebase.auth();
  back.href = EXIT;

  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function () {});

  /* Ignore stale Firebase redirect attempts from older builds. */
  try {
    Promise.race([
      auth.getRedirectResult(),
      new Promise(function (resolve) { setTimeout(resolve, 1200); })
    ]).then(function (result) {
      if (result && result.user && !settled) showSuccess(result.user);
    }).catch(function () {});
  } catch (e) {}

  auth.onAuthStateChanged(function (user) {
    if (user && !settled && !signingIn) showSuccess(user);
  });

  continueHome.addEventListener("click", goHome);
  tryAgain.addEventListener("click", function () {
    settled = false;
    waitForGis(50);
  });
  exitBtn.addEventListener("click", exitHome);
  signOutBtn.addEventListener("click", function () {
    status.textContent = "Signing out…";
    try {
      sessionStorage.removeItem(KEY_JUST);
      localStorage.removeItem(KEY_EXPECT);
      localStorage.removeItem(KEY_HINT);
    } catch (e) {}
    var done = function () {
      settled = false;
      gisReady = false;
      gisBtn.innerHTML = "";
      waitForGis(50);
    };
    try {
      auth.signOut().then(done).catch(done);
    } catch (e) {
      done();
    }
  });

  go.addEventListener("click", function () {
    if (clickGisButton()) {
      status.textContent = "Choose your Google account…";
      return;
    }
    startFirebasePopup();
  });

  waitForGis(50);
})();
</script>
</body>
</html>
