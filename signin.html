<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Sign in — トムさんの勉強ガイド</title>
<style>
  :root {
    --bg: #eef2f8; --card: #fff; --text: #12141a; --soft: #445064;
    --accent: #0e7490; --miss: #be1248;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; font-family: -apple-system, system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }
  main {
    width: min(100%, 380px); background: var(--card); border: 2px solid var(--text);
    border-radius: 12px; padding: 28px 22px; text-align: center;
    box-shadow: 4px 4px 0 rgba(18,20,26,.12);
    display: flex; flex-direction: column; gap: 14px; align-items: stretch;
  }
  h1 { font-size: 1.25rem; margin: 0; line-height: 1.35; }
  p { margin: 0; color: var(--soft); font-size: 15px; line-height: 1.5; }
  #err { color: var(--miss); font-size: 14px; font-weight: 600; min-height: 1.2em; white-space: pre-wrap; }
  #status { font-size: 14px; color: var(--soft); min-height: 1.2em; }
  button, .link {
    display: block; width: 100%; min-height: 52px; padding: 12px 16px;
    font: inherit; font-size: 16px; font-weight: 700; border-radius: 8px;
    border: 2px solid var(--text); background: var(--card); color: var(--text);
    cursor: pointer; text-decoration: none; text-align: center;
    -webkit-tap-highlight-color: rgba(14,116,144,.25);
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .55; }
</style>
<script src="firebase-config.js?v=20260823k"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
</head>
<body>
<main>
  <h1>Sign in with Google</h1>
  <p>Tap <b>Continue with Google</b>. After you pick your account, you will return to the study guide.</p>
  <p id="status">Ready. Tap the button below.</p>
  <p id="err"></p>
  <button type="button" class="primary" id="go">Continue with Google</button>
  <button type="button" id="popup" hidden>Try another sign-in method</button>
  <a class="link" id="back" href="./index.html?v=20260823k#/">Back to study guide</a>
</main>
<script>
(function () {
  var HOME = "./index.html?v=20260823k&r=" + Date.now() + "#/";
  var status = document.getElementById("status");
  var err = document.getElementById("err");
  var go = document.getElementById("go");
  var popupBtn = document.getElementById("popup");
  var signedIn = false;
  var redirectStarted = false;

  function showErr(msg) {
    err.textContent = msg || "Sign-in failed.";
    status.textContent = "You can try again, or go back.";
    go.disabled = false;
    go.textContent = "Try again with Google";
    popupBtn.hidden = false;
  }

  function goHome() {
    if (signedIn) return;
    signedIn = true;
    status.textContent = "Signed in. Returning…";
    location.replace(HOME);
  }

  function provider() {
    var p = new firebase.auth.GoogleAuthProvider();
    p.setCustomParameters({ prompt: "select_account" });
    p.addScope("email");
    p.addScope("profile");
    return p;
  }

  function friendly(e) {
    var code = e && e.code ? e.code : "";
    if (code === "auth/operation-not-allowed") {
      return "Google sign-in is not enabled in Firebase yet.";
    }
    if (code === "auth/unauthorized-domain") {
      return "This website is not an authorised domain in Firebase.";
    }
    if (code === "auth/popup-blocked") {
      return "Safari blocked the sign-in window. Tap Continue with Google instead.";
    }
    if (code === "auth/popup-closed-by-user") {
      return "Sign-in was closed before finishing. Tap to try again.";
    }
    if (code === "auth/network-request-failed") {
      return "Network error. Check Wi‑Fi/cellular and try again.";
    }
    return (e && e.message) || "Sign-in failed.";
  }

  if (!window.FIREBASE_CONFIG || typeof firebase === "undefined") {
    showErr("Could not load Google sign-in. Check your connection (and turn off content blockers for this site), then reload.");
    return;
  }

  try {
    if (!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
  } catch (e) {
    showErr((e && e.message) || "Firebase failed to start.");
    return;
  }

  var auth = firebase.auth();

  /* Never leave the button disabled waiting on Safari — getRedirectResult can hang forever. */
  go.disabled = false;
  status.textContent = "Ready. Tap the button below.";

  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function () {});

  auth.onAuthStateChanged(function (user) {
    if (user) goHome();
  });

  /* Race: if redirect result never arrives, keep UI usable. */
  var redirectWait = Promise.race([
    auth.getRedirectResult().then(function (result) { return result; }),
    new Promise(function (resolve) {
      setTimeout(function () { resolve({ __timeout: true }); }, 2000);
    })
  ]);

  redirectWait.then(function (result) {
    if (result && result.user) {
      goHome();
      return;
    }
    if (result && result.__timeout) {
      status.textContent = "Ready. Tap Continue with Google.";
      return;
    }
    status.textContent = "Ready. Tap Continue with Google.";
  }).catch(function (e) {
    showErr(friendly(e));
  });

  function startRedirect() {
    err.textContent = "";
    status.textContent = "Opening Google…";
    go.disabled = true;
    redirectStarted = true;
    auth.signInWithRedirect(provider()).catch(function (e) {
      showErr(friendly(e));
    });
    /* If Safari never navigates away, unlock the button again. */
    setTimeout(function () {
      if (signedIn || document.hidden) return;
      if (redirectStarted) {
        go.disabled = false;
        popupBtn.hidden = false;
        status.textContent = "Still here? Try again, or use the other method.";
        err.textContent = "Google did not open. Turn off content blockers for trivituso81.github.io, then try again.";
      }
    }, 4000);
  }

  function startPopup() {
    err.textContent = "";
    status.textContent = "Opening Google…";
    go.disabled = true;
    popupBtn.disabled = true;
    auth.signInWithPopup(provider())
      .then(function (result) {
        if (result && result.user) goHome();
        else showErr("No Google account returned.");
      })
      .catch(function (e) {
        popupBtn.disabled = false;
        showErr(friendly(e));
      });
  }

  go.addEventListener("click", startRedirect);
  popupBtn.addEventListener("click", startPopup);
})();
</script>
</body>
</html>
